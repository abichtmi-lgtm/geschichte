// ------------------------------------------------------------------ Zustand
let stufe = null;
let stand = {};   // je Uebung: {richtig, beantwortet, gesamt}

const inhalt = document.getElementById("inhalt");
const stufenEl = document.getElementById("stufen");
const punkteEl = document.getElementById("punkte");

function el(tag, attrs, html) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function mischen(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function sp(d, du, sie) { return d.du ? du : sie; }

STUFEN.forEach(s => {
  const b = el("button", { type: "button", "aria-pressed": "false", "data-id": s.id, text: s.label });
  b.addEventListener("click", () => waehle(s.id));
  stufenEl.appendChild(b);
});

function waehle(id) {
  stufe = STUFEN.find(s => s.id === id);
  if (!stufe) return;
  stufenEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id ? "true" : "false"));
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  try { localStorage.setItem("urteil_stufe", id); } catch (e) {}
  stand = {};
  zeichne();
  window.scrollTo(0, 0);
}

function punkte() {
  let r = 0, g = 0;
  Object.values(stand).forEach(x => { r += x.richtig; g += x.gesamt; });
  punkteEl.textContent = stufe ? "Punkte: " + r + " / " + g : "";
}

// ------------------------------------------------------------------ Aufbau
function zeichne() {
  const d = stufe;
  inhalt.innerHTML = "";
  inhalt.appendChild(el("h2", { text: d.titel }));
  inhalt.appendChild(el("p", { class: "intro", text: d.intro }));

  // Verstehen
  inhalt.appendChild(el("h2", { text: "1  Verstehen" }));
  const fall = el("div", { class: "fall" }, '<div class="kl">' + d.fallKl + "</div>" + d.fall);
  inhalt.appendChild(fall);
  const bild = el("div", { class: "bild" });
  bild.appendChild(el("div", { class: "linse s" }, "<b>" + d.bild.s[0] + "</b>" + d.bild.s[1] + "<div><small>→ Sachurteil</small></div>"));
  bild.appendChild(el("div", { class: "pf", "aria-hidden": "true" }, "&larr;"));
  bild.appendChild(el("div", { class: "mitte" }, "Ein Thema:<br>" + d.bild.mitte));
  bild.appendChild(el("div", { class: "pf", "aria-hidden": "true" }, "&rarr;"));
  bild.appendChild(el("div", { class: "linse w" }, "<b>" + d.bild.w[0] + "</b>" + d.bild.w[1] + "<div><small>→ Werturteil</small></div>"));
  inhalt.appendChild(bild);

  const merk = el("div", { class: "merk", style: "--n:" + d.merk.length });
  d.merk.forEach(m => {
    const k = el("div", { class: "karte " + KAT[m.k].cls });
    k.appendChild(el("h3", { text: m.titel }));
    const dl = el("dl");
    m.zeilen.forEach(([a, b]) => { dl.appendChild(el("dt", { text: a })); dl.appendChild(el("dd", { text: b })); });
    k.appendChild(dl);
    merk.appendChild(k);
  });
  inhalt.appendChild(merk);
  inhalt.appendChild(el("div", { class: "tipp" }, '<div class="kopf">Tipp</div><div class="inh">' + d.tipp + "</div>"));

  // Ueben
  inhalt.appendChild(el("h2", { text: "2  Üben" }));
  d.uebungen.forEach((u, i) => inhalt.appendChild(uebung(u, i)));
  Object.keys(stand).forEach(k => aktualisiere(k));

  // Schreiben
  inhalt.appendChild(el("h2", { text: "3  Selbst urteilen" }));
  inhalt.appendChild(schreiben(d.schreiben));
  punkte();
}

function aufklapp(titel, standId) {
  const box = el("details", { class: "uebung" });
  const sum = el("summary");
  const kz = el("div", { class: "kopfzeile" });
  kz.appendChild(el("h3", { text: titel }));
  if (standId) kz.appendChild(el("span", { class: "stand", id: standId }));
  sum.appendChild(kz);
  box.appendChild(sum);
  const koerper = el("div", { class: "koerper" });
  box.appendChild(koerper);
  return [box, koerper];
}
function kopf(u, i) {
  const [box, koerper] = aufklapp(u.titel, "stand" + i);
  koerper.appendChild(el("p", { class: "auftrag", text: u.auftrag }));
  return [box, koerper];
}
function aktualisiere(i) {
  const s = stand[i];
  const e = document.getElementById("stand" + i);
  if (e) e.textContent = s.beantwortet === 0 ? s.gesamt + " Aufgaben" : s.beantwortet + " von " + s.gesamt + " bearbeitet · " + s.richtig + " richtig";
  punkte();
}
function rueckmeldung(ok, text, loesung) {
  return el("div", { class: "rm", "aria-live": "polite" },
    (ok ? "<b>Richtig.</b>" : "<b>Nicht ganz" + (loesung ? " – richtig: " + loesung : "") + ".</b>") + " " + text);
}

function uebung(u, i) {
  const [box, koerper] = kopf(u, i);
  const liste = el("div");
  koerper.appendChild(liste);
  const neu = el("button", { type: "button", class: "btn neu", text: "Übung neu mischen" });
  neu.addEventListener("click", () => fuelle());
  koerper.appendChild(neu);

  function fuelle() {
    liste.innerHTML = "";
    if (u.typ === "zuordnen") {
      stand[i] = { richtig: 0, beantwortet: 0, gesamt: u.items.length };
      mischen(u.items).forEach(([text, loes, erkl]) => {
        const it = el("div", { class: "item" });
        it.appendChild(el("div", { class: "satz", text: text }));
        const w = el("div", { class: "wahl" });
        u.kat.forEach(k => {
          const b = el("button", { type: "button", class: KAT[k].cls, text: KAT[k].kurz });
          b.addEventListener("click", () => {
            const ok = k === loes;
            w.querySelectorAll("button").forEach(x => x.disabled = true);
            b.classList.add("gewaehlt");
            it.classList.add(ok ? "ok" : "no");
            it.appendChild(rueckmeldung(ok, erkl, KAT[loes].kurz));
            stand[i].beantwortet++; if (ok) stand[i].richtig++;
            aktualisiere(i);
          });
          w.appendChild(b);
        });
        it.appendChild(w);
        liste.appendChild(it);
      });
    } else if (u.typ === "auswahl") {
      stand[i] = { richtig: 0, beantwortet: 0, gesamt: u.fragen.length };
      u.fragen.forEach(q => {
        const it = el("div", { class: "item" });
        it.appendChild(el("div", { class: "satz" }, "<b>" + q.f + "</b>"));
        const lang = q.o.some(o => o[0].length > 40);
        const w = el("div", { class: "wahl" + (lang ? " spalte" : "") });
        mischen(q.o).forEach(([text, ok, erkl]) => {
          const b = el("button", { type: "button", text: text });
          b.addEventListener("click", () => {
            w.querySelectorAll("button").forEach(x => x.disabled = true);
            b.classList.add("gewaehlt");
            it.classList.add(ok ? "ok" : "no");
            const richtigText = q.o.find(o => o[1])[0];
            it.appendChild(rueckmeldung(ok, erkl, ok ? "" : "„" + richtigText + "“"));
            stand[i].beantwortet++; if (ok) stand[i].richtig++;
            aktualisiere(i);
          });
          w.appendChild(b);
        });
        it.appendChild(w);
        liste.appendChild(it);
      });
    } else if (u.typ === "trennen") {
      const teile = u.saetze.reduce((n, s) => n + s.length, 0);
      stand[i] = { richtig: 0, beantwortet: 0, gesamt: teile };
      u.saetze.forEach(satz => {
        const it = el("div", { class: "item" });
        satz.forEach(([text, loes]) => {
          const zeile = el("div", { style: "margin:6px 0" });
          zeile.appendChild(el("span", { class: "teil", text: text }));
          const w = el("div", { class: "wahl", style: "margin-top:4px" });
          ["S", "W"].forEach(k => {
            const b = el("button", { type: "button", class: KAT[k].cls, text: KAT[k].kurz });
            b.addEventListener("click", () => {
              const ok = k === loes;
              w.querySelectorAll("button").forEach(x => x.disabled = true);
              b.classList.add("gewaehlt");
              zeile.querySelector(".teil").classList.add(KAT[loes].cls);
              zeile.appendChild(rueckmeldung(ok, ok ? "" : "", KAT[loes].kurz));
              stand[i].beantwortet++; if (ok) stand[i].richtig++;
              aktualisiere(i);
              if (it.querySelectorAll("button:not(:disabled)").length === 0) {
                const alleOk = [...it.querySelectorAll(".rm")].every(r => r.textContent.startsWith("Richtig"));
                it.classList.add(alleOk ? "ok" : "no");
              }
            });
            w.appendChild(b);
          });
          zeile.appendChild(w);
          it.appendChild(zeile);
        });
        liste.appendChild(it);
      });
    }
    aktualisiere(i);
  }
  fuelle();
  return box;
}

// ------------------------------------------------------------------ Schreiben mit Checkliste

function schreiben(s) {
  const d = stufe;
  const box = el("section", { class: "schreib" });
  box.appendChild(el("h3", { text: s.titel }));
  box.appendChild(el("div", { class: "fall" }, s.fall));
  box.appendChild(el("p", { text: sp(d, "Schreibe zuerst dein Urteil. Prüfe es danach mit der Checkliste. Erst dann kannst du die Musterlösung ansehen.",
                                         "Schreiben Sie zuerst Ihr Urteil. Prüfen Sie es danach mit der Checkliste. Erst dann können Sie die Musterlösung ansehen.") }));
  s.teile.forEach((t, n) => {
    const [rahmen, teil] = aufklapp((n === 0 ? "a) " : "b) ") + KAT[t.k].kurz + " schreiben und prüfen", "schreib" + n);
    rahmen.classList.add(KAT[t.k].cls);
    const stEl = rahmen.querySelector(".stand");
    const setzeStand = (_n, x) => { stEl.textContent = x; };
    rahmen.style.background = "#fff";
    teil.appendChild(el("p", { class: "aufg" }, t.aufg.replace(/^(Beurteilen Sie|Bewerten Sie|Schreibe)/, "<b>$1</b>")));
    const key = "urteil_" + d.id + "_" + n;
    const lab = el("label", { class: "fl", for: key, text: sp(d, "Dein Urteil", "Ihr Urteil") });
    teil.appendChild(lab);
    if (t.starter) teil.appendChild(el("div", { class: "starter", text: "Satzanfang: " + t.starter }));
    const ta = el("textarea", { id: key });
    try { ta.value = localStorage.getItem(key) || ""; } catch (e) {}
    ta.addEventListener("input", () => { try { localStorage.setItem(key, ta.value); } catch (e) {} });
    teil.appendChild(ta);

    const ch = el("div", { class: "check" });
    ch.appendChild(el("div", { class: "kopf", text: "Checkliste – " + sp(d, "prüfe dein Urteil", "prüfen Sie Ihr Urteil") }));
    const inh = el("div", { class: "inh" });
    t.check.forEach((c, j) => {
      const id = key + "_c" + j;
      const l = el("label", { for: id });
      const cb = el("input", { type: "checkbox", id: id });
      l.appendChild(cb);
      l.appendChild(el("span", { text: c }));
      inh.appendChild(l);
    });
    ch.appendChild(inh);
    teil.appendChild(ch);

    const erg = el("div", { class: "ergebnis", "aria-live": "polite" });
    const mu = el("div", { class: "muster" }, "<b>Musterlösung:</b> " + t.muster);
    const kn = el("div", { class: "knoepfe" });
    const pruef = el("button", { type: "button", class: "btn", text: sp(d, "Ich habe mein Urteil geprüft", "Urteil geprüft") });
    const zeig = el("button", { type: "button", class: "btn", text: "Musterlösung zeigen" });
    zeig.disabled = true;
    pruef.addEventListener("click", () => {
      const text = ta.value.trim();
      const offen = [...inh.querySelectorAll("input")].map((x, j) => x.checked ? null : t.check[j]).filter(Boolean);
      erg.className = "ergebnis";
      if (text.length < 20) {
        erg.classList.add("no");
        erg.innerHTML = sp(d, "<b>Schreibe zuerst dein Urteil</b> – mindestens einen ganzen Satz.", "<b>Schreiben Sie zuerst Ihr Urteil</b> – mindestens einen ganzen Satz.");
        return;
      }
      if (offen.length) {
        erg.classList.add("no");
        erg.innerHTML = "<b>" + sp(d, "Überarbeite dein Urteil", "Überarbeiten Sie Ihr Urteil") + "</b> " + sp(d, "bei diesen Punkten:", "bei diesen Punkten:") +
          "<ul>" + offen.map(o => "<li>" + o + "</li>").join("") + "</ul>" +
          sp(d, "Hake danach erneut ab.", "Haken Sie danach erneut ab.");
        setzeStand(n, sp(d, "überarbeiten", "überarbeiten"));
      } else {
        setzeStand(n, "geprüft");
        erg.classList.add("ok");
        erg.innerHTML = "<b>" + sp(d, "Alle Punkte erfüllt.", "Alle Punkte erfüllt.") + "</b> " + sp(d, "Vergleiche jetzt mit der Musterlösung.", "Vergleichen Sie jetzt mit der Musterlösung.");
      }
      zeig.disabled = false;
    });
    zeig.addEventListener("click", () => mu.classList.toggle("zeigen"));
    kn.appendChild(pruef);
    kn.appendChild(zeig);
    teil.appendChild(kn);
    teil.appendChild(erg);
    teil.appendChild(mu);
    box.appendChild(rahmen);
    setzeStand(n, ta.value.trim() ? "begonnen" : "offen");
    ta.addEventListener("input", () => setzeStand(n, "begonnen"));
  });
  return box;
}

// ------------------------------------------------------------------ Start
(function () {
  let id = location.hash ? location.hash.slice(1) : null;
  if (!STUFEN.some(s => s.id === id)) {
    try { id = localStorage.getItem("urteil_stufe"); } catch (e) { id = null; }
  }
  if (STUFEN.some(s => s.id === id)) waehle(id);
})();
