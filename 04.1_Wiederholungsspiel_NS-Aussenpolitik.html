<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weg in den Krieg 1933–1939</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: Aktenmappe – eine schmale Lesespalte, oben Stufenleiste wie Registerreiter, Karten als Aktenzettel mit Schreibmaschinen-Datum */
:root{
  --paper:#E4E9EE; --sheet:#F6F8FA; --sheet-2:#EDF1F4; --ink:#16202A; --ink-2:#48545F; --ink-3:#6C7783;
  --rule:#C3CCD5; --stamp:#5A3F8F; --stamp-soft:#E7E1F2;
  --ok:#2C6A45; --ok-soft:#DBEBE1; --bad:#A0302A; --bad-soft:#F5DEDA;
  --f-disp:"Spectral SC", "Iowan Old Style", Georgia, serif;
  --f-sans:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161B; --sheet:#1A2027; --sheet-2:#212831; --ink:#E3E8EC; --ink-2:#A5AFB9; --ink-3:#7C8792;
    --rule:#2E3741; --stamp:#B7A0EA; --stamp-soft:#2B2440;
    --ok:#7DC69B; --ok-soft:#1B3026; --bad:#EF8C80; --bad-soft:#3B201D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161B; --sheet:#1A2027; --sheet-2:#212831; --ink:#E3E8EC; --ink-2:#A5AFB9; --ink-3:#7C8792;
  --rule:#2E3741; --stamp:#B7A0EA; --stamp-soft:#2B2440;
  --ok:#7DC69B; --ok-soft:#1B3026; --bad:#EF8C80; --bad-soft:#3B201D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono)}

/* Kopf mit Registerreitern */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.id{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:1.1em;background:none;border:none;padding:0}
.total{font-family:var(--f-mono);font-size:.82em;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;padding:7px 10px;font-size:.85em;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-current="page"]{border-bottom-color:var(--stamp);color:var(--ink);font-weight:600}
.tabs button:disabled{color:var(--ink-3);cursor:not-allowed;opacity:.6}
.tabs .n{font-family:var(--f-mono);margin-right:4px}
.tabs .st{margin-left:4px;color:var(--ok)}

main{max-width:960px;margin:0 auto;padding-block:28px 90px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp)}
.h1{font-size:clamp(2.1rem,6.5vw,3.4rem)}
.h2{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.lead{color:var(--ink-2);max-width:62ch}
.note{font-size:.85em;color:var(--ink-3)}
.btn{background:var(--ink);color:var(--paper);border:none;border-radius:3px;padding:11px 20px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink-3)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Startseite */
.hero{display:flex;flex-direction:column;gap:14px}
.years{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid var(--ink);margin-top:6px}
.years span{font-family:var(--f-mono);font-size:.85em;padding-top:6px;border-left:1px solid var(--rule);padding-left:6px;color:var(--ink-2)}
.years span:first-child{border-left:none;padding-left:0}
.years span:last-child{color:var(--stamp);font-weight:700}
.stagelist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:3.2em 1fr auto;gap:14px;align-items:center;padding:16px 4px;border:none;border-bottom:1px solid var(--rule);background:none;text-align:left;width:100%}
.srow:hover:not(:disabled){background:var(--sheet-2)}
.srow:disabled{cursor:not-allowed}
.srow:disabled .sn,.srow:disabled b{color:var(--ink-3)}
.sn{font-family:var(--f-mono);font-size:1.6em;color:var(--stamp)}
.srow b{font-family:var(--f-disp);font-weight:500;font-size:1.3em;display:block}
.srow small{color:var(--ink-2);font-size:.9em;display:block}
.srow .afb{font-family:var(--f-mono);font-size:.75em;color:var(--ink-3)}
.badge{font-family:var(--f-mono);font-size:.8em;padding:4px 9px;line-height:1.3;border:1px solid var(--rule);border-radius:2px;white-space:nowrap;color:var(--ink-2)}
.badge.done{border-color:var(--ok);color:var(--ok)}
.freebox{display:flex;gap:8px;align-items:center;font-size:.85em;color:var(--ink-3)}

/* Stufenkopf */
.shead{display:flex;flex-direction:column;gap:8px}
.task{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--stamp);padding:12px 16px;max-width:70ch}
.task b{font-weight:700}

/* Sortier-Stufen */
.pool{background:var(--sheet-2);border:1px dashed var(--ink-3);border-radius:3px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:flex-start}
.pool.target{border-color:var(--stamp);border-style:solid}
.pool .empty{color:var(--ink-3);font-size:.9em;padding:8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:8px 11px;text-align:left;font-size:.93em;line-height:1.35;box-shadow:0 1px 0 var(--rule);max-width:100%;display:flex;flex-direction:column;gap:3px}
.pool .card{flex:0 1 250px}
.card:hover{border-color:var(--ink-3)}
.card.sel{outline:3px solid var(--stamp);outline-offset:1px;background:var(--stamp-soft)}
.card.ok{border-color:var(--ok);background:var(--ok-soft);cursor:default;box-shadow:none}
.card.wrong{border:2px dashed var(--bad);background:var(--bad-soft)}
.card .mk{font-family:var(--f-mono);font-weight:700;font-size:.85em}
.card.ok .mk{color:var(--ok)}
.card.wrong .mk{color:var(--bad)}
.card .info{font-size:.85em;color:var(--ink-2)}
.card.ok .info{font-family:var(--f-sans)}
.card .date{font-family:var(--f-mono);font-size:.85em;color:var(--ink-2)}

.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.buckets.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.bucket{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:110px;min-width:0;cursor:pointer}
.bucket.target{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.bl{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.bl b{font-family:var(--f-disp);font-weight:600;font-size:1.15em}
.bl.year b{font-family:var(--f-mono);font-size:1.3em}
.bl small{font-size:.82em;color:var(--ink-2);line-height:1.3}
.bc{display:flex;flex-direction:column;gap:6px}

/* Aktion–Reaktion */
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 2em minmax(0,1.25fr);gap:8px;align-items:stretch}
.act{background:var(--sheet-2);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.act .date{font-family:var(--f-mono);font-size:.82em;color:var(--stamp);font-weight:700}
.arrow{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);color:var(--ink-3);font-size:1.2em}
.slot{background:var(--sheet);border:1px dashed var(--ink-3);border-radius:3px;padding:8px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.slot.target{border-color:var(--stamp);border-style:solid}
.slot .ph{color:var(--ink-3);font-size:.88em}
.pair.bin .act{background:none;border-style:dashed}
@media (max-width:620px){
  .pair{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg);height:1.4em}
}

.checkbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.msg{font-size:.95em;color:var(--ink-2)}
.msg.good{color:var(--ok);font-weight:600}

/* Einzelaufgaben */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border:1px solid var(--ink-3);border-radius:50%;display:block}
.dots i.cur{border-color:var(--stamp);background:var(--stamp-soft);outline:2px solid var(--stamp);outline-offset:1px}
.dots i.r{background:var(--ok);border-color:var(--ok)}
.dots i.f{background:var(--bad);border-color:var(--bad)}
.chain{display:flex;flex-direction:column;align-items:stretch;max-width:640px}
.link{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:10px 14px}
.link.gap{border:2px dashed var(--stamp);background:var(--stamp-soft);font-family:var(--f-mono);color:var(--stamp);text-align:center;font-weight:700}
.link.gap.filled{font-family:var(--f-sans);text-align:left;font-weight:600}
.link.gap.filled.r{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.link.gap.filled.f{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.down{align-self:center;font-family:var(--f-mono);color:var(--ink-3);line-height:1;padding:3px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.opt{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;text-align:left;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--stamp)}
.opt:disabled{cursor:default}
.opt.r{border:2px solid var(--ok);background:var(--ok-soft)}
.opt.f{border:2px dashed var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.fb{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.fb .verdict{font-family:var(--f-mono);font-weight:700}
.fb.r .verdict{color:var(--ok)}
.fb.f .verdict{color:var(--bad)}

.statement{font-size:1.15em;line-height:2;max-width:62ch;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 18px}
.seg{background:none;border:none;border-bottom:2px dotted var(--ink-3);padding:1px 2px;text-align:left;line-height:1.5;display:inline}
.seg:hover:not(:disabled){background:var(--stamp-soft);border-bottom-color:var(--stamp)}
.seg:disabled{cursor:default}
.seg.r{background:var(--ok-soft);border-bottom:2px solid var(--ok)}
.seg.f{background:var(--bad-soft);border-bottom:2px solid var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}

/* Abschluss einer Stufe */
.stagedone{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--ok);border-radius:3px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.stars{font-size:1.5em;letter-spacing:.15em;color:var(--stamp)}
.stars .off{color:var(--rule)}

/* Synthese */
textarea{width:100%;min-height:180px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:12px;line-height:1.5;resize:vertical}
.eh{display:flex;flex-direction:column;gap:10px}
.eh li{margin-bottom:6px}
.eh ol{margin:0;padding-left:1.3em;max-width:70ch}
.eh h3{font-size:1.2em}
.scoretable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;max-width:560px}
.scoretable td,.scoretable th{border-bottom:1px solid var(--rule);padding:6px 4px;text-align:left}
.scoretable td:last-child,.scoretable th:last-child{text-align:right;font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){
  .card,.opt,.seg{transition:background-color .15s,border-color .15s}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="id">
      <button class="brand" id="homeBtn" type="button">Weg in den Krieg · 1933–1939</button>
      <span class="total" id="total"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Stufen"></nav>
  </div>
</header>
<main id="main"></main>

<script>

/* ============ Inhalte ============ */
const STAGES = [

},
{

  layout:"wide",
  buckets:[

    {id:"b7",t:"Enttarnung der Luftwaffe und Wehrpflicht 1935",b:"v",info:"Offener Bruch der Rüstungsbestimmungen von Versailles."},

    {id:"b14",t:"Hitler-Stalin-Pakt 1939",b:"b",info:"Formal ein Nichtangriffspakt, durch das geheime Zusatzprotokoll aber eine Absprache über die Aufteilung Osteuropas: Das Abkommen mit dem ideologischen Gegner sicherte den Angriff auf Polen ab."}
  ]
},
{
  id:"s3", type:"sort", n:3, title:"Aktion und Reaktion", afb:"AFB II",
  short:"Deutschen Schritten die Reaktion des Auslands zuordnen",
  task:"Links stehen Schritte der deutschen Außenpolitik. <b>Ordnen Sie</b> jedem die Reaktion des Auslands <b>zu</b>. Achtung: Zwei Reaktionen hat es so nie gegeben. Sie gehören in das letzte Feld.",
  layout:"pairs",
  buckets:[
    {id:"p1",date:"Juli 1934",label:"NS-Putschversuch in Wien",cap:1},

    {id:"p3",date:"März 1936",label:"Einmarsch in das entmilitarisierte Rheinland",cap:1},
    {id:"p4",date:"ab Juli 1936",label:"Militärhilfe für Franco in Spanien",cap:1},
    {id:"p5",date:"März 1938",label:"„Anschluss“ Österreichs",cap:1},
    {id:"p6",date:"September 1938",label:"Hitler droht, die Tschechoslowakei bis 1. Oktober anzugreifen",cap:1},
    {id:"p7",date:"März 1939",label:"Einmarsch in die „Rest-Tschechei“",cap:1},

try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let view = "home"; // "home" | stage id | "synth"
let RT = null;      // Laufzeit der aktuellen Stufe

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const stageById = id => STAGES.find(s => s.id === id);
const isOpen = n => S.free || n <= S.unlocked;
const synthOpen = () => S.free || S.unlocked > STAGES.length;
function maxOf(st){ return st.type === "sort" ? st.cards.length : st.items.length; }
function stars(score, max){ const q = score/max; return q >= .9 ? 3 : q >= .7 ? 2 : 1; }
function starHTML(n){ return `<span class="stars" aria-label="${n} von 3 Sternen">${"★".repeat(n)}<span class="off">${"★".repeat(3-n)}</span></span>`; }

/* ============ Navigation ============ */
function renderTop(){
  const tabs = [`<button type="button" data-go="home" ${view==="home"?'aria-current="page"':""}>Übersicht</button>`];
  for(const st of STAGES){
    const r = S.res[st.id];
    tabs.push(`<button type="button" data-go="${st.id}" ${view===st.id?'aria-current="page"':""} ${isOpen(st.n)?"":"disabled"}><span class="n">${st.n}</span>${esc(st.title)}${r?'<span class="st">✓</span>':""}</button>`);
  }
  tabs.push(`<button type="button" data-go="synth" ${view==="synth"?'aria-current="page"':""} ${synthOpen()?"":"disabled"}>Urteil</button>`);
  $("#tabs").innerHTML = tabs.join("");
  let sc = 0, mx = 0;
  for(const st of STAGES){ mx += maxOf(st); if(S.res[st.id]) sc += S.res[st.id].score; }
  $("#total").textContent = `${sc} / ${mx} Punkte`;
}
function go(v){
  view = v;
  const st = stageById(v);
  if(st) RT = startRT(st);
  render();
  window.scrollTo({top:0});
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g && !g.disabled){ go(g.dataset.go); }
});
$("#homeBtn").addEventListener("click", () => go("home"));

function render(){
  renderTop();
  const m = $("#main");
  if(view === "home") m.innerHTML = homeHTML();
  else if(view === "synth") m.innerHTML = synthHTML();
  else {
    const st = stageById(view);
    m.innerHTML = headHTML(st) + (st.type === "sort" ? sortHTML(st) : st.type === "chain" ? chainHTML(st) : errorHTML(st));
  }
}

function headHTML(st){
  return `<section class="shead">
    <p class="eyebrow">Stufe ${st.n} von ${STAGES.length} · ${st.afb}</p>
    <h2 class="h2">${esc(st.title)}</h2>
    <p class="task">${st.task}</p>
  </section>`;

/* ============ Laufzeit ============ */
function startRT(st){
  if(st.type === "sort") return {kind:"sort", order:shuffle(st.cards.map(c=>c.id)), placed:{}, locked:{}, wrong:{}, sel:null, first:null, msg:"", finished:false};
  return {kind:st.type, order:shuffle(st.items.map((_,i)=>i)), opt:st.items.map(it=>shuffle([it.ok,...(it.wrong||[])])), i:0, ans:[], chosen:null, finished:false};
}
function finish(st, score){
  RT.finished = true;
  const max = maxOf(st);
  const prev = S.res[st.id];
  if(!prev || score > prev.score) S.res[st.id] = {score, stars:stars(score,max)};
  if(S.unlocked <= st.n) S.unlocked = st.n + 1;
  save();
}
function doneHTML(st, score){
  const max = maxOf(st), n = stars(score,max);
  const next = STAGES[st.n];
  const nextBtn = next ? `<button type="button" class="btn" data-go="${next.id}">Weiter zu Stufe ${next.n}: ${esc(next.title)}</button>`
                       : `<button type="button" class="btn" data-go="synth">Weiter zum Urteil</button>`;
  return `<section class="stagedone" aria-live="polite">
    <p class="eyebrow">Stufe abgeschlossen</p>
    <h3 class="h2" style="font-size:1.5em">${score} von ${max} im ersten Versuch richtig</h3>
    ${starHTML(n)}
    <div class="btns">${nextBtn}<button type="button" class="btn ghost" data-go="${st.id}">Stufe wiederholen</button><button type="button" class="btn ghost" data-go="home">Übersicht</button></div>
  </section>`;
}

/* ============ Sortier-Stufen ============ */
function cardHTML(st, c){
  const locked = RT.locked[c.id], wrong = RT.wrong[c.id], sel = RT.sel === c.id;
  const cls = ["card", locked?"ok":"", wrong?"wrong":"", sel?"sel":""].join(" ");
  let extra = "";
  if(locked) extra = `<span class="${st.layout==="years"?"date":"info"}"><span class="mk">✓</span> ${esc(c.info)}</span>`;
  else if(wrong) extra = `<span class="mk">✗ falsch zugeordnet – neu legen</span>`;
  return `<button type="button" class="${cls}" data-card="${c.id}" ${locked?'aria-disabled="true"':""} aria-pressed="${sel}">${esc(c.t)}${extra}</button>`;
}
function sortHTML(st){
  const cards = RT.order.map(id => st.cards.find(c => c.id === id));
  const inPool = cards.filter(c => !RT.placed[c.id]);
  const selPlaced = RT.sel && RT.placed[RT.sel];
  const pool = `<div class="pool ${selPlaced?"target":""}" data-pool role="group" aria-label="Kartenstapel">
     ${inPool.length ? inPool.map(c => cardHTML(st,c)).join("") : `<span class="empty">${RT.finished ? "Alle Karten liegen richtig." : "Alle Karten sind verteilt. Jetzt prüfen."}</span>`}
     ${selPlaced ? `<span class="empty">Hier tippen, um die Karte zurückzulegen.</span>` : ""}</div>`;
  const inB = b => cards.filter(c => RT.placed[c.id] === b.id);
  let board;
  if(st.layout === "pairs"){
    board = `<div class="pairs">` + st.buckets.map(b => `
      <div class="pair ${b.bin?"bin":""}">
        <div class="act">${b.date?`<span class="date">${esc(b.date)}</span>`:""}<span>${esc(b.label)}</span></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="slot ${RT.sel?"target":""}" data-bucket="${b.id}" role="button" tabindex="0" aria-label="Reaktion für: ${esc(b.label)}">
          ${inB(b).length ? `<div class="bc">${inB(b).map(c=>cardHTML(st,c)).join("")}</div>` : `<span class="ph">${b.bin?"bis zu zwei Karten":"Reaktion hier ablegen"}</span>`}
        </div>
      </div>`).join("") + `</div>`;
  } else {
    board = `<div class="buckets ${st.layout==="wide"?"wide":""}">` + st.buckets.map(b => `
      <div class="bucket ${RT.sel?"target":""}" data-bucket="${b.id}" role="button" tabindex="0" aria-label="Ablegen bei ${esc(b.label)}">
        <div class="bl ${st.layout==="years"?"year":""}"><b>${esc(b.label)}</b>${b.sub?`<small>${esc(b.sub)}</small>`:""}</div>
        <div class="bc">${inB(b).map(c=>cardHTML(st,c)).join("")}</div>
      </div>`).join("") + `</div>`;
  }
  const allPlaced = inPool.length === 0;
  const bar = RT.finished ? doneHTML(st, RT.first) :
    `<div class="checkbar"><button type="button" class="btn" id="check" ${allPlaced?"":"disabled"}>Prüfen</button>
     <span class="msg" aria-live="polite">${RT.msg || (allPlaced ? "" : `Noch ${inPool.length} Karte${inPool.length===1?"":"n"} zu verteilen.`)}</span></div>`;
  return (RT.finished ? bar : "") + pool + board + (RT.finished ? "" : bar);
}
function placeInto(st, bId){
  const b = st.buckets.find(x => x.id === bId);
  const id = RT.sel; if(!id) return;
  if(b.cap){
    const inside = Object.keys(RT.placed).filter(k => RT.placed[k] === bId && k !== id);
    if(inside.length >= b.cap){
      const movable = inside.filter(k => !RT.locked[k]);
      if(!movable.length){ RT.msg = "Dieses Feld ist bereits richtig belegt."; RT.sel = null; render(); return; }
      delete RT.placed[movable[0]];
    }
  }
  RT.placed[id] = bId; delete RT.wrong[id]; RT.sel = null; RT.msg = "";
  render();
}
document.addEventListener("click", e => {
  if(!RT || RT.kind !== "sort" || RT.finished) return;
  const st = stageById(view); if(!st || st.type !== "sort") return;
  const card = e.target.closest("[data-card]");
  if(card){
    const id = card.dataset.card;
    // Karte in einem Feld antippen, während eine andere gewählt ist: in dieses Feld legen
    const host = card.closest("[data-bucket]");
    if(RT.sel && RT.sel !== id && host){ placeInto(st, host.dataset.bucket); return; }
    if(RT.locked[id]) return;
    RT.sel = RT.sel === id ? null : id; render(); return;
  }
  const bucket = e.target.closest("[data-bucket]");
  if(bucket && RT.sel){ placeInto(st, bucket.dataset.bucket); return; }
  if(e.target.closest("[data-pool]") && RT.sel && RT.placed[RT.sel]){
    delete RT.placed[RT.sel]; RT.sel = null; render(); return;
  }
  if(e.target.id === "check"){
    let right = 0, wrongN = 0;
    for(const c of st.cards){
      if(RT.locked[c.id]){ continue; }
      if(RT.placed[c.id] === c.b){ RT.locked[c.id] = true; right++; }
      else { RT.wrong[c.id] = true; delete RT.placed[c.id]; wrongN++; }
    }
    if(RT.first === null) RT.first = right;
    if(wrongN === 0){ finish(st, RT.first); RT.msg = ""; }
    else RT.msg = `${st.cards.length - wrongN} von ${st.cards.length} liegen richtig. ` + (wrongN === 1 ? "Die falsche Karte liegt wieder im Stapel." : `Die ${wrongN} falschen Karten liegen wieder im Stapel.`);
    RT.sel = null; render();
  }
});
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.matches("[data-bucket]")){ e.preventDefault(); e.target.click(); }
});

/* ============ Wirkungsketten ============ */
function dotsHTML(){
  const it = RT.order.length;
  let d = "";
  for(let k=0;k<it;k++){
    const cls = k < RT.ans.length ? (RT.ans[k] ? "r" : "f") : k === RT.i ? "cur" : "";
    d += `<i class="${cls}"></i>`;
  }
  return `<div class="qhead"><span class="note">Aufgabe ${Math.min(RT.i+1,it)} von ${it}</span><div class="dots" aria-hidden="true">${d}</div></div>`;
}
function scoreRT(){ return RT.ans.filter(Boolean).length; }
function chainHTML(st){
  if(RT.finished) return doneHTML(st, scoreRT());
  const idx = RT.order[RT.i], it = st.items[idx], opts = RT.opt[idx];
  const answered = RT.chosen !== null, right = answered && RT.chosen === it.ok;
  const links = it.steps.map(s => s === null
    ? (answered ? `<div class="link gap filled r">${esc(it.ok)}</div>` : `<div class="link gap">?</div>`)
    : `<div class="link">${esc(s)}</div>`).join(`<div class="down" aria-hidden="true">▼</div>`);
  const ob = opts.map((o,k) => {
    let cls = "opt";
    if(answered){ if(o === it.ok) cls += " r"; else if(o === RT.chosen) cls += " f"; else cls += " dim"; }
    return `<button type="button" class="${cls}" data-opt="${k}" ${answered?"disabled":""}>${esc(o)}</button>`;
  }).join("");
  const fb = answered ? `<div class="fb ${right?"r":"f"}" aria-live="polite"><span class="verdict">${right?"✓ Richtig":"✗ Nicht schlüssig. Die richtige Lösung steht jetzt in der Kette."}</span><p>${esc(it.expl)}</p>
      <div class="btns"><button type="button" class="btn" id="next">${RT.i+1 < RT.order.length ? "Nächste Kette" : "Stufe abschließen"}</button></div></div>` : "";
  return dotsHTML() + `<div class="chain">${links}</div><div class="opts">${ob}</div>` + fb;
}
/* ============ Fehlerjagd ============ */
function errorHTML(st){
  if(RT.finished) return doneHTML(st, scoreRT());
  const idx = RT.order[RT.i], it = st.items[idx];
  const answered = RT.chosen !== null, right = answered && RT.chosen === it.bad;
  const segs = it.parts.map((p,k) => {
    let cls = "seg";
    if(answered){ if(k === it.bad) cls += " f"; else if(k === RT.chosen) cls += " r"; }
    return `<button type="button" class="${cls}" data-seg="${k}" ${answered?"disabled":""}>${esc(p)}</button>`;
  }).join(" ");
  const fb = answered ? `<div class="fb ${right?"r":"f"}" aria-live="polite"><span class="verdict">${right?"✓ Fehler gefunden":"✗ Dieser Teil stimmt. Der Fehler ist durchgestrichen."}</span><p><b>Richtig ist:</b> ${esc(it.fix)}</p>
      <div class="btns"><button type="button" class="btn" id="next">${RT.i+1 < RT.order.length ? "Nächste Aussage" : "Stufe abschließen"}</button></div></div>` : "";
  return dotsHTML() + `<p class="statement">${segs}</p>` + fb;
}
document.addEventListener("click", e => {
  if(!RT || RT.kind === "sort" || RT.finished) return;
  const st = stageById(view); if(!st) return;
  const idx = RT.order[RT.i], it = st.items[idx];
  const o = e.target.closest("[data-opt]");
  if(o && RT.chosen === null){ RT.chosen = RT.opt[idx][+o.dataset.opt]; RT.ans.push(RT.chosen === it.ok); render(); return; }
  const s = e.target.closest("[data-seg]");
  if(s && RT.chosen === null){ RT.chosen = +s.dataset.seg; RT.ans.push(RT.chosen === it.bad); render(); return; }
  if(e.target.id === "next"){
    RT.i++; RT.chosen = null;
    if(RT.i >= RT.order.length) finish(st, scoreRT());
    render(); window.scrollTo({top:0});
  }
});

/* ============ Urteil ============ */
function synthHTML(){
  const rows = STAGES.map(st => { const r = S.res[st.id]; return `<tr><td>${st.n} · ${esc(st.title)}</td><td>${r ? r.score : "–"} / ${maxOf(st)}</td></tr>`; }).join("");
  return `<section class="shead">
    <p class="eyebrow">Abschluss · AFB III</p>
    <h2 class="h2">${esc(SYNTH.q)}</h2>
    <p class="task">${SYNTH.task}<br><span class="note">${esc(SYNTH.hint)}</span></p>
  </section>
  <label for="synthText" class="note">Ihre Antwort (bleibt nur in diesem Browser)</label>
  <textarea id="synthText" placeholder="Die außenpolitischen Erfolge des NS-Regimes bis 1938 beruhten …">${esc(S.text||"")}</textarea>
  <div class="btns"><button type="button" class="btn" id="showEH">Erwartungshorizont zeigen</button></div>
  <section class="eh" id="eh" hidden>
    <h3>Erwartungshorizont: Prüfen Sie, welche Aspekte Ihre Antwort enthält</h3>
    <ol>${SYNTH.eh.map(([k,v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join("")}</ol>
    <h3>Weiterdenken</h3>
    <p class="lead"><b>Nehmen Sie begründet Stellung</b> zu der These: <i>„Die Appeasement-Politik war 1938 aus der Sicht der Zeitgenossen eine verantwortbare Friedenspolitik.“</i></p>
    <p class="note">Legen Sie Ihren Bewertungsmaßstab offen. Berücksichtigen Sie, dass die Zeitgenossen weder die Hoßbach-Niederschrift noch das geheime Zusatzprotokoll kannten, und trennen Sie deren Kenntnisstand vom heutigen Wissen über den Ausgang.</p>
  </section>
  <table class="scoretable"><thead><tr><th>Stufe</th><th>Punkte</th></tr></thead><tbody>${rows}</tbody></table>`;
}
document.addEventListener("input", e => { if(e.target.id === "synthText"){ S.text = e.target.value; save(); } });
document.addEventListener("click", e => { if(e.target.id === "showEH"){ $("#eh").hidden = false; e.target.hidden = true; } });

render();
</script>
</body>
