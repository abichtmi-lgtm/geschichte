        if (d && d.bis > Date.now()) return d.pw; localStorage.removeItem(SCHLUESSEL); } catch (e) {}
  return null;
}
function merke(pw, dauerhaft) {
  try { sessionStorage.setItem(SCHLUESSEL, pw); } catch (e) {}
  if (dauerhaft) try { localStorage.setItem(SCHLUESSEL, JSON.stringify({ pw, bis: Date.now() + TAGE * 864e5 })); } catch (e) {}
}
function vergiss() { try { sessionStorage.removeItem(SCHLUESSEL); localStorage.removeItem(SCHLUESSEL); } catch (e) {} }
async function entschluessele(pw) {
  const roh = new Uint8Array(await (await fetch("data:application/octet-stream;base64," + DATEN)).arrayBuffer());
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: roh.slice(0, 16), iterations: ITER, hash: "SHA-256" },
                                            basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: roh.slice(16, 28) }, key, roh.slice(28)));
}
async function oeffne(pw, dauerhaft) {
  const seite = await entschluessele(pw);
  merke(pw, dauerhaft);
  document.open(); document.write(seite); document.close();
}
const meldung = document.getElementById("meldung");
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); meldung.textContent = "Wird geöffnet …";
  try { await oeffne(document.getElementById("pw").value.trim(), document.getElementById("merken").checked); }
  catch (err) { meldung.textContent = "Falsches Passwort."; }
});
if (!window.crypto || !crypto.subtle) meldung.textContent = "Dieser Browser kann die Seite nicht öffnen. Bitte über https aufrufen.";
const pw0 = gemerkt();
if (pw0) { meldung.textContent = "Wird geöffnet …"; oeffne(pw0, false).catch(() => { vergiss(); meldung.textContent = ""; }); }
})();
