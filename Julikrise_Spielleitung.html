,\"M4 Telegramme\"],\n  [\"m5\",\"M5 Forschungspositionen\"],[\"m6\",\"M6 Tippkarten\"],[\"m7\",\"M7 Exit-Ticket\"],[\"m8\",\"M8 Weggabelungen\"],[\"l\",\"Lehrerblatt\"]\n];\nlet N = 13; const on = {}; PARTS.forEach(p => on[p[0]] = true);\ntry { const s = JSON.parse(localStorage.getItem(\"jk1914_druck_v1\")||\"{}\"); if (s.N) N = s.N; if (s.on) Object.assign(on, s.on); } catch(e){}\nconst save = () => { try { localStorage.setItem(\"jk1914_druck_v1\", JSON.stringify({N,on})); } catch(e){} };\n\nconst kab = id => JK.kabinette.find(k => k.id===id);\nconst head = (m, title, src) => `<div class=\"mhead\"><div><div class=\"m\">${m}<\/div><h2>${esc(title)}<\/h2><\/div><div class=\"src\">${src||\"LK Geschichte 12 · Julikrise 1914\"}<\/div><\/div>`;\nconst nameHead = () => `<div class=\"namehead\"><div>Name:<br>Vorname:<br>Kurs:<br>Datum:<\/div><img src=\"${esc(LOGO)}\" alt=\"Schullogo\" onerror=\"this.remove()\"><\/div>`;\nconst pairs = arr => { const out=[]; for (let i=0;i<arr.length;i+=2) out.push(arr.slice(i,i+2)); return out; };\n\n/* M1 Rollenkarten */\nfunction m1(){\n  const act = JK.rollen.filter(r => r.prio <= N);\n  const cards = act.map(r => {\n    const k = kab(r.kab);\n    let voices = \"\";\n    if (r.leit){\n      const miss = JK.rollen.filter(x => x.kab===r.kab && x.prio > N);\n      if (miss.length) voices = `<div class=\"voices\"><b>Weitere Stimmen in Ihrem Kabinett<\/b> (unbesetzt – Sie bringen sie in die Beratung ein):<ul>${miss.map(x=>`<li><b>${esc(x.name)}<\/b> (${esc(x.amt)}): ${esc(x.ziel)} Rote Linie: ${esc(x.roteLinie)}<\/li>`).join(\"\")}<\/ul><\/div>`;\n    }\n    return `<div class=\"halfcard\">\n      <div class=\"chead\"><div><div class=\"kab\">${esc(k.name)} · ${esc(k.ort)}<\/div><h3>${esc(r.name)}<\/h3><\/div><div class=\"amt\">${esc(r.amt)}<\/div><\/div>\n      <div class=\"f\"><span class=\"l\">Ihre Haltung<\/span>${esc(r.haltung)}<\/div>\n      <div class=\"f\"><span class=\"l\">Ihr Ziel<\/span>${esc(r.ziel)}<\/div>\n      <div class=\"f\"><span class=\"l\">Ihre rote Linie<\/span>${esc(r.roteLinie)}<\/div>\n      <div class=\"f secret\"><span class=\"l\">Nur Sie wissen<\/span>${esc(r.geheim)}<\/div>\n      <div class=\"f\"><span class=\"l\">Taktik<\/span>${esc(r.taktik)}<\/div>\n      ${voices}\n    <\/div>`;\n  });\n  return pairs(cards).map(p => `<section class=\"sheet half\" data-part=\"m1\">${p.join(\"\")}<\/section>`).join(\"\")\n    + `<section class=\"sheet\" data-part=\"m1\">${head(\"M1 · Hinweis\",\"Kabinettsschilder und Rollenverteilung\")}\n      <table class=\"fc\"><tr><th>Kabinett<\/th><th>Besetzte Rollen bei ${N} SuS<\/th><\/tr>\n      ${JK.kabinette.map(k=>`<tr><td><b>${esc(k.name)}<\/b><\/td><td>${JK.rollen.filter(r=>r.kab===k.id&&r.prio<=N).map(r=>esc(r.name)+\" (\"+esc(r.amt)+\")\").join(\"<br>\")}<\/td><\/tr>`).join(\"\")}<\/table>\n      <p class=\"f\">Rollenkarten zerschneiden und verdeckt austeilen. Die Leitrollen (Bethmann Hollweg, Berchtold, Sasonow, Poincaré, Grey, Pašić) werden immer besetzt.<\/p>\n      <h3>Spielregeln<\/h3><ol class=\"tasks\">${JK.regeln.map(x=>`<li>${esc(x)}<\/li>`).join(\"\")}<\/ol><\/section>`;\n}\n\n/* M2 Lagekarten */\nfunction m2(){\n  const cards = [];\n  JK.runden.forEach(r => JK.kabinette.forEach(k => {\n    cards.push(`<div class=\"halfcard\">\n      <div class=\"chead\"><div><div class=\"kab\">Runde ${r.nr} · ${esc(r.datum)}<\/div><h3>${esc(r.titel)}<\/h3><\/div><div class=\"amt\"><b>${esc(k.name)}<\/b><\/div><\/div>\n      <p class=\"f\">${esc(r.lage)}<\/p>\n      <p class=\"dil\">${esc(r.leitdilemma)}<\/p>\n      <div style=\"display:flex;flex-direction:column;gap:2mm\">${r.optionen[k.id].map(o=>`<div class=\"opt\"><span class=\"box\"><\/span><b>${o.k}<\/b><span>${esc(o.t)}<\/span><\/div>`).join(\"\")}<\/div>\n      <p class=\"f\" style=\"margin-top:auto\"><b>Beschluss nach Ablauf des Timers verkünden.<\/b> Begründung, Risiko und fehlende Information ins Protokoll (M3).<\/p>\n    <\/div>`);\n  }));\n  return pairs(cards).map(p => `<section class=\"sheet half\" data-part=\"m2\">${p.join(\"\")}<\/section>`).join(\"\");\n}\n\n/* M3 Protokoll */\nfunction m3(){\n  return JK.kabinette.map(k => `<section class=\"sheet\" data-part=\"m3\">\n    ${nameHead()}\n    ${head(\"M3 · Kabinettsprotokoll\", k.name + \" · \" + k.ort)}\n    <table class=\"prot\"><colgroup><col style=\"width:13%\"><col style=\"width:12%\"><col style=\"width:29%\"><col style=\"width:17%\"><col style=\"width:17%\"><col style=\"width:12%\"><\/colgroup>\n      <tr><th>Runde<\/th><th>Option<\/th><th>Begründung aus Sicht der Rolle 1914<\/th><th>Größtes Risiko<\/th><th>Was wissen wir nicht?<\/th><th>Telegramm an<\/th><\/tr>\n      ${JK.runden.map(r=>`<tr><td class=\"r\">${r.nr}<br><span class=\"afb\">${esc(r.datum)}<\/span><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>`).join(\"\")}\n    <\/table>\n    <p class=\"f\"><b>Nach dem Spiel:<\/b> Markieren Sie jede Runde, in der Ihr Kabinett vom Verlauf 1914 abgewichen ist. <b class=\"op\">Erklären Sie<\/b> in einem Satz, warum.<\/p>\n    <div class=\"lines\" style=\"min-height:22mm\"><\/div>\n  <\/section>`).join(\"\");\n}\n\n/* M4 Telegramme */\nfunction m4(){\n  const one = () => `<div class=\"tg\"><div class=\"t\"><span>TELEGRAMM<\/span><span>Runde ___<\/span><\/div>\n    <div class=\"fld\"><span>Von:<\/span><span><\/span><\/div><div class=\"fld\"><span>An:<\/span><span><\/span><\/div>\n    <div class=\"fld\"><span>Dringlichkeit:<\/span><span><\/span><\/div>\n    <div class=\"lines\"><\/div>\n    <div class=\"note\">Höchstens 25 Wörter. Satzende mit „STOP“. Die Spielleitung stellt das Telegramm erst zu Beginn der nächsten Runde zu.<\/div><\/div>`;\n  return [1,2,3].map(() => `<section class=\"sheet half\" data-part=\"m4\">${one()}${one()}<\/section>`).join(\"\");\n}\n\n/* M5 Positionen */\nfunction m5(){\n  const pos = [...JK.positionen].sort((a,b)=>a.pos-b.pos);\n  const card = p => `<div class=\"halfcard pos\">\n    <div class=\"chead\"><div><div class=\"kab\">M5 · Forschungsposition<\/div><div class=\"kurz\">„${esc(p.kurz)}“<\/div><\/div><div class=\"amt\">${esc(p.autor)}<br>${esc(p.werk)}<\/div><\/div>\n    <p class=\"f\">${esc(p.these)}<\/p>\n    <blockquote>${esc(p.zitat)}<\/blockquote>\n    <p class=\"beleg ${p.geprueft?\"\":\"u\"}\">Q: ${esc(p.beleg)}<\/p>\n    <ol class=\"tasks\">${JK.aufgaben.experten.map(a=>`<li><b class=\"op\">${esc(a.op)}<\/b>${esc(a.rest)} <span class=\"afb\">[AFB ${esc(a.afb)}]<\/span><\/li>`).join(\"\")}<\/ol>\n    <p class=\"f\"><b>Prüffrage:<\/b> ${esc(p.pruefFrage)}<\/p>\n  <\/div>`;\n  return pairs(pos.map(card)).map(p => `<section class=\"sheet half\" data-part=\"m5\">${p.join(\"\")}<\/section>`).join(\"\");\n}\n\n/* M6 Tippkarten */\nfunction m6(){\n  return `<section class=\"sheet\" data-part=\"m6\">\n    ${head(\"M6 · Tippkarten und Challenge\",\"Differenzierung für Kontroverse und Urteil\")}\n    <div class=\"halfcard\" style=\"height:auto\">\n      <div class=\"chead\"><h3>Tippkarte 1 · Die These finden<\/h3><\/div>\n      <p class=\"f\">Lesen Sie nur den ersten Absatz. Wer ist laut Autor verantwortlich – eine Macht, mehrere oder niemand? Unterstreichen Sie den Schlüsselbegriff („hineingeschlittert“, „Schlafwandler“, „kalkuliertes Risiko“, „Griff nach der Weltmacht“).<\/p>\n    <\/div>\n    <div class=\"halfcard\" style=\"height:auto\">\n      <div class=\"chead\"><h3>Tippkarte 2 · Die These am Spiel prüfen<\/h3><\/div>\n      <table class=\"fc\"><tr><th>Entscheidung im Spiel (Runde, Kabinett)<\/th><th>stützt die These, weil …<\/th><th>widerspricht der These, weil …<\/th><\/tr><tr><td style=\"height:14mm\"><\/td><td><\/td><td><\/td><\/tr><tr><td style=\"height:14mm\"><\/td><td><\/td><td><\/td><\/tr><\/table>\n    <\/div>\n    <div class=\"halfcard\" style=\"height:auto\">\n      <div class=\"chead\"><h3>Tippkarte 3 · Satzstarter für das Urteil<\/h3><\/div>\n      <p class=\"f\"><b>Sachurteil:<\/b> „Betrachtet man die Handlungsspielräume im Juli 1914, so lässt sich die Entscheidung von … als … beurteilen, weil …“ – „Einerseits verengten … den Spielraum, andererseits hätte … noch …“<\/p>\n      <p class=\"f\"><b>Werturteil:<\/b> „Aus heutiger Sicht halte ich die Kategorie ‚Schuld‘ für (un)angemessen, da … Mein Maßstab ist dabei …“<\/p>\n    <\/div>\n    <div class=\"halfcard\" style=\"height:auto\">\n      <div class=\"chead\"><h3>Challenge · Faktencheck einer Darstellung<\/h3><\/div>\n      <p class=\"f\">Hellfeld schreibt (S. 257), Serbien habe am 27. Juli das Ultimatum „in allen Punkten“ akzeptiert. <b class=\"op\">Überprüfen Sie<\/b> diese Aussage an der serbischen Antwort vom 25. Juli 1914 (Quellenedition, z. B. I. Geiss, Julikrise und Kriegsausbruch 1914). <b class=\"op\">Erläutern Sie<\/b>, welche Folgen der Fehler für das Urteil über Wien hätte.<\/p>\n      <p class=\"f\"><b>Zusatz:<\/b> <b class=\"op\">Überprüfen Sie<\/b> Clarks These an der serbischen Perspektive (Pašić, „Schwarze Hand“) und an der russischen Generalmobilmachung.<\/p>\n    <\/div>\n  <\/section>`;\n}\n\n/* M7 Exit-Ticket */\nfunction m7(){\n  const one = () => `<div class=\"ticket\"><b>Exit-Ticket · Julikrise 1914<\/b><span>Name: ______________________<\/span>\n    ${JK.exitTicket.map(x=>`<div><b>${esc(x)}<\/b><div class=\"lines\"><\/div><\/div>`).join(\"\")}<\/div>`;\n  return `<section class=\"sheet\" data-part=\"m7\">${head(\"M7 · Exit-Ticket\",\"3 – 2 – 1\")}<div class=\"grid4\">${one()}${one()}${one()}${one()}<\/div><\/section>`;\n}\n\n/* M8 Weggabelungen */\nfunction m8(){\n  const rows = w => `<tr><td><b>${w.nr}<\/b><\/td><td>${esc(w.datum)}<br>${esc(w.ort)}<\/td><td><b>${esc(w.akteur)}:<\/b> ${esc(w.ausstieg)}<\/td><td>${esc(w.warumNicht)}<\/td>${JK.realismus.map(()=>'<td class=\"rb\"><span><\/span><\/td>').join(\"\")}<\/tr>`;\n  const table = list => `<table class=\"fc wgt\"><colgroup><col style=\"width:5%\"><col style=\"width:13%\"><col style=\"width:33%\"><col style=\"width:29%\"><col span=\"4\" style=\"width:5%\"><\/colgroup>\n    <tr><th>Nr.<\/th><th>Wann/Wo<\/th><th>Ausweg<\/th><th>Warum nicht genutzt?<\/th>${JK.realismus.map(l=>`<th class=\"rh\">${esc(l)}<\/th>`).join(\"\")}<\/tr>${list.map(rows).join(\"\")}<\/table>`;\n  const W = JK.weggabelungen;\n  return `<section class=\"sheet\" data-part=\"m8\">${nameHead()}${head(\"M8 · Arbeitsblatt\",\"Zehn Weggabelungen – war der Krieg vermeidbar?\")}\n    <p class=\"f\">An jeder dieser Stellen hätte ein Kabinett die Kette unterbrechen können. 1914 wurde keiner dieser Auswege genutzt. Kreuzen Sie an, wie realistisch der Ausweg <i>aus der Sicht von 1914<\/i> war.<\/p>\n    ${table(W.slice(0,5))}<\/section>\n    <section class=\"sheet\" data-part=\"m8\">${head(\"M8 · Arbeitsblatt (Fortsetzung)\",\"Zehn Weggabelungen\")}\n    ${table(W.slice(5))}\n    <ol class=\"tasks\">${JK.aufgaben.weggabelung.map(a=>`<li><b class=\"op\">${esc(a.op)}<\/b>${esc(a.rest)} <span class=\"afb\">[AFB ${esc(a.afb)}]<\/span><\/li>`).join(\"\")}<\/ol>\n    <div class=\"lines\" style=\"min-height:40mm\"><\/div>\n    ${JK.fazit.map(f=>`<p class=\"f\" style=\"font-style:italic\">${esc(f.text)} <span class=\"afb\" style=\"font-style:normal\">(${esc(f.quelle)})<\/span><\/p>`).join(\"\")}\n  <\/section>`;\n}\n\n/* Lehrerblatt */\nfunction lehr(){\n  return `<section class=\"sheet\" data-part=\"l\">\n    ${head(\"Lehrerblatt\",\"Faktencheck Hellfeld, Kap. 11 – im Spiel korrigiert\",\"Nicht an Schüler ausgeben\")}\n    <p class=\"f\">Die folgenden Angaben der Vorlage wurden für Lagekarten und Auflösung korrigiert. Die Korrekturen stützen sich auf den Forschungsstand; vor der Verwendung im Unterricht ggf. mit einer Quellenedition (z. B. Geiss, Julikrise und Kriegsausbruch 1914) abgleichen.<\/p>\n    <table class=\"fc\"><tr><th style=\"width:9%\">Seite<\/th><th style=\"width:40%\">Vorlage<\/th><th>Korrektur<\/th><\/tr>\n      ${JK.korrekturen.map(c=>`<tr><td>S. ${esc(c.s)}<\/td><td>${esc(c.falsch)}<\/td><td>${esc(c.richtig)}<\/td><\/tr>`).join(\"\")}<\/table>\n  <\/section>\n  <section class=\"sheet\" data-part=\"l\">\n    ${head(\"Lehrerblatt\",\"Historische Auflösung und Eskalationspunkte\",\"Nicht an Schüler ausgeben\")}\n    <p class=\"f\">Summe der historischen Eskalationspunkte: <b>${JK.baro.histSumme}<\/b> (entspricht 10 auf dem Barometer). Die Spielleitung erfasst in der Beamer-Datei die verkündeten Optionen; das Barometer rechnet automatisch.<\/p>\n    <table class=\"fc\"><tr><th>Runde<\/th><th>Kabinett<\/th><th>1914<\/th><th>Punkte je Option<\/th><\/tr>\n      ${JK.runden.map(r=>JK.kabinette.map((k,i)=>`<tr>${i===0?`<td rowspan=\"6\"><b>${r.nr}<\/b><br>${esc(r.datum)}<\/td>`:\"\"}<td>${esc(k.name)}<\/td><td><b>${r.historisch[k.id].k}<\/b><\/td><td>${r.optionen[k.id].map(o=>o.k+\": \"+(o.esk>0?\"+\":\"\")+o.esk).join(\" · \")}<\/td><\/tr>`).join(\"\")).join(\"\")}\n    <\/table>\n  <\/section>`;\n}\n\nfunction build(){\n  document.getElementById(\"toc\").innerHTML = PARTS.map(([id,l])=>`<label><input type=\"checkbox\" id=\"p_${id}\" ${on[id]?\"checked\":\"\"}> ${l}<\/label>`).join(\"\");\n  document.getElementById(\"nIn\").value = N;\n  document.getElementById(\"out\").innerHTML = m1()+m2()+m3()+m4()+m5()+m6()+m7()+m8()+lehr();\n  document.querySelectorAll(\"[data-part]\").forEach(el => el.classList.toggle(\"off\", !on[el.dataset.part]));\n}\ndocument.addEventListener(\"change\", e => {\n  if (e.target.id===\"nIn\"){ N = Math.min(15, Math.max(10, Number(e.target.value)||13)); save(); build(); }\n  else if (e.target.id.startsWith(\"p_\")){ on[e.target.id.slice(2)] = e.target.checked; save(); build(); }\n});\nbuild();\n})();\n<\/script>\n<\/body>\n<\/html>\n"};
</script>
<script>
(function(){
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "jk1914_beamer_v1";

/* ---------- Zustand ---------- */
const blank = () => ({ screen:"start", sub:{}, n:13, choices:{}, tele:{}, linie:{}, pts:false });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ---------- Bildschirme ---------- */
const SCREENS = [
  { id:"start",  label:"Start",        min:"" },
  { id:"einstieg", label:"Einstieg",   min:"5 min" },
  { id:"setup",  label:"Kabinette",    min:"7 min" },
  { sep:true },
  ...JK.runden.map(r => ({ id:"r"+r.nr, label:"Runde "+r.nr, min:"" })),
  { sep:true },
  { id:"debrief", label:"Debriefing",  min:"5 min" },
  { id:"weg",     label:"Weggabelungen", min:"7 min" },
  { id:"kontro",  label:"Kontroverse", min:"15 min" },
  { id:"sicher",  label:"Sicherung",   min:"13 min" }
];
const order = SCREENS.filter(s => !s.sep).map(s => s.id);

function renderNav(){
  $("#steps").innerHTML = SCREENS.map(s => s.sep ? '<span class="sep" aria-hidden="true"></span>' :
    `<button data-go="${s.id}" ${S.screen===s.id?'aria-current="step"':''}>${esc(s.label)}</button>`).join("");
}
function go(id){ S.screen = id; save(); render(); window.scrollTo({top:0}); }

/* ---------- Hilfsfunktionen ---------- */
const kab = id => JK.kabinette.find(k => k.id===id);
function besetzt(n){ return JK.rollen.filter(r => r.prio <= n); }
function roundSum(r, pick){ // pick: (kabId) => optionKey|undefined
  let s = 0, count = 0;
  for (const k of JK.kabinette){
    const key = pick(k.id); if (!key) continue;
    const o = r.optionen[k.id].find(x => x.k===key); if (o){ s += o.esk; count++; }
  }
  return { s, count };
}
const histPick = r => id => r.historisch[id].k;
const classPick = r => id => (S.choices["r"+r.nr]||{})[id];
function scale(v){ return Math.max(0, Math.min(10, v*10/JK.baro.histSumme)); }
function cumul(pickFn){
  const out=[0]; let acc=0;
  for (const r of JK.runden){ acc += roundSum(r, pickFn(r)).s; out.push(scale(acc)); }
  return out;
}
function genutzt(w){ const ch = S.choices["r"+w.r]||{}; return Object.entries(w.wahl).some(([k,os]) => os.includes(ch[k])); }
function erfasst(w){ const ch = S.choices["r"+w.r]||{}; return Object.keys(w.wahl).some(k => ch[k]); }
function wegItem(w, compact){
  const used = genutzt(w), known = erfasst(w);
  return `<li class="wg ${used?"used":""}"><span class="wn">${w.nr}</span>
    <div class="wb"><div class="wh"><span class="wd">${esc(w.datum)} · ${esc(w.ort)}</span>${known?(used?'<span class="pill same">im Spiel genutzt</span>':'<span class="pill diff">im Spiel nicht genutzt</span>'):""}</div>
    <p class="wa"><b>${esc(w.akteur)}:</b> ${esc(w.ausstieg)}</p>
    ${compact?"":`<p class="wx"><b>Warum nicht?</b> ${esc(w.warumNicht)}</p>`}</div></li>`;
}
function stufe(v){ let l = JK.baro.stufen[0].label; for (const st of JK.baro.stufen) if (v >= st.ab) l = st.label; return l; }

/* ---------- Barometer (SVG) ---------- */
function baroSVG(histVal, classVal, classLabel){
  const W=1000,H=120,x0=20,x1=980,y=60, X = v => x0 + (x1-x0)*v/10;
  let ticks="";
  for (let i=0;i<=10;i++){ ticks += `<line x1="${X(i)}" x2="${X(i)}" y1="${y-8}" y2="${y+8}" stroke="var(--ink-3)" stroke-width="1"/><text x="${X(i)}" y="${y+28}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="var(--ink-3)">${i}</text>`; }
  let bands="";
  JK.baro.stufen.forEach((st,i) => {
    const nx = JK.baro.stufen[i+1] ? JK.baro.stufen[i+1].ab : 10;
    if (st.ab===10) return;
    bands += `<text x="${(X(st.ab)+X(nx))/2}" y="${y+52}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="var(--ink-2)">${esc(st.label)}</text>`;
  });
  const grad = `<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="var(--entente)" stop-opacity=".35"/><stop offset="1" stop-color="var(--seal)" stop-opacity=".9"/></linearGradient></defs>`;
  const mark = (v, col, lab, up) => `<g><line x1="${X(v)}" x2="${X(v)}" y1="${up?y-34:y-6}" y2="${up?y+6:y+34}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><text x="${X(v)}" y="${up?y-40:y+74}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="${col}">${esc(lab)} ${v.toFixed(1)}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Eskalationsbarometer: 1914 bei ${histVal.toFixed(1)}, Klasse bei ${classVal==null?'–':classVal.toFixed(1)}">${grad}
    <rect x="${x0}" y="${y-6}" width="${x1-x0}" height="12" rx="6" fill="url(#bg)"/>${ticks}${bands}
    <text x="${X(10)-10}" y="${y-14}" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="var(--seal)">Weltkrieg</text>
    ${mark(histVal,"var(--ink)","1914",true)}
    ${classVal==null?"":mark(classVal,"var(--seal)",classLabel,false)}
  </svg>`;
}
function baroBlock(rIndex, withClass){
  const h = cumul(histPick)[rIndex], c = cumul(classPick)[rIndex];
  return `<div class="baro">
    <div class="baro-top"><h3>Eskalationsbarometer</h3>
      <div class="legend"><span style="--k:var(--ink)">Verlauf 1914: ${esc(stufe(h))}</span>${withClass?`<span style="--k:var(--seal)">Kurs der Klasse: ${esc(stufe(c))}</span>`:""}</div></div>
    ${baroSVG(h, withClass?c:null, "Klasse")}
  </div>`;
}

/* ---------- Timer ---------- */
const T = { total:0, left:0, run:false, h:null, rnd:null };
let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(d => { const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=660; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001,audioCtx.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d+.28); o.start(audioCtx.currentTime+d); o.stop(audioCtx.currentTime+d+.3); });
  }catch(e){}
}
function timerInit(r){
  if (T.rnd !== r.nr && !T.run){ clearInterval(T.h); T.rnd=r.nr; T.total=r.minuten*60; T.left=T.total; }
}
function fmt(s){ const m=Math.floor(Math.max(0,s)/60), x=Math.max(0,s)%60; return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function paintTimer(){
  const c = $("#clock"); if (!c) return;
  c.textContent = fmt(T.left);
  c.className = "clock" + (T.left<=0 ? " end" : T.left<=60 ? " warn" : "");
  const f = $("#fuse"); if (f) f.style.width = (T.total? Math.max(0,T.left)/T.total*100 : 0) + "%";
  const b = $("#tStart"); if (b) b.textContent = T.run ? "Pause" : (T.left<T.total && T.left>0 ? "Weiter" : "Start");
}
function timerToggle(){
  if (audioCtx===null){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=undefined; } }
  if (T.run){ clearInterval(T.h); T.run=false; paintTimer(); return; }
  if (T.left<=0) return;
  T.run=true;
  T.h=setInterval(() => { T.left--; if (T.left<=0){ clearInterval(T.h); T.run=false; T.left=0; beep(); } paintTimer(); },1000);
  paintTimer();
}

/* ---------- Screens ---------- */
function vStart(){
  const days = Array.from({length:37},(_,i)=>`<span class="${i===0||i===36?'hot':''}"></span>`).join("");
  return `<section class="screen">
    <div class="hero">
      <div class="eyebrow">${esc(JK.meta.kurs)}</div>
      <h1>Fünf Wochen <em>im Sommer</em></h1>
      <p class="leitfrage">${esc(JK.meta.leitfrage)}</p>
      <div>
        <div class="days" aria-label="37 Tage vom Attentat bis zum britischen Kriegseintritt">${days}</div>
        <div class="days-cap"><span>28. Juni 1914 · Sarajevo</span><span>37 Tage</span><span>4. August 1914 · London</span></div>
      </div>
      <button class="cta" data-go="einstieg">Stunde beginnen</button>
    </div>
  </section>`;
}
function allianceSVG(){
  const node=(x,y,lab,col,sub)=>`<g><circle cx="${x}" cy="${y}" r="46" fill="var(--panel)" stroke="${col}" stroke-width="3"/><text x="${x}" y="${y+2}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="17" fill="var(--ink)">${lab}</text>${sub?`<text x="${x}" y="${y+22}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink-3)">${sub}</text>`:""}</g>`;
  const ln=(x1,y1,x2,y2,col,dash,lab,lx,ly)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:""}/>${lab?`<text x="${lx}" y="${ly}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--ink-2)">${lab}</text>`:""}`;
  return `<svg viewBox="0 0 700 470" role="img" aria-label="Schema der Bündnisse 1914">
    ${ln(160,110,390,110,"var(--entente)","", "Entente cordiale 1904",275,98)}
    ${ln(160,110,600,210,"var(--entente)","", "",0,0)}
    ${ln(390,110,600,210,"var(--entente)","", "Zweiverband 1892/94",520,145)}
    <text x="360" y="200" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--ink-2)">Petersburger Abkommen 1907 (GB–RU)</text>
    ${ln(390,250,470,320,"var(--central)","", "Zweibund 1879",395,300)}
    ${ln(390,250,260,340,"var(--central)","6 6", "Dreibund 1882",300,285)}
    ${ln(600,210,560,390,"var(--serbia)","2 6", "Schutzmacht",620,315)}
    ${ln(160,110,210,260,"var(--ink-3)","2 6", "Garantie 1839",140,200)}
    ${ln(470,320,560,390,"var(--seal)","", "Sarajevo",530,340)}
    ${node(160,110,"GB","var(--entente)","London")}
    ${node(390,110,"FR","var(--entente)","Paris")}
    ${node(600,210,"RU","var(--entente)","St. Petersburg")}
    ${node(390,250,"DR","var(--central)","Berlin")}
    ${node(470,320,"Ö-U","var(--central)","Wien")}
    ${node(260,380,"IT","var(--central)","Rom")}
    ${node(210,260,"BE","var(--ink-3)","neutral")}
    ${node(560,400,"SRB","var(--serbia)","Belgrad")}
  </svg>`;
}
function vEinstieg(){
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Einstieg · Reaktivierung</div><h2>Ein Pulverfass – und eine Lunte</h2></div></div>
    <div class="row w">
      <div class="card alliance"><h3>Bündnisse und Garantien 1914</h3>${allianceSVG()}
        <p class="note">Schema, keine maßstäbliche Karte – Ergänzung mit dem Putzger (Europa 1914). Italien wird sich am 3. August für neutral erklären.</p></div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="quote"><blockquote>„Wenn es in Europa einmal zum Krieg kommt, dann wegen irgendeiner verdammten Dummheit auf dem Balkan.“</blockquote><cite>Otto von Bismarck zugeschrieben – die Überlieferung ist nicht gesichert.</cite></div>
        <div class="quote"><blockquote>„Das Attentat von Sarajewo, das für sich betrachtet lediglich ein Ereignis von regionaler Bedeutung war, legte die Lunte an ein lange aufgestelltes Pulverfass und brachte es zur Explosion.“</blockquote><cite>Hellfeld, Kap. 11, S. 250</cite></div>
        <div class="card"><h3>Blitzlicht zur Hausaufgabe</h3>
          <ol><li><b>Nennen Sie</b> die Bündnisse und Bündnisverpflichtungen der Großmächte 1914.</li>
          <li><b>Erläutern Sie</b>, warum ein Konflikt zwischen Wien und Belgrad das ganze Schema in Bewegung setzen kann.</li>
          <li><b>Skizzieren Sie</b> den Grundgedanken des deutschen Aufmarschplans (Schlieffen-Plan).</li></ol></div>
      </div>
    </div>
    <p class="leitfrage">${esc(JK.meta.leitfrage)}</p>
    <button class="cta" data-go="setup">Kabinette bilden</button>
  </section>`;
}
function vSetup(){
  const on = new Set(besetzt(S.n).map(r=>r.id));
  const cabs = JK.kabinette.map(k => {
    const rs = JK.rollen.filter(r=>r.kab===k.id).sort((a,b)=>a.prio-b.prio);
    const nOn = rs.filter(r=>on.has(r.id)).length;
    return `<div class="cab" data-block="${esc(k.block)}">
      <div class="cab-h"><h3>${esc(k.name)}</h3><span class="ort">${esc(k.ort)} · ${nOn} SuS</span></div>
      <div class="roles"><ul>${rs.map(r=>`<li><span>${esc(r.name)} <span class="note">– ${esc(r.amt)}</span></span>${on.has(r.id)?'<span class="pill on">besetzt</span>':'<span class="pill off">Stimme bei Leitrolle</span>'}</li>`).join("")}</ul></div>
    </div>`;
  }).join("");
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Vorbereitung · Rollenverteilung</div><h2>Sechs Kabinette</h2></div></div>
    <div class="card">
      <label for="nSuS"><b>Anwesende Schülerinnen und Schüler</b></label>
      <div class="slider"><input type="range" id="nSuS" min="${JK.meta.minSuS}" max="${JK.meta.maxSuS}" value="${S.n}"><output id="nOut">${S.n}</output></div>
      <p class="note">Die Rollen werden nach Wichtigkeit besetzt. Unbesetzte Rollen erscheinen als „Stimme im Kabinett“ auf der Karte der Leitrolle – im Druckmaterial dieselbe Zahl einstellen.</p>
    </div>
    <div class="cabs">${cabs}</div>
    <div class="card"><h3>Spielregeln</h3><ol>${JK.regeln.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      <p class="note">Rollenkarten 2 Minuten still lesen. Niemand zeigt seine Karte – auch nicht im eigenen Kabinett.</p></div>
    <button class="cta" data-go="r1">Runde 1 eröffnen</button>
  </section>`;
}
function vRound(r){
  const id = "r"+r.nr, sub = S.sub[id] || "lage", ri = r.nr;
  const tabs = [["lage","Lagemeldung"],["beratung","Beratung"],["aufdeckung","Aufdeckung"]]
    .map(([k,l])=>`<button data-sub="${k}" aria-pressed="${sub===k}">${l}</button>`).join("");
  let body = "";
  if (sub==="lage"){
    body = `<div class="telegram"><div class="hdr"><span>Kaiserliches Telegraphenamt · Eingang</span><span>${esc(r.datum)}</span></div>
      <ol>${r.telegramm.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
      <div class="row two"><p class="lead">${esc(r.lage)}</p>
      <div style="display:flex;flex-direction:column;gap:18px"><p class="dilemma">${esc(r.leitdilemma)}</p>
      <div class="codebox"><span>Freischaltcode Schülergeräte</span><b>${esc(JK.codes["r"+ri])}</b></div>
      ${ri>1?`<p class="note">Zuerst die Telegramme der Vorrunde zustellen: Die Boten bringen ihr Gerät (oder M4) zum Empfänger.</p>`:""}
      <button class="cta" data-sub="beratung">Beratung starten · ${r.minuten} min</button></div></div>`;
  } else if (sub==="beratung"){
    timerInit(r);
    const ch = S.choices[id] || {}, te = S.tele[id] || {};
    const cabs = JK.kabinette.map(k => `<div class="cab" data-block="${esc(k.block)}">
      <div class="cab-h"><h3>${esc(k.name)}</h3><span class="ort">${esc(k.ort)}</span></div>
      ${r.optionen[k.id].map(o=>`<button class="opt" data-pick="${id}|${k.id}|${o.k}" aria-pressed="${ch[k.id]===o.k}"><b>${o.k}</b><span>${esc(o.t)}</span><span class="esk">${o.esk>0?"+":""}${o.esk}</span></button>`).join("")}
      <div class="tele">Telegramme: <button data-tele="${id}|${k.id}|-1" aria-label="Telegramm entfernen">−</button><span>${te[k.id]||0}</span><button data-tele="${id}|${k.id}|1" aria-label="Telegramm hinzufügen">+</button></div>
    </div>`).join("");
    const n = Object.keys(ch).length;
    const other = T.run && T.rnd !== r.nr;
    body = `${other?`<p class="status" style="color:var(--warn)">Der Timer läuft noch für Runde ${T.rnd}. Pausieren oder zurücksetzen, um Runde ${r.nr} zu starten.</p>`:""}<div class="timer-wrap"><div class="clock" id="clock">${fmt(T.left)}</div>
        <div class="timer-ctl"><button class="primary" id="tStart">Start</button><button id="tPlus">+1 min</button><button id="tReset">Zurücksetzen</button></div>
        <div class="fuse" aria-hidden="true"><i id="fuse"></i></div></div>
      <p class="dilemma">${esc(r.leitdilemma)}</p>
      <p class="status">Beschlüsse erfasst: ${n} / ${JK.kabinette.length} · Leertaste startet oder pausiert den Timer · Die Spielleitung klickt die verkündete Option an.</p>
      <div class="cabs">${cabs}</div>
      ${baroBlock(ri-1, true)}
      <button class="cta" data-sub="aufdeckung">Zur Aufdeckung</button>`;
  } else {
    const ch = S.choices[id] || {};
    const rows = JK.kabinette.map(k => {
      const mine = ch[k.id], h = r.historisch[k.id];
      const o = mine ? r.optionen[k.id].find(x=>x.k===mine) : null;
      const pill = !mine ? '<span class="pill none">nicht erfasst</span>' : mine===h.k ? '<span class="pill same">wie 1914</span>' : '<span class="pill diff">abweichend</span>';
      return `<div class="rv" data-block="${esc(k.block)}">
        <h4>${esc(k.name)}</h4>
        <div class="klasse">${pill}<span>${o?`<b style="font-family:var(--f-mono)">${o.k}</b> ${esc(o.t)}`:""}</span></div>
        <div class="hist"><b>1914 · ${h.k}</b> ${esc(h.t)}</div></div>`;
    }).join("");
    const wg = JK.weggabelungen.filter(w=>w.r===ri);
    body = `${baroBlock(ri, true)}
      <div class="reveal">${rows}</div>
      ${wg.length?`<div class="card"><h3>Weggabelungen dieser Runde – hier gab es 1914 einen Ausweg</h3><ol class="wlist">${wg.map(w=>wegItem(w,false)).join("")}</ol></div>`:""}
      <div class="quote"><blockquote>${esc(r.zitat.text)}</blockquote><cite>${esc(r.zitat.quelle)}</cite></div>
      ${ri<4 ? `<button class="cta" data-go="r${ri+1}">Runde ${ri+1} eröffnen</button>`
        : `<div class="quote"><blockquote>„The lamps are going out all over Europe; we shall not see them lit again in our lifetime.“</blockquote><cite>Edward Grey, 3. August 1914, überliefert in seinen Memoiren (1925)</cite></div><button class="cta" data-go="debrief">Rollen ablegen · Debriefing</button>`}`;
  }
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Runde ${r.nr} von ${JK.runden.length}</div><h2>${esc(r.titel)}</h2><div class="date">${esc(r.datum)}</div></div>
      <div class="subtabs" role="group" aria-label="Rundenphase">${tabs}</div></div>
    ${body}
  </section>`;
}
function chartSVG(){
  const h = cumul(histPick), c = cumul(classPick);
  const W=900,H=340,l=60,r=30,t=20,b=50, X=i=>l+(W-l-r)*i/4, Y=v=>t+(H-t-b)*(1-v/10);
  let grid="";
  for (let v=0; v<=10; v+=2) grid += `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${l-12}" y="${Y(v)+5}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="14" fill="var(--ink-3)">${v}</text>`;
  const labs=["Start","Runde 1","Runde 2","Runde 3","Runde 4"];
  labs.forEach((s,i)=> grid += `<text x="${X(i)}" y="${H-18}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="var(--ink-2)">${s}</text>`);
  const path = (arr,col,w,dash) => `<polyline points="${arr.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""} stroke-linejoin="round"/>` + arr.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===arr.length-1?7:4.5}" fill="${col}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Eskalationsverlauf 1914 und Klasse über vier Runden">${grid}
    <text x="${l}" y="${t-4}" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--ink-3)">Eskalation (0–10)</text>
    ${path(h,"var(--ink)",3,"")}${path(c,"var(--seal)",3,"8 6")}
    <text x="${X(4)-10}" y="${Y(h[4])-14}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="var(--ink)">1914: ${h[4].toFixed(1)}</text>
    <text x="${X(4)-10}" y="${Y(c[4])+26}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="var(--seal)">Klasse: ${c[4].toFixed(1)}</text>
  </svg>`;
}
function vDebrief(){
  let same=0, diff=0; const diffs=[];
  JK.runden.forEach(r => JK.kabinette.forEach(k => {
    const m=(S.choices["r"+r.nr]||{})[k.id]; if(!m) return;
    if (m===r.historisch[k.id].k) same++; else { diff++; diffs.push(`R${r.nr} · ${k.name}: ${m} statt ${r.historisch[k.id].k}`); }
  }));
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Vertiefung · Ausstieg aus der Rolle</div><h2>Was ist gerade passiert?</h2></div></div>
    <p class="lead">Namensschilder umdrehen. Ab jetzt sprechen wir als Historikerinnen und Historiker über das Spiel – nicht mehr als Minister.</p>
    <div class="row w">
      <div class="baro"><div class="baro-top"><h3>Eskalationsverlauf</h3><div class="legend"><span style="--k:var(--ink)">1914</span><span style="--k:var(--seal)">Kurs der Klasse</span></div></div>${chartSVG()}</div>
      <div class="card"><h3>Abweichungen vom Verlauf 1914</h3>
        <p><b style="font-family:var(--f-mono);font-size:1.6em">${diff}</b> abweichend · <b style="font-family:var(--f-mono);font-size:1.6em">${same}</b> wie 1914</p>
        ${diffs.length?`<ul class="note" style="font-size:.85em">${diffs.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:'<p class="note">Keine Abweichungen erfasst.</p>'}
      </div>
    </div>
    <div class="card"><h3>Leitfragen für das Gespräch</h3><ol>${JK.debriefing.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
    <button class="cta" data-go="weg">Zu den Weggabelungen</button>
  </section>`;
}
function vWeg(){
  const all = JK.weggabelungen, used = all.filter(genutzt).length, known = all.filter(erfasst).length;
  const task = a => `<li><b>${esc(a.op)}</b>${esc(a.rest)}<span class="afb">AFB ${esc(a.afb)}</span></li>`;
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Vertiefung · War der Krieg vermeidbar?</div><h2>Zehn Weggabelungen in 37 Tagen</h2></div></div>
    <div class="row w">
      <p class="lead">An jeder dieser Stellen hätte ein einzelnes Kabinett die Kette unterbrechen können. Genutzt wurde 1914 <b>keine</b> davon.${known?` Unsere Klasse hat <b>${used} von ${known}</b> erfassten Auswegen genommen.`:""}</p>
      <div class="tally" aria-label="Genutzte Auswege: 1914 null, Klasse ${used}"><div><span>1914</span><b>0</b></div><div><span>Klasse</span><b class="c">${used}</b></div><div><span>Weggabelungen</span><b>${all.length}</b></div></div>
    </div>
    <ol class="wlist">${all.map(w=>wegItem(w,false)).join("")}</ol>
    <div class="row three">${JK.fazit.map(f=>`<div class="quote"><blockquote>${esc(f.text)}</blockquote><cite>${esc(f.quelle)}</cite></div>`).join("")}</div>
    <div class="card"><h3>Urteil · 5 min</h3><ol class="tasks">${JK.aufgaben.weggabelung.map(task).join("")}</ol>
      <p class="note">Achtung Rückschaufehler: Jede Weggabelung hat eine Spalte „Warum nicht?“. Wer einen Ausweg für leicht hält, muss erklären, warum die Akteure ihn trotzdem nicht nahmen.</p></div>
    <button class="cta" data-go="kontro">Zur Forschungskontroverse</button>
  </section>`;
}
function vKontro(){
  const pos = [...JK.positionen].sort((a,b)=>a.pos-b.pos);
  const task = a => `<li><b>${esc(a.op)}</b>${esc(a.rest)}<span class="afb">AFB ${esc(a.afb)}</span></li>`;
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Vertiefung · Vier Deutungen</div><h2>Wer war es – oder ist das die falsche Frage?</h2></div></div>
    <div class="codebox"><span>Freischaltcode „Abschluss“ für Schülergeräte</span><b>${esc(JK.codes.abschluss)}</b></div>
    <div class="card"><h3>Expertengruppen · 10 min</h3><ol class="tasks">${JK.aufgaben.experten.map(task).join("")}</ol>
      <p class="note">Neue Gruppen: aus jedem Kabinett mindestens eine Person pro Position. Material M5 im Druckpaket.</p></div>
    <div class="positions">${pos.map(p=>`<article class="pos">
      <div class="kurz">${esc(p.kurz)}</div><div class="who">${esc(p.autor)} · ${esc(p.werk)}</div>
      <p class="these">${esc(p.these)}</p><blockquote>${esc(p.zitat)}</blockquote>
      <p class="beleg ${p.geprueft?"":"unchecked"}">${esc(p.beleg)}</p>
      <p class="frage"><b>Prüffrage:</b> ${esc(p.pruefFrage)}</p></article>`).join("")}</div>
    <div class="card"><h3>Positionslinie im Raum · 10 min</h3>
      <ol class="tasks">${JK.aufgaben.plenum.map(task).join("")}</ol>
      <div class="line">${JK.linie.map(z=>`<div class="lz"><div class="n">${S.linie[z.id]||0}</div><div class="lab">${esc(z.label)}</div><div class="sub">${esc(z.sub)}</div>
        <div class="pm"><button data-line="${z.id}|-1" aria-label="${esc(z.label)} minus eins">−</button><button data-line="${z.id}|1" aria-label="${esc(z.label)} plus eins">+</button></div></div>`).join("")}</div>
      <p class="note">Impuls: „Welche Informationen hatten wir, die den Akteuren 1914 fehlten?“ – Wer sich bewegt, begründet mit Spiel <em>und</em> Forschung.</p>
    </div>
    <button class="cta" data-go="sicher">Zur Sicherung</button>
  </section>`;
}
function vSicher(){
  const task = a => `<li><b>${esc(a.op)}</b>${esc(a.rest)}<span class="afb">AFB ${esc(a.afb)}</span></li>`;
  return `<section class="screen">
    <div class="round-head"><div><div class="eyebrow">Sicherung</div><h2>Tafelbild</h2></div></div>
    <div class="board">
      <h3>Hineingeschlittert oder bewusst entfesselt? – Der Weg in den Ersten Weltkrieg</h3>
      <div class="flow">
        <div class="box"><h4>Langfristige Strukturen</h4><ul><li>Imperialismus und „Weltpolitik“</li><li>Bündnissysteme (Blöcke)</li><li>Wettrüsten, Militarismus, Präventivkriegsdenken</li><li>Nationalismus, Panslawismus</li><li>Balkankrisen 1908–1913</li><li>Aufmarschpläne (Schlieffen-Plan)</li></ul></div>
        <div class="arr" aria-hidden="true">→</div>
        <div class="box"><h4>Auslöser</h4><p>Attentat von Sarajevo<br>28. Juni 1914</p></div>
        <div class="arr" aria-hidden="true">→</div>
        <div class="box"><h4>Entscheidungskaskade</h4><ul><li>5./6.7. Blankoscheck Berlin → Wien</li><li>20.–23.7. Bündnisbekräftigung Paris ↔ St. Petersburg</li><li>23.7. Ultimatum · 25.7. serbische Antwort</li><li>28.7. Kriegserklärung an Serbien</li><li>30.7. russische Generalmobilmachung</li><li>1.–4.8. Kriegserklärungen, Belgien, Großbritannien</li></ul></div>
      </div>
      <p class="crit">Strukturen <b>verengen</b> den Handlungsspielraum – Entscheidungen <b>nutzen</b> oder <b>schließen</b> ihn.</p>
      <div class="box" style="border:2px solid var(--seal);border-radius:3px;padding:12px 14px;font-size:.86em"><h4 style="margin:0 0 6px;font-family:var(--f-mono);font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--seal)">Der Krieg war nicht zwangsläufig – 10 ungenutzte Auswege</h4>
        <p>${JK.weggabelungen.map(w=>`<b>${w.nr}</b> ${esc(w.datum)} ${esc(w.ort)}`).join(" · ")}</p>
        <p style="margin-top:6px">Warum ungenutzt? Bündnisangst · Prestige und Gesichtswahrung · militärische Zeitpläne · Präventivkriegsdenken · Misstrauen und späte Kommunikation</p></div>
      <div class="spectrum"><span>„Hineingeschlittert“<br><small>Lloyd George</small></span><span>„Schlafwandler“<br><small>Clark</small></span><span>„Kalkuliertes Risiko“<br><small>Krumeich / Mombauer</small></span><span>„Griff nach der Weltmacht“<br><small>Fischer</small></span></div>
      <p class="crit">Urteilskriterien: Initiative · Handlungsalternativen · Risikobereitschaft · Kenntnis der Folgen</p>
    </div>
    <div class="row two">
      <div class="card"><h3>Exit-Ticket · 4 min</h3><ol>${JK.exitTicket.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
      <div class="card"><h3>Hausaufgabe</h3><ol class="tasks">${JK.aufgaben.hausaufgabe.map(task).join("")}</ol>
        <p class="note">Ausblick: Kriegsziele und „Septemberprogramm“ 1914.</p></div>
    </div>
  </section>`;
}

/* ---------- Lehrermaterial (nicht Teil der Spielnavigation) ---------- */
function vLehrer(){
  const tab = S.lehrTab || "leitfaden";
  const src = DOCS ? "" : (tab==="druck" ? ' src="Julikrise_Druckmaterial.html"' : "");
  return `<section class="screen lehrer">
    <div class="lehr-warn" role="note"><b>Lehrermaterial</b> – enthält Freischaltcodes und die historische Auflösung. Nicht am Beamer zeigen.</div>
    <div class="round-head"><div><div class="eyebrow">Nur für die Lehrkraft</div><h2>${tab==="druck"?"Druckmaterial":"Planungsleitfaden"}</h2></div>
      <div class="subtabs" role="group" aria-label="Lehrermaterial"><button data-lehr="leitfaden" aria-pressed="${tab==="leitfaden"}">Planungsleitfaden</button><button data-lehr="druck" aria-pressed="${tab==="druck"}">Druckmaterial</button></div></div>
    <div class="btns-row"><button class="cta" id="docPrint">${tab==="druck"?"Druckmaterial drucken":"Leitfaden drucken"}</button><button class="cta ghost" id="lehrBack">Zurück zum Spiel</button>
      <span class="note">${tab==="druck"?"Im Druckdialog: A4 · Ränder „Keine“ · Hintergrundgrafiken an. Schülerzahl und Auswahl der Materialien oben im Rahmen einstellen.":"Jedes Kapitel beginnt beim Drucken auf einer neuen Seite."}</span></div>
    ${!DOCS && tab==="leitfaden" ? '<p class="note">Der Leitfaden ist nur in der erzeugten Datei Julikrise_Spielleitung.html enthalten.</p>' : `<iframe class="docframe" id="docFrame" title="${tab==="druck"?"Druckmaterial":"Planungsleitfaden"}"${src}></iframe>`}
  </section>`;
}
function fillDoc(){
  const f = $("#docFrame"); if (!f || !DOCS) return;
  const tab = S.lehrTab || "leitfaden";
  if (f.dataset.doc !== tab){ f.srcdoc = tab==="druck" ? DOCS.druck : DOCS.leitfaden; f.dataset.doc = tab; }
}

/* ---------- Render ---------- */
function render(){
  renderNav();
  document.body.classList.toggle("showpts", !!S.pts);
  $("#ptsBtn").setAttribute("aria-pressed", String(!!S.pts));
  const st = $("#stage"); const id = S.screen;
  if (id==="start") st.innerHTML = vStart();
  else if (id==="einstieg") st.innerHTML = vEinstieg();
  else if (id==="setup") st.innerHTML = vSetup();
  else if (id==="debrief") st.innerHTML = vDebrief();
  else if (id==="weg") st.innerHTML = vWeg();
  else if (id==="lehrer") st.innerHTML = vLehrer();
  else if (id==="kontro") st.innerHTML = vKontro();
  else if (id==="sicher") st.innerHTML = vSicher();
  else { const r = JK.runden.find(x=>"r"+x.nr===id); st.innerHTML = r ? vRound(r) : vStart(); }
  paintTimer();
  document.body.classList.toggle("in-lehrer", id==="lehrer");
  fillDoc();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go){ go(t.dataset.go); return; }
  if (t.dataset.sub){ S.sub[S.screen] = t.dataset.sub; save(); render(); return; }
  if (t.dataset.pick){
    const [rid,k,o] = t.dataset.pick.split("|");
    S.choices[rid] = S.choices[rid] || {};
    if (S.choices[rid][k]===o) delete S.choices[rid][k]; else S.choices[rid][k]=o;
    save(); const y = window.scrollY; render(); window.scrollTo({top:y}); return;
  }
  if (t.dataset.tele){
    const [rid,k,d] = t.dataset.tele.split("|");
    S.tele[rid] = S.tele[rid] || {}; S.tele[rid][k] = Math.max(0,(S.tele[rid][k]||0)+Number(d));
    save(); const y = window.scrollY; render(); window.scrollTo({top:y}); return;
  }
  if (t.dataset.line){
    const [z,d] = t.dataset.line.split("|"); S.linie[z] = Math.max(0,(S.linie[z]||0)+Number(d));
    save(); const y = window.scrollY; render(); window.scrollTo({top:y}); return;
  }
  if (t.id==="tStart"){ timerToggle(); return; }
  if (t.id==="tPlus"){ T.left += 60; T.total = Math.max(T.total, T.left); paintTimer(); return; }
  if (t.id==="tReset"){ clearInterval(T.h); T.run=false; const cur = JK.runden.find(x=>"r"+x.nr===S.screen); if (cur) T.rnd = cur.nr; T.left=T.total=JK.runden[T.rnd-1].minuten*60; render(); return; }
  if (t.id==="lehrBtn"){ if (S.screen!=="lehrer"){ S.back = S.screen; go("lehrer"); } else go(S.back||"start"); return; }
  if (t.id==="lehrBack"){ go(S.back||"start"); return; }
  if (t.dataset.lehr){ S.lehrTab = t.dataset.lehr; save(); render(); return; }
  if (t.id==="docPrint"){ const f=$("#docFrame"); try { f.contentWindow.focus(); f.contentWindow.print(); } catch(err){} return; }
  if (t.id==="ptsBtn"){ S.pts=!S.pts; save(); render(); return; }
  if (t.id==="themeBtn"){
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cur==="dark" ? "light" : "dark"; return;
  }
  if (t.id==="resetBtn"){
    if (t.dataset.armed){ clearInterval(T.h); T.rnd=null; S = blank(); save(); render(); t.textContent="Neu starten"; delete t.dataset.armed; }
    else { t.dataset.armed="1"; t.textContent="Wirklich löschen?"; setTimeout(()=>{ if(t.dataset.armed){ delete t.dataset.armed; t.textContent="Neu starten"; } },3000); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id==="nSuS"){ S.n = Number(e.target.value); save(); render(); const el=$("#nSuS"); if(el) el.focus(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (S.screen==="lehrer") return;
  const i = order.indexOf(S.screen);
  if (e.key==="ArrowRight" && i<order.length-1) go(order[i+1]);
  else if (e.key==="ArrowLeft" && i>0) go(order[i-1]);
  else if (e.key===" " && $("#clock")){ e.preventDefault(); timerToggle(); }
});
render();
})();
</script>
</body>
</html>
