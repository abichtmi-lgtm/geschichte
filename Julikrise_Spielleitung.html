<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fünf Wochen im Sommer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#E8ECE6; --panel:#F6F7F3; --panel-2:#EEF1EB; --ink:#1A2126; --ink-2:#4B5660; --ink-3:#6E7880;
  --rule:#C3CBC2; --seal:#9B2C24; --seal-soft:#F1DCD8; --brass:#8F6A1E; --field:#56654F;
  --tape:#F2E6C2; --tape-ink:#2B2414; --central:#7A5A1C; --entente:#2D5572; --serbia:#9B2C24;
  --ok:#2F6B45; --ok-soft:#DCEBDF; --warn:#9A5B12;
  --f-disp:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111618; --panel:#1A2124; --panel-2:#20282B; --ink:#E6E7E1; --ink-2:#A3ADAC; --ink-3:#7E8888;
    --rule:#2E383B; --seal:#E0685C; --seal-soft:#3A2120; --brass:#D2A64E; --field:#94A68B;
    --tape:#2A2517; --tape-ink:#EBDDB5; --central:#D2A64E; --entente:#7FAED0; --serbia:#E0685C;
    --ok:#7BC495; --ok-soft:#1D3024; --warn:#E0A054;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111618; --panel:#1A2124; --panel-2:#20282B; --ink:#E6E7E1; --ink-2:#A3ADAC; --ink-3:#7E8888;
  --rule:#2E383B; --seal:#E0685C; --seal-soft:#3A2120; --brass:#D2A64E; --field:#94A68B;
  --tape:#2A2517; --tape-ink:#EBDDB5; --central:#D2A64E; --entente:#7FAED0; --serbia:#E0685C;
  --ok:#7BC495; --ok-soft:#1D3024; --warn:#E0A054;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:clamp(15px,0.55vw + 11px,20px);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}

/* ---------- Kopfleiste ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:1.15em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:.62em;color:var(--ink-3);letter-spacing:.08em;margin-left:8px;text-transform:uppercase}
nav.steps{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.steps button{background:none;border:1px solid transparent;border-radius:3px;padding:4px 10px;font-size:.78em;line-height:1.3;color:var(--ink-2);letter-spacing:.02em}
nav.steps button:hover{border-color:var(--rule)}
nav.steps button[aria-current="step"]{background:var(--ink);color:var(--paper)}
nav.steps .sep{width:1px;background:var(--rule);margin:2px 4px}
.tools{display:flex;gap:6px}
.icon-btn{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 10px;font-size:.78em;color:var(--ink-2)}

main{max-width:1400px;margin:0 auto;padding-block:28px 64px;padding-inline:16px}
section.screen{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.lead{font-size:1.15em;color:var(--ink-2);max-width:62ch}
.row{display:grid;gap:24px}
@media (min-width:900px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:repeat(3,1fr)}.row.w{grid-template-columns:1.2fr .8fr}}

/* ---------- Start ---------- */
.hero{padding-block:4vh 2vh;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(2.6rem,6vw,5.6rem);font-weight:500;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--seal)}
.leitfrage{font-family:var(--f-disp);font-style:italic;font-size:clamp(1.3rem,2.2vw,2.1rem);max-width:34ch;border-left:3px solid var(--seal);padding-left:18px}
.days{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.days span{width:clamp(10px,1.5vw,22px);height:30px;background:var(--rule);border-radius:1px}
.days span.hot{background:var(--seal)}
.days-cap{font-family:var(--f-mono);font-size:.75em;color:var(--ink-3);display:flex;justify-content:space-between;max-width:calc(37 * (clamp(10px,1.5vw,22px) + 2px))}
.cta{align-self:flex-start;background:var(--ink);color:var(--paper);border:none;border-radius:3px;padding:12px 22px;font-weight:600}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}

/* ---------- Telegramm ---------- */
.telegram{background:var(--tape);color:var(--tape-ink);border-radius:2px;padding:18px 22px;box-shadow:0 1px 0 var(--rule);position:relative}
.telegram .hdr{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7em;letter-spacing:.12em;text-transform:uppercase;opacity:.75;border-bottom:1px dashed currentColor;padding-bottom:8px;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.telegram ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.telegram li{font-family:var(--f-mono);font-size:clamp(.95rem,1.35vw,1.35rem);letter-spacing:.02em;line-height:1.35;animation:tick .5s both}
.telegram li:nth-child(2){animation-delay:.35s}.telegram li:nth-child(3){animation-delay:.7s}.telegram li:nth-child(4){animation-delay:1.05s}
@keyframes tick{from{opacity:.15;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dilemma{font-family:var(--f-disp);font-size:clamp(1.25rem,2vw,1.8rem);line-height:1.25}
.quote{border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.quote blockquote{margin:0;font-family:var(--f-disp);font-style:italic;font-size:1.15em;line-height:1.35}
.quote cite{font-style:normal;font-size:.78em;color:var(--ink-3)}

/* ---------- Rundenkopf ---------- */
.round-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.round-head h2{font-size:clamp(1.9rem,3.6vw,3.2rem)}
.round-head .date{font-family:var(--f-mono);color:var(--seal);font-size:.95em}
.subtabs{display:flex;gap:0;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.subtabs button{background:none;border:none;padding:8px 16px;font-size:.85em;border-right:1px solid var(--ink)}
.subtabs button:last-child{border-right:none}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Timer ---------- */
.timer-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 22px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(3.2rem,8vw,7rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.warn{color:var(--warn)}.clock.end{color:var(--seal);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.timer-ctl{display:flex;gap:8px;flex-wrap:wrap}
.timer-ctl button{background:none;border:1px solid var(--ink);border-radius:3px;padding:8px 14px;font-size:.85em}
.timer-ctl button.primary{background:var(--ink);color:var(--paper)}
.fuse{flex:1 1 240px;height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:0}
.fuse i{display:block;height:100%;background:var(--seal);width:100%;transition:width 1s linear}

/* ---------- Kabinette ---------- */
.cabs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.cab{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c)}
[data-block="Zweibund"]{--c:var(--central)}[data-block="Entente"]{--c:var(--entente)}[data-block="Schützling Russlands"]{--c:var(--serbia)}
.cab-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cab-h h3{font-size:1.25em}
.cab-h .ort{font-family:var(--f-mono);font-size:.7em;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:left;background:none;border:1px solid var(--rule);border-radius:3px;padding:8px 10px;font-size:.82em;line-height:1.35}
.opt b{font-family:var(--f-mono);font-size:1.1em}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--c);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--c)}
.esk{font-family:var(--f-mono);font-size:.85em;color:var(--ink-3);display:none}
body.showpts .esk{display:inline}
.tele{display:flex;align-items:center;gap:8px;font-size:.75em;color:var(--ink-3);font-family:var(--f-mono)}
.tele button{background:none;border:1px solid var(--rule);border-radius:3px;padding:0 8px;line-height:1.6}
.roles{display:flex;flex-direction:column;gap:4px;font-size:.85em}
.roles li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--rule);padding-block:3px}
.roles ul{list-style:none;margin:0;padding:0}
.pill{font-family:var(--f-mono);font-size:.72em;padding:3px 8px;line-height:1.3;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.on{color:var(--ok)}.pill.off{color:var(--ink-3)}
.pill.same{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.diff{color:var(--seal);background:var(--seal-soft);border-color:transparent}
.pill.none{color:var(--ink-3)}

/* ---------- Barometer ---------- */
.baro{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px 20px 12px}
.baro-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.baro-top h3{font-size:1.1em}
.legend{display:flex;gap:16px;font-size:.78em;color:var(--ink-2);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--k)}
.baro svg{width:100%;height:auto;display:block;overflow:visible}

/* ---------- Aufdeckung ---------- */
.reveal{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
.rv{display:grid;gap:8px 20px;padding:14px 0;border-bottom:1px solid var(--rule)}
@media (min-width:900px){.rv{grid-template-columns:180px 1fr 1.6fr}}
.rv h4{margin:0;font-family:var(--f-disp);font-weight:500;font-size:1.15em;display:flex;align-items:center;gap:8px}
.rv h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.rv .klasse{font-size:.85em;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rv .hist{font-size:.88em;color:var(--ink-2)}
.rv .hist b{color:var(--ink);font-family:var(--f-mono)}

/* ---------- Kontroverse ---------- */
.positions{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.pos{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pos .kurz{font-family:var(--f-disp);font-size:1.45em;line-height:1.1}
.pos .who{font-family:var(--f-mono);font-size:.72em;color:var(--ink-3);letter-spacing:.04em}
.pos .these{font-size:.86em}
.pos blockquote{margin:0;font-family:var(--f-disp);font-style:italic;font-size:.9em;border-left:2px solid var(--brass);padding-left:10px;color:var(--ink-2)}
.pos .beleg{font-size:.72em;color:var(--ink-3)}
.pos .beleg.unchecked{color:var(--warn)}
.pos .frage{font-size:.82em;border-top:1px dashed var(--rule);padding-top:8px}
.tasks{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:1.3em}
.tasks li{max-width:80ch}
.afb{font-family:var(--f-mono);font-size:.7em;color:var(--ink-3);margin-left:6px}

.line{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin-top:8px;overflow-x:auto}
.line::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:linear-gradient(90deg,var(--entente),var(--seal))}
.lz{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 4px;min-width:110px}
.lz .n{width:68px;height:68px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.6em;font-weight:600;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.lz .lab{font-weight:600;font-size:.85em;line-height:1.2}
.lz .sub{font-size:.72em;color:var(--ink-3)}
.lz .pm{display:flex;gap:4px}
.lz .pm button{background:none;border:1px solid var(--rule);border-radius:3px;width:30px;line-height:1.5}

/* ---------- Tafelbild ---------- */
.board{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:18px}
.board h3{font-size:1.5em;text-align:center}
.flow{display:grid;gap:14px}
@media (min-width:900px){.flow{grid-template-columns:1fr auto .8fr auto 1.3fr;align-items:stretch}}
.flow .box{border:1px solid var(--ink);border-radius:3px;padding:12px 14px;font-size:.86em}
.flow .box h4{margin:0 0 6px;font-family:var(--f-mono);font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.flow .box ul{margin:0;padding-left:1.1em}
.flow .arr{align-self:center;justify-self:center;font-family:var(--f-mono);color:var(--seal);font-size:1.5em}
.spectrum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8em;border-top:2px solid var(--ink);padding-top:10px}
.spectrum span{flex:1 1 120px;text-align:center}
.crit{font-size:.85em;color:var(--ink-2);text-align:center}

.note{font-size:.8em;color:var(--ink-3)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.3em}
.card ol,.card ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.slider{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.slider input{width:min(100%,380px);accent-color:var(--seal)}
.slider output{font-family:var(--f-mono);font-size:2.4em;font-weight:600;font-variant-numeric:tabular-nums}
.alliance svg{width:100%;height:auto;display:block}
.status{font-family:var(--f-mono);font-size:.75em;color:var(--ink-3)}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.wlist::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--rule)}
.wg{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:10px 0;position:relative}
.wn{width:40px;height:40px;border-radius:50%;border:2px solid var(--seal);background:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--seal);position:relative;z-index:1}
.wg.used .wn{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.wb{display:flex;flex-direction:column;gap:4px;min-width:0}
.wh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.wd{font-family:var(--f-mono);font-size:.78em;color:var(--seal);letter-spacing:.04em}
.wa{font-size:.95em}
.wx{font-size:.85em;color:var(--ink-2)}
.tally{display:flex;gap:10px;align-self:start;flex-wrap:wrap}
.tally div{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;min-width:96px}
.tally span{font-family:var(--f-mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tally b{font-family:var(--f-mono);font-size:2.4em;line-height:1.1;font-variant-numeric:tabular-nums}
.tally b.c{color:var(--ok)}
.lehr-btn{border-color:var(--seal);color:var(--seal)}
body.in-lehrer .lehr-btn{background:var(--seal);color:var(--paper)}
body.in-lehrer nav.steps{opacity:.45}
.lehr-warn{background:var(--seal-soft);color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:10px 14px;font-size:.9em}
.btns-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btns-row .cta{align-self:auto}
.docframe{width:100%;height:calc(100vh - 220px);min-height:520px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.codebox{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border:2px dashed var(--seal);border-radius:4px;padding:10px 16px;align-self:flex-start}
.codebox span{font-family:var(--f-mono);font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.codebox b{font-family:var(--f-mono);font-size:1.8em;letter-spacing:.12em;color:var(--seal)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Fünf Wochen im Sommer <small>Julikrise 1914</small></div>
    <nav class="steps" id="steps" aria-label="Phasen der Stunde"></nav>
    <div class="tools">
      <button class="icon-btn lehr-btn" id="lehrBtn" title="Planungsleitfaden und Druckmaterial – nicht am Beamer zeigen">Lehrermaterial</button>
      <button class="icon-btn" id="ptsBtn" aria-pressed="false" title="Eskalationspunkte der Optionen ein- oder ausblenden">Punkte</button>
      <button class="icon-btn" id="themeBtn" title="Hell/Dunkel umschalten">Hell/Dunkel</button>
      <button class="icon-btn" id="resetBtn" title="Alle Eingaben löschen">Neu starten</button>
    </div>
  </div>
</header>
<main id="stage"></main>

<script>
/* =====================================================================
   JULIKRISE 1914 – Entscheidungsspiel (LK 12, LB 1)
   Single Source of Truth für Beamer-Spielleitung UND Druckmaterial.
   Inhaltliche Grundlage:
     • Hellfeld, Kap. 11 „Der Weg in den Krieg“, S. 245–259 (Sachfehler korrigiert, s. KORREKTUREN)
     • Clark, Die Schlafwandler, München: DVA 2013, Schluss, S. 791–801
   Änderungen an Inhalten NUR hier vornehmen.
   ===================================================================== */

const JK = {};

JK.meta = {
  titel: "Fünf Wochen im Sommer",
  untertitel: "Die Julikrise 1914 als Entscheidungsspiel",
  leitfrage: "Hineingeschlittert oder bewusst entfesselt? – Warum wurde aus dem Attentat von Sarajevo ein Weltkrieg?",
  kurs: "Leistungskurs Geschichte · Jahrgangsstufe 12 · LB 1 „Herausforderung Frieden“",
  minSuS: 10,
  maxSuS: 15
};

/* ---------- Kabinette ---------- */
JK.kabinette = [
  { id: "dr",  name: "Deutsches Reich",      ort: "Berlin",          kurz: "DR",  block: "Zweibund" },
  { id: "oeu", name: "Österreich-Ungarn",    ort: "Wien",            kurz: "Ö-U", block: "Zweibund" },
  { id: "ru",  name: "Russland",             ort: "St. Petersburg",  kurz: "RU",  block: "Entente" },
  { id: "fr",  name: "Frankreich",           ort: "Paris",           kurz: "FR",  block: "Entente" },
  { id: "gb",  name: "Großbritannien",       ort: "London",          kurz: "GB",  block: "Entente" },
  { id: "srb", name: "Serbien",              ort: "Belgrad",         kurz: "SRB", block: "Schützling Russlands" }
];

/* ---------- Rollen ----------
   prio = Reihenfolge der Besetzung. Bei N Schülern werden die Rollen mit prio <= N besetzt.
   Unbesetzte Rollen werden als „Stimme im Kabinett“ auf der Karte der Leitrolle (prio 1–6) vermerkt. */
JK.rollen = [
  { id: "bethmann", kab: "dr", prio: 1, leit: true,
    name: "Theobald von Bethmann Hollweg", amt: "Reichskanzler",
    haltung: "Sie fürchten die Einkreisung des Reiches und ein Russland, das bis 1917 militärisch übermächtig wird. Ein lokaler Krieg Österreichs gegen Serbien könnte die Entente spalten – oder zum Weltkrieg werden. Sie wagen das Risiko, wollen aber, dass Russland vor der Welt als Angreifer dasteht.",
    ziel: "Österreich als einzigen verlässlichen Verbündeten halten; den Konflikt lokalisieren; Großbritannien neutral halten.",
    roteLinie: "Das Reich darf nicht als Aggressor erscheinen – sonst folgen weder die Sozialdemokraten noch London.",
    geheim: "Ihr Vertrauter Kurt Riezler notiert Ihre Einschätzung: Eine Aktion gegen Serbien kann zum Weltkrieg führen – ein „Sprung ins Dunkle“ (vgl. Hellfeld, S. 252).",
    taktik: "Wien öffentlich zur Mäßigung mahnen, intern aber zum raschen Handeln drängen („fait accompli“)." },
  { id: "moltke", kab: "dr", prio: 7,
    name: "Helmuth von Moltke d. J.", amt: "Chef des Generalstabs",
    haltung: "Die Zeit arbeitet gegen das Reich: Russlands Rüstungsprogramm wird in wenigen Jahren abgeschlossen sein. Wenn Krieg, dann jetzt. Jeder Tag diplomatischer Verzögerung kostet militärische Chancen.",
    ziel: "Den Zeitplan des Aufmarschs sichern; keinen Tag Vorsprung an Russland verlieren.",
    roteLinie: "Kein reiner Ostaufmarsch – es gibt nur einen Kriegsplan, und der beginnt im Westen.",
    geheim: "Der Aufmarschplan (sog. Schlieffen-Plan) sieht vor: Krieg gegen Russland bedeutet sofortigen Angriff auf Frankreich durch das neutrale Belgien; die Festung Lüttich muss in den ersten Tagen fallen. Eine Mobilmachung ist daher faktisch der Krieg.",
    taktik: "Den Kanzler mit militärischen Sachzwängen unter Druck setzen; Wien direkt zur Generalmobilmachung ermutigen." },
  { id: "wilhelm", kab: "dr", prio: 10,
    name: "Kaiser Wilhelm II.", amt: "Deutscher Kaiser und König von Preußen",
    haltung: "Die Ermordung des befreundeten Thronfolgers trifft Sie persönlich. Sie schwanken zwischen Kraftworten und Angst vor dem großen Krieg. Mit dem Zaren, Ihrem Vetter „Nicky“, verbindet Sie eine persönliche Korrespondenz.",
    ziel: "Monarchische Solidarität gegen „Königsmörder“; Prestige des Reiches wahren – aber keinen Krieg gegen Ihren Vetter.",
    roteLinie: "Das Reich darf den Bündnispartner nicht im Stich lassen.",
    geheim: "Sie haben den Bericht Ihres Botschafters in Wien am Rand kommentiert: „Jetzt oder nie! … Mit den Serben muss aufgeräumt werden, und zwar bald.“ (Hellfeld, S. 251)",
    taktik: "Impulsiv urteilen – aber lassen Sie sich von neuen Nachrichten (z. B. einer entgegenkommenden serbischen Antwort) umstimmen." },

  { id: "berchtold", kab: "oeu", prio: 2, leit: true,
    name: "Leopold Graf Berchtold", amt: "Außenminister",
    haltung: "Seit den Balkankriegen 1912/13 sieht Wien, wie Serbien wächst und die Südslawen der Monarchie anzieht. Nach dem Mord muss die Großmacht Österreich-Ungarn handeln – sonst gilt sie als erledigt.",
    ziel: "Serbien als Machtfaktor auf dem Balkan ausschalten; Rückendeckung aus Berlin sichern.",
    roteLinie: "Keine Lösung, die als Nachgeben erscheint.",
    geheim: "Kaiser Franz Joseph hat als Ziel die „Isolierung und Verkleinerung Serbiens“ vorgegeben (Hellfeld, S. 252).",
    taktik: "Ein Ultimatum so formulieren, dass Belgrad es kaum annehmen kann – und Russland keine Zeit zur Absprache bleibt." },
  { id: "conrad", kab: "oeu", prio: 8,
    name: "Franz Conrad von Hötzendorf", amt: "Chef des Generalstabs",
    haltung: "Sie fordern seit Jahren einen Präventivkrieg gegen Serbien. Jetzt ist der Anlass da. Diplomatie hat die Monarchie 1908 und 1913 nur Zeit gekostet.",
    ziel: "Sofortiger Krieg gegen Serbien.",
    roteLinie: "Keine Verhandlungen, keine Konferenzen.",
    geheim: "Die Armee braucht rund 16 Tage bis zur Einsatzbereitschaft gegen Serbien – ein sofortiger Schlag ist praktisch unmöglich.",
    taktik: "Mit der Ehre der Armee und der Existenz der Monarchie argumentieren." },
  { id: "tisza", kab: "oeu", prio: 11,
    name: "István Graf Tisza", amt: "Ungarischer Ministerpräsident",
    haltung: "Sie warnen: Ein Krieg gegen Serbien kann den Weltkrieg auslösen, und die Annexion weiterer Slawen würde die ungarische Stellung in der Doppelmonarchie schwächen.",
    ziel: "Kein überstürzter Krieg; keine Annexion serbischen Gebiets.",
    roteLinie: "Kein Krieg ohne diplomatische Vorbereitung und ohne Verzicht auf Gebietserwerb.",
    geheim: "Sektionsrat Wiesner meldet am 13. Juli: Eine Mitwisserschaft der serbischen Regierung sei „durch nichts erwiesen oder auch nur zu vermuten“ (Hellfeld, S. 253).",
    taktik: "Bremsen – aber Sie können überstimmt werden. Stimmen Sie nur zu, wenn Ihre Bedingungen erfüllt sind." },

  { id: "sasonow", kab: "ru", prio: 3, leit: true,
    name: "Sergei Sasonow", amt: "Außenminister",
    haltung: "1908/09 musste Russland in der Bosnischen Annexionskrise vor Wien und Berlin zurückweichen. Ein zweites Mal darf das nicht geschehen – sonst verliert Russland jeden Einfluss auf dem Balkan und bei den slawischen Völkern.",
    ziel: "Die „Zerstörung Serbiens und des Gleichgewichts auf dem Balkan“ verhindern (Hellfeld, S. 256).",
    roteLinie: "Kein Nachgeben gegenüber einem Angriff auf Serbien.",
    geheim: "Frankreich hat beim Staatsbesuch (20.–23. Juli) die Bündnistreue bekräftigt.",
    taktik: "Mit militärischen Vorbereitungen Druck aufbauen, zugleich Vermittlung fordern (z. B. Fristverlängerung)." },
  { id: "nikolaus", kab: "ru", prio: 9,
    name: "Zar Nikolaus II.", amt: "Kaiser von Russland",
    haltung: "Sie sind friedliebend und unsicher, aber als Schutzherr der Slawen gebunden. Über Telegramme stehen Sie mit Ihrem Vetter „Willy“ in Verbindung.",
    ziel: "Krieg vermeiden, ohne Russlands Ehre zu verlieren.",
    roteLinie: "Serbien darf nicht vernichtet werden.",
    geheim: "Sie können jede Mobilmachung per Befehl anhalten oder begrenzen – noch.",
    taktik: "Zögern Sie. Nutzen Sie den persönlichen Draht nach Berlin (Telegramm)." },
  { id: "januschkewitsch", kab: "ru", prio: 12,
    name: "Nikolai Januschkewitsch", amt: "Chef des Generalstabs",
    haltung: "Russland ist riesig und hat wenig Eisenbahnen. Wer später mobilisiert, verliert. Eine halbe Mobilmachung stiftet Chaos.",

    roteLinie: "Keine Teilmobilmachung, die die Armee desorganisiert.",
    geheim: "Eine Teilmobilmachung nur gegen Österreich ist technisch kaum durchführbar – es gibt dafür keinen ausgearbeiteten Plan.",
    taktik: "Mit der Sicherheit des Reiches argumentieren; den Zaren zur Generalmobilmachung drängen." },

  { id: "poincare", kab: "fr", prio: 4, leit: true,
    name: "Raymond Poincaré", amt: "Staatspräsident",
    haltung: "Frankreichs Sicherheit hängt am Bündnis mit Russland. Ohne Russland steht Frankreich allein gegen das Deutsche Reich. Seit 1871 ist Elsass-Lothringen verloren.",
    ziel: "Das Bündnis mit Russland festigen; Frankreich als Großmacht behaupten.",
    roteLinie: "Russland darf nicht an Frankreichs Treue zweifeln.",
    geheim: "Beim Staatsbesuch in St. Petersburg (20.–23. Juli) warnen Sie den österreichischen Botschafter, Serbien habe Freunde.",
    taktik: "Russland Rückendeckung geben, zugleich Frankreich vor London als friedfertig darstellen." },
  { id: "viviani", kab: "fr", prio: 13,
    name: "René Viviani", amt: "Ministerpräsident und Außenminister",
    haltung: "Sie sind außenpolitisch unerfahren und stehen einer kriegsskeptischen Linken nahe. Frankreich muss so handeln, dass London es als Opfer, nicht als Angreifer sieht.",
    ziel: "Großbritannien auf Frankreichs Seite ziehen.",
    roteLinie: "Kein französischer Schritt, der wie eine Provokation aussieht.",
    geheim: "Ohne britische Unterstützung ist ein Krieg für Frankreich hoch riskant.",
    taktik: "Zurückhaltung demonstrieren (z. B. Truppen von der Grenze zurückziehen)." },

  { id: "grey", kab: "gb", prio: 5, leit: true,
    name: "Sir Edward Grey", amt: "Außenminister",
    haltung: "Großbritannien ist durch keinen Bündnisvertrag gebunden, aber durch militärische Absprachen moralisch an Frankreich. Sie wollen vermitteln – und Berlin im Unklaren lassen, ob London eingreift.",
    ziel: "Vermittlung durch die unbeteiligten Mächte; Gleichgewicht in Europa erhalten.",
    roteLinie: "Frankreich darf nicht niedergeworfen werden; die Kanalküste nicht in deutsche Hand fallen.",
    geheim: "Die Mehrheit im Kabinett ist gegen ein Eingreifen – es sei denn, Belgiens Neutralität (garantiert 1839) wird verletzt.",
    taktik: "Vermittlungsvorschläge machen; Warnungen an Berlin nur vorsichtig dosieren." },
  { id: "asquith", kab: "gb", prio: 14,
    name: "Herbert Henry Asquith", amt: "Premierminister",
    haltung: "Ihre Regierung ist gespalten, und in Irland droht wegen der Home-Rule-Frage ein Bürgerkrieg. Ein Kontinentalkrieg kommt zur Unzeit.",

    roteLinie: "Kein Kriegseintritt, der die Regierung zerbrechen lässt.",
    geheim: "Mehrere Minister drohen mit Rücktritt, falls Großbritannien Frankreich ohne klaren Anlass beisteht.",
    taktik: "Zeit gewinnen; auf einen Anlass warten, der das Land eint." },

  { id: "pasic", kab: "srb", prio: 6, leit: true,
    name: "Nikola Pašić", amt: "Ministerpräsident",
    haltung: "Serbien ist erschöpft von zwei Balkankriegen. Im August sind Wahlen. Das Offizierskorps um Oberst Dimitrijević ist mächtig und nationalistisch – Sie können es kaum kontrollieren.",
    ziel: "Krieg vermeiden, ohne die Souveränität Serbiens preiszugeben; russischen Schutz sichern.",
    roteLinie: "Keine österreichischen Beamten, die auf serbischem Boden ermitteln.",
    geheim: "Sie hatten Anfang Juni vage Hinweise auf den Grenzübertritt bewaffneter junger Männer. Eine offene Untersuchung könnte das eigene Militär belasten.",
    taktik: "Entgegenkommen zeigen, aber Kernpunkte ablehnen; Russland um Beistand bitten." },
  { id: "apis", kab: "srb", prio: 15,
    name: "Oberst Dragutin Dimitrijević („Apis“)", amt: "Chef des militärischen Nachrichtendienstes",
    haltung: "Sie führen den Geheimbund „Vereinigung oder Tod“ („Schwarze Hand“). Das Ziel ist die Vereinigung aller Serben – notfalls durch Gewalt.",
    ziel: "Keine Unterwerfung unter Wien; kein Einblick Österreichs in die Netzwerke.",
    roteLinie: "Keine Untersuchung gegen serbische Offiziere.",
    geheim: "Aus Ihrem Umfeld stammten Waffen und Hilfe für die Attentäter. Wird das bekannt, ist die Regierung – und Serbien – in höchster Gefahr.",
    taktik: "Jede Nachgiebigkeit der Regierung als Verrat brandmarken." }

<script>
/* Wird von export_html.py mit dem Planungsleitfaden und dem Druckmaterial befüllt. */
const DOCS = {"leitfaden": "<!DOCTYPE html>\n<html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Planungsleitfaden Julikrise<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap\">\n<style>\n:root{--paper:#E8ECE6;--panel:#F6F7F3;--ink:#1A2126;--ink-2:#4B5660;--rule:#C3CBC2;--seal:#9B2C24;--brass:#8F6A1E;color-scheme:light}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--paper:#111618;--panel:#1A2124;--ink:#E6E7E1;--ink-2:#A3ADAC;--rule:#2E383B;--seal:#E0685C;--brass:#D2A64E;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--paper:#111618;--panel:#1A2124;--ink:#E6E7E1;--ink-2:#A3ADAC;--rule:#2E383B;--seal:#E0685C;--brass:#D2A64E;color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 \"IBM Plex Sans\",system-ui,sans-serif;padding-inline:16px}\nmain{max-width:980px;margin:0 auto;padding-block:40px 80px}\nh1,h2,h3{font-family:\"Bodoni Moda\",Didot,Georgia,serif;font-weight:500;line-height:1.15;text-wrap:balance}\nh1{font-size:clamp(1.9rem,4vw,2.8rem);margin:0 0 16px}\nh2{font-size:1.7rem;margin:48px 0 12px;padding-top:16px;border-top:2px solid var(--ink)}\nh3{font-size:1.25rem;margin:28px 0 8px}\np,li{max-width:75ch}\na{color:var(--seal)}\nblockquote{margin:0 0 20px;padding:12px 16px;border-left:3px solid var(--seal);background:var(--panel);color:var(--ink-2);font-size:.92em}\nblockquote p{margin:4px 0}\nhr{border:0;border-top:1px solid var(--rule);margin:32px 0}\n.tw{overflow-x:auto;margin:12px 0 20px}\ntable{border-collapse:collapse;width:100%;font-size:.9em;background:var(--panel)}\nth,td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}\nth{font-family:\"IBM Plex Mono\",monospace;font-size:.8em;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}\npre{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px;overflow-x:auto;font:12.5px/1.35 \"IBM Plex Mono\",ui-monospace,Menlo,monospace}\ncode{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:.88em}\np code,li code,td code{background:var(--panel);padding:1px 5px;border-radius:3px}\n@media print{body{background:#fff;color:#000;padding:0} main{padding:0;max-width:none} h2{break-before:page} pre,table{break-inside:avoid}}\n<\/style><\/head>\n<body><main>\n<h1>Planungsleitfaden: Der Weg in den Ersten Weltkrieg – Die Julikrise 1914 als Dilemma- und Entscheidungsspiel<\/h1>\n<blockquote>\n<p><strong>Pädagogisch-didaktischer Planungsleitfaden (Vorstufe zum Unterrichtsentwurf und Materialpaket)<\/strong><br>\n<strong>Kontext:<\/strong> Gymnasium Sachsen, Fach Geschichte, <strong>Leistungskurs Jahrgangsstufe 12<\/strong>, LB 1 „Herausforderung ‚Frieden‘ – Die Suche nach dauerhaft friedlichem Zusammenleben“<br>\n<strong>Umfang:<\/strong> 1 Doppelstunde (90 min)<br>\n<strong>Konzeption:<\/strong> Konform mit dem <a href=\"file:///Users/michelabicht/Library/Mobile%20Documents/com~apple~CloudDocs/Workspace_Claude/Geschichte/0_Vorgaben%20und%20Vorlagen/00_Didaktischer_Leitfaden_Unterrichtsstil.md\">Didaktischen Leitfaden<\/a>, dem <a href=\"file:///Users/michelabicht/Library/Mobile%20Documents/com~apple~CloudDocs/Workspace_Claude/Geschichte/0_Vorgaben%20und%20Vorlagen/00.2_Paedagogischer_Entwicklungsplan_fuer_die_Unterrichtsplanung.md\">Pädagogischen Entwicklungsplan<\/a> und den <a href=\"file:///Users/michelabicht/Library/Mobile%20Documents/com~apple~CloudDocs/Workspace_Claude/Geschichte/0_Vorgaben%20und%20Vorlagen/00.4_Operatoren%20nach%20Cornelsen.md\">Operatoren nach Cornelsen<\/a><br>\n<strong>Status:<\/strong> Spiel und Materialien erstellt (siehe Kap. 15).<\/p>\n<\/blockquote>\n<hr>\n<h2>0. Kurzüberblick<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Element<\/th>\n<th style=\"text-align: left;\">Festlegung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Leitfrage<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>„Hineingeschlittert oder bewusst entfesselt? – Warum wurde aus dem Attentat von Sarajevo ein Weltkrieg?“<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Kernidee<\/strong><\/td>\n<td style=\"text-align: left;\">Die Schüler übernehmen als <strong>Kabinette der fünf Großmächte und Serbiens<\/strong> die Entscheidungen der Julikrise. In vier Runden mit schrumpfendem Zeitbudget, unvollständiger Information und verzögerter Kommunikation erleben sie, wie strukturelle Zwänge (Bündnisse, Mobilmachungspläne, Prestige, Öffentlichkeit) und individuelle Entscheidungen ineinandergreifen.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>LK-Mehrwert<\/strong><\/td>\n<td style=\"text-align: left;\">Die Spielerfahrung wird nicht als Ergebnis stehen gelassen, sondern an der <strong>Forschungskontroverse<\/strong> (Fischer – Clark – Krumeich/Mombauer) <strong>überprüft<\/strong>. Das Spiel wird damit selbst zur „Quelle“, die dekonstruiert wird.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Lehrplanbezug<\/strong><\/td>\n<td style=\"text-align: left;\">LK 12, LB 1: <strong>11.1.1<\/strong> (Ursachen von Kriegen; Erster Weltkrieg als Folge von Imperialismus und Nationalismus; <em>Methodenbewusstsein:<\/em> fachwissenschaftliche Kontroversen um den Kriegsausbruch) · <strong>11.1.4<\/strong> (Möglichkeiten und Grenzen gewaltfreier Konfliktregelung; <em>Alternativen und Entscheidungsspielräume<\/em>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Methode<\/strong><\/td>\n<td style=\"text-align: left;\">Historisches Dilemma- und Entscheidungsspiel (Kabinettssimulation) → Dekonstruktion → <strong>Zehn Weggabelungen<\/strong> → Kontroversenanalyse → Positionslinie<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Kernerkenntnis<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>Der Erste Weltkrieg war nicht zwangsläufig.<\/strong> An mindestens zehn Stellen zwischen dem 28. Juni und dem 1. August hätte ein Kabinett die Kette unterbrechen können. Die SuS erkennen das am eigenen Spiel (genutzte vs. ungenutzte Auswege) und fragen zugleich, <em>warum<\/em> diese Auswege 1914 nicht genutzt wurden (Schutz vor Rückschaufehler).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sozialformen<\/strong><\/td>\n<td style=\"text-align: left;\">Kabinetts-Gruppenarbeit (6 Kabinette, 10–15 SuS) · Plenum · Einzelarbeit<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Produkt<\/strong><\/td>\n<td style=\"text-align: left;\">Kabinettsprotokoll (Entscheidung, Begründung, Risiko, Informationslücke) + persönliches Sachurteil auf der Positionslinie<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr>\n<h2>1. Systemischer Datensatz (<code>BASE_PLAN 2.0<\/code>)<\/h2>\n<pre><code class=\"language-javascript\">{\n  id: &quot;lk12-ww1-01&quot;,\n  cat: &quot;lb1&quot;,\n  lab: &quot;LB 1&quot;,\n  hist: &quot;28. Juni – 4. August 1914&quot;,\n  title: &quot;Hineingeschlittert oder entfesselt? — Die Julikrise 1914 als Dilemma- und Entscheidungsspiel&quot;,\n  ziel: &quot;Die langfristigen Ursachen und die Entscheidungskaskade der Julikrise analysieren, das Verhältnis von strukturellen Zwängen und Handlungsspielräumen der Akteure beurteilen sowie die Forschungskontroverse um den Kriegsausbruch auf Basis der Spielerfahrung kritisch erörtern.&quot;,\n  inhalt: [\n    &quot;Strukturelle Ursachen: Imperialismus, Nationalismus, Bündnissysteme, Wettrüsten, Militarismus, Balkankonflikte&quot;,\n    &quot;Auslöser: Attentat von Sarajevo (28. Juni 1914)&quot;,\n    &quot;Entscheidungskaskade der Julikrise: Blankoscheck – Ultimatum – Mobilmachungen – Kriegserklärungen&quot;,\n    &quot;Militärische Automatismen: Schlieffen-Plan, russische Generalmobilmachung, Verletzung der belgischen Neutralität&quot;,\n    &quot;Forschungskontroverse: Fischer (1961), Clark (2012), Krumeich/Mombauer (2013/14)&quot;\n  ],\n  codes: [&quot;LK12 LB1 11.1.1&quot;, &quot;LK12 LB1 11.1.4&quot;],\n  quellen: &quot;Telegramme und Aktenstücke der Julikrise (Blankoscheck, Ultimatum, Willy-Nicky-Telegramme, Randbemerkungen Wilhelms II.), Riezler-Tagebuch (Auszug), Karte Bündnissysteme 1914 (Putzger), historiographische Darstellungen (Fischer, Clark, Krumeich, Mombauer)&quot;,\n  methode: &quot;Historisches Dilemma- und Entscheidungsspiel (Kabinettssimulation, 4 Runden) mit Telegrammsystem, Eskalationsbarometer und Positionslinie&quot;,\n  sozial: &quot;Plenum / Kabinetts-GA (6 Kabinette) / EA&quot;,\n  material: &quot;Bildschirm/Beamer (Lagemeldungen, Timer, Eskalationsbarometer), Kabinettsdossiers, Lagekarten, Telegrammformulare, Kabinettsprotokolle, Forschungspositionen, Putzger-Atlas, gestufte Tippkarten, Exit-Ticket&quot;,\n  komp: &quot;Urteilskompetenz (Sach- vs. Werturteil), Methodenbewusstsein (Kontroversenanalyse), Perspektivübernahme, Ambiguitätstoleranz, Reflexion von Geschichte als Deutungskonstrukt&quot;,\n  darum: &quot;Kein Staatsmann wollte im Juli 1914 einen Weltkrieg mit Millionen Toten – und trotzdem kam er in nur fünf Wochen. Wer selbst am Kabinettstisch sitzt, versteht, wie Bündnisversprechen, Zeitpläne der Militärs und die Angst vor Gesichtsverlust eine Krise unaufhaltsam machen können – ein Muster, das bis heute in internationalen Krisen wirkt.&quot;,\n  koennen: [\n    &quot;Du legst die langfristigen Ursachen des Ersten Weltkriegs (Imperialismus, Nationalismus, Bündnissysteme, Wettrüsten, Balkankrisen) dar [AFB I] [LK12 LB1 11.1.1].&quot;,\n    &quot;Du stellst die Entscheidungskaskade der Julikrise vom Attentat bis zum britischen Kriegseintritt chronologisch dar [AFB I].&quot;,\n    &quot;Du analysierst die Handlungsspielräume und Zwänge der Großmächte in der Julikrise multiperspektivisch [AFB II].&quot;,\n    &quot;Du erklärst, wie militärische Planungen (Schlieffen-Plan, Mobilmachung) diplomatische Spielräume verengten [AFB II].&quot;,\n    &quot;Du arbeitest die Kernthesen zentraler Forschungspositionen (Fischer, Clark, Krumeich/Mombauer) heraus und vergleichst sie kriteriengeleitet [AFB II / Methodenbewusstsein].&quot;,\n    &quot;Du beurteilst, inwieweit der Kriegsausbruch eher durch strukturelle Zwänge oder durch bewusste Entscheidungen zu erklären ist [AFB III – Sachurteil] [LK12 LB1 11.1.4].&quot;,\n    &quot;Du nimmst Stellung zur Frage, ob die Kategorie „Kriegsschuld“ ein angemessener Maßstab für historische Urteile ist [AFB III – Werturteil].&quot;,\n    &quot;Du benennst Weggabelungen der Julikrise, an denen der Krieg hätte verhindert werden können, und beurteilst, warum sie nicht genutzt wurden [AFB III – Sachurteil].&quot;,\n    &quot;Du überprüfst die Aussagekraft einer Simulation als Zugang zur Geschichte und reflektierst den Rückschaufehler (Hindsight Bias) [AFB III – Metakognition].&quot;\n  ],\n  begriffe: [\n    { t: &quot;Julikrise&quot;, d: &quot;Diplomatische Krise zwischen dem Attentat von Sarajevo (28.6.1914) und den Kriegserklärungen Anfang August 1914, in der sich ein regionaler Konflikt zum europäischen Krieg ausweitete.&quot; },\n    { t: &quot;Blankoscheck&quot;, d: &quot;Bedingungslose Unterstützungszusage des Deutschen Reiches an Österreich-Ungarn vom 5./6. Juli 1914 für ein Vorgehen gegen Serbien.&quot; },\n    { t: &quot;Ultimatum an Serbien&quot;, d: &quot;Befristete Forderung Österreich-Ungarns vom 23.7.1914 (48 Stunden), die in Teilen die Souveränität Serbiens verletzte und bewusst schwer annehmbar formuliert war.&quot; },\n    { t: &quot;Bündnissysteme&quot;, d: &quot;Zweibund/Dreibund (Deutsches Reich, Österreich-Ungarn, Italien) vs. Triple Entente (Frankreich, Russland, Großbritannien); verwandelten lokale Konflikte in Konflikte zwischen Blöcken.&quot; },\n    { t: &quot;Schlieffen-Plan&quot;, d: &quot;Deutscher Aufmarschplan für einen Zweifrontenkrieg: rascher Sieg über Frankreich durch Umfassung über das neutrale Belgien, danach Wendung gegen Russland.&quot; },\n    { t: &quot;Generalmobilmachung&quot;, d: &quot;Vollständige Versetzung der Streitkräfte in Kriegsbereitschaft; galt 1914 in Deutschland faktisch als gleichbedeutend mit Krieg.&quot; },\n    { t: &quot;Kalkuliertes Risiko&quot;, d: &quot;Deutung der deutschen Politik (Jarausch, Krumeich): Berlin nahm einen großen Krieg bewusst in Kauf, um einen lokalen Sieg Österreichs und eine diplomatische Schwächung der Entente zu erreichen.&quot; },\n    { t: &quot;Fischer-Kontroverse&quot;, d: &quot;Streit um Fritz Fischers These (1961), das Deutsche Reich trage wegen seiner Weltmachtziele den entscheidenden Teil der Verantwortung am Kriegsausbruch.&quot; },\n    { t: &quot;Schlafwandler-These&quot;, d: &quot;Deutung Christopher Clarks (2012): Die Kriegsverantwortung sei auf mehrere Mächte verteilt; die Akteure seien ‚wachsam, aber blind‘ in den Krieg gegangen.&quot; },\n    { t: &quot;Kriegsschuldartikel (Art. 231 VV)&quot;, d: &quot;Artikel des Versailler Vertrags, der Deutschland und seinen Verbündeten die Verantwortung für alle Kriegsschäden zuschrieb; prägte die Debatte um die Kriegsschuld bis heute.&quot; }\n  ],\n  differenzierung: {\n    scaffolding: &quot;Kabinettsdossiers mit markierten ‚roten Linien‘ und Entscheidungsoptionen; gestufte Tippkarten zur Kontroversenanalyse; Satzstarter für Sach- und Werturteil; Glossar der Julikrise auf der Rückseite des Protokolls.&quot;,\n    challenge: &quot;Rolle ‚Historiker-Beobachter‘ (Chronist ohne Entscheidungsrecht, dokumentiert die Kabinettsdynamik und bringt sie in Phase 3 als ‚Quelle‘ ein) sowie Challenge-Karte: Überprüfen Sie Clarks These an der serbischen Perspektive und an der russischen Generalmobilmachung.&quot;\n  },\n  formativesFeedback: &quot;Exit-Ticket: 3-2-1 plus Operator-Check (‚Beurteilen Sie in zwei Sätzen, an welchem Punkt der Julikrise der Krieg noch vermeidbar war.‘)&quot;,\n  handlungsprodukt: &quot;Kabinettsprotokoll mit Entscheidung, Begründung, größtem Risiko und fehlender Information je Runde; Telegramme an andere Mächte.&quot;,\n  begruendung: &quot;Die Julikrise ist der Prototyp einer Eskalation unter Zeitdruck. Die Dilemma-Methode macht den Widerspruch zwischen ‚keiner wollte den großen Krieg‘ und ‚alle trafen Entscheidungen, die ihn wahrscheinlicher machten‘ erlebbar. Für den LK entscheidend ist die anschließende Dekonstruktion: Die Spielerfahrung wird an konkurrierenden Forschungspositionen geprüft, sodass die Schüler Kontroversität als Kern historischen Erkennens begreifen und vor vorschnellen Entlastungs- oder Schuldnarrativen geschützt werden.&quot;,\n  hinweis: &quot;Strukturelle Ursachen als vorbereitende Hausaufgabe (Dossier via LernSax) auslagern, da die 90 min sonst nicht reichen. Zeittakt der Runden strikt einhalten (7 → 6 → 5 → 4 min). Lehrkraft agiert als ‚Telegrafenamt‘ und Spielleitung. Bei starken Abweichungen vom historischen Verlauf wird die Lage trotzdem historisch fortgeschrieben (Abweichungsprotokoll).&quot;\n}\n<\/code><\/pre>\n<hr>\n<h2>2. Bedingungsanalyse &amp; Lernvoraussetzungen<\/h2>\n<h3>2.1 Lerngruppe (Leistungskurs 12)<\/h3>\n<ul>\n<li><strong>Vorwissen:<\/strong> Aus der Sekundarstufe I (Kl. 8: Imperialismus, Ursachen des Ersten Weltkriegs) sind Grundbegriffe bekannt, aber meist als <strong>monokausale Ursachen-Liste<\/strong> („Bündnisse, Wettrüsten, Attentat“) gespeichert. Die Stunde soll diese Liste in ein <strong>Bedingungsgefüge<\/strong> überführen.<\/li>\n<li><strong>LK-Anspruch (Lehrplan):<\/strong> größere Komplexität der Urteile, höherer Abstraktionsgrad, Auseinandersetzung mit Fachtheorien und Kontroversen – das Spiel ist daher Mittel, nicht Ziel.<\/li>\n<li><strong>Vorlauf in der Sequenz:<\/strong> Bismarcks Bündnispolitik (11.1.4) sollte bereits behandelt sein; die Stunde knüpft an den „Bruch“ nach 1890 an.<\/li>\n<li><strong>Gruppengröße:<\/strong> Konzept für 12–22 SuS (5 Kabinette à 3–4 SuS; optional 6. Gruppe Serbien und/oder 1–2 Beobachter).<\/li>\n<\/ul>\n<h3>2.2 Vorbereitende Hausaufgabe (verbindlich, ca. 30 min)<\/h3>\n<blockquote>\n<p><strong>Dossier „Pulverfass Europa 1871–1914“<\/strong> (M0, via LernSax, 2–3 Seiten + Karte)\n1. <strong>Nennen Sie<\/strong> die Bündnisse und Bündnisverpflichtungen der Großmächte 1914.\n2. <strong>Erläutern Sie<\/strong> an je einem Beispiel die Konfliktfelder Flottenrüstung, Marokkokrisen (1905/1911) und Balkankriege (1912/13).\n3. <strong>Skizzieren Sie<\/strong> den Grundgedanken des Schlieffen-Plans.<\/p>\n<\/blockquote>\n<p><em>Begründung:<\/em> Das Spiel funktioniert nur, wenn die strukturellen Rahmenbedingungen bekannt sind. Die Auslagerung sichert Spielzeit und schafft einen Rahmen, den alle kennen.<\/p>\n<hr>\n<h2>3. Sachanalyse (didaktisch reduziert)<\/h2>\n<h3>3.1 Strukturelle Ursachen (Rahmen des Spiels)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Faktor<\/th>\n<th style=\"text-align: left;\">Kernaspekt<\/th>\n<th style=\"text-align: left;\">Wirkung in der Julikrise<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Imperialismus &amp; Weltpolitik<\/strong><\/td>\n<td style=\"text-align: left;\">Deutscher Anspruch auf „Platz an der Sonne“, Rivalität mit GB<\/td>\n<td style=\"text-align: left;\">Einkreisungsangst in Berlin<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Bündnissysteme<\/strong><\/td>\n<td style=\"text-align: left;\">Zweibund vs. Entente; Abhängigkeit Berlins vom einzigen verlässlichen Partner Wien<\/td>\n<td style=\"text-align: left;\">Lokaler Konflikt wird zum Blockkonflikt<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Wettrüsten &amp; Militarismus<\/strong><\/td>\n<td style=\"text-align: left;\">Flottenrüstung, Heeresvorlagen 1912/13, Präventivkriegsdenken im Generalstab („jetzt oder nie“, russ. Rüstungsprogramm bis 1917)<\/td>\n<td style=\"text-align: left;\">Zeitdruck, Vorrang militärischer Logik<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Nationalismus<\/strong><\/td>\n<td style=\"text-align: left;\">Panslawismus, großserbische Bewegung, Zerfallsangst des Vielvölkerstaats Ö-U<\/td>\n<td style=\"text-align: left;\">Prestige- und Existenzlogik<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Balkankrisen<\/strong><\/td>\n<td style=\"text-align: left;\">Bosnische Annexionskrise 1908, Balkankriege 1912/13<\/td>\n<td style=\"text-align: left;\">Russland will kein zweites Nachgeben<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Mobilmachungspläne<\/strong><\/td>\n<td style=\"text-align: left;\">Schlieffen-Plan: Krieg gegen Russland = sofortiger Angriff auf Frankreich über Belgien<\/td>\n<td style=\"text-align: left;\">Militärischer Automatismus<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.2 Entscheidungskaskade der Julikrise (historische „Schiene“ des Spiels)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Datum<\/th>\n<th style=\"text-align: left;\">Ereignis / Entscheidung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">28.6.<\/td>\n<td style=\"text-align: left;\">Attentat von Sarajevo (Gavrilo Princip, „Mlada Bosna“; Unterstützung aus Kreisen der „Schwarzen Hand“)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">5./6.7.<\/td>\n<td style=\"text-align: left;\">Hoyos-Mission; <strong>Blankoscheck<\/strong> Wilhelms II. und Bethmann Hollwegs an Wien<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">7.7.<\/td>\n<td style=\"text-align: left;\">Gemeinsamer Ministerrat Wien: Kurs auf unannehmbares Ultimatum (ungarischer MP Tisza zunächst dagegen)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">20.–23.7.<\/td>\n<td style=\"text-align: left;\">Staatsbesuch Poincarés und Vivianis in St. Petersburg: Bekräftigung des Bündnisses<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">23.7.<\/td>\n<td style=\"text-align: left;\"><strong>Ultimatum an Serbien<\/strong> (48 h)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">24./25.7.<\/td>\n<td style=\"text-align: left;\">Russischer Ministerrat/Kronrat: „Periode der Kriegsvorbereitung“; serbische Antwort weitgehend entgegenkommend, Punkt 6 abgelehnt; Wien bricht die Beziehungen ab<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">26./27.7.<\/td>\n<td style=\"text-align: left;\">Greys Vorschlag einer Botschafterkonferenz; Berlin lehnt ab<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">28.7.<\/td>\n<td style=\"text-align: left;\">Wilhelm II.: „jeder Grund zum Kriege“ entfallen („Halt in Belgrad“-Idee); dennoch <strong>Kriegserklärung Ö-U an Serbien<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">29.7.<\/td>\n<td style=\"text-align: left;\">Beschießung Belgrads; russische Teilmobilmachung; Grey warnt Botschafter Lichnowsky; Willy-Nicky-Telegramme<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">30.7.<\/td>\n<td style=\"text-align: left;\">Bethmann drängt Wien zu Verhandlungen – zeitgleich drängt Moltke Conrad zur Generalmobilmachung; <strong>russische Generalmobilmachung<\/strong>; französischer 10-km-Rückzug von der Grenze<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">31.7.<\/td>\n<td style=\"text-align: left;\">„Zustand drohender Kriegsgefahr“ im Reich; Ultimaten an Russland und Frankreich; Generalmobilmachung Ö-U<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">1.8.<\/td>\n<td style=\"text-align: left;\">Deutsche Mobilmachung, <strong>Kriegserklärung an Russland<\/strong>; französische Mobilmachung<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2.–3.8.<\/td>\n<td style=\"text-align: left;\">Ultimatum an Belgien; Kriegserklärung an Frankreich<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">4.8.<\/td>\n<td style=\"text-align: left;\">Einmarsch in Belgien; <strong>britischer Kriegseintritt<\/strong>; Reichstag bewilligt Kriegskredite („Burgfrieden“)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.3 Forschungskontroverse (für Phase 3)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Position<\/th>\n<th style=\"text-align: left;\">Kernthese<\/th>\n<th style=\"text-align: left;\">Schlüsselbegriff<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Zwischenkriegszeit / Lloyd George<\/strong><\/td>\n<td style=\"text-align: left;\">Alle Mächte sind in den Krieg „hineingeschlittert“<\/td>\n<td style=\"text-align: left;\"><em>Hineinschlittern<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Fritz Fischer<\/strong> (<em>Griff nach der Weltmacht<\/em>, 1961)<\/td>\n<td style=\"text-align: left;\">Deutsches Reich trägt wegen Weltmachtzielen einen entscheidenden Teil der Verantwortung; Kontinuität der Kriegsziele<\/td>\n<td style=\"text-align: left;\"><em>Griff nach der Weltmacht<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Christopher Clark<\/strong> (<em>Die Schlafwandler<\/em>, 2012/13)<\/td>\n<td style=\"text-align: left;\">Verantwortung multipolar verteilt; Serbien, Russland, Frankreich stärker einbezogen; Frage nach dem <em>Wie<\/em> statt nach der Schuld<\/td>\n<td style=\"text-align: left;\"><em>Schlafwandler<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Gerd Krumeich<\/strong> (<em>Juli 1914. Eine Bilanz<\/em>, 2014) / <strong>Annika Mombauer<\/strong> (<em>Die Julikrise<\/em>, 2014)<\/td>\n<td style=\"text-align: left;\">Berlin und Wien trugen die Hauptverantwortung; Berlin betrieb eine Politik des kalkulierten Risikos<\/td>\n<td style=\"text-align: left;\"><em>kalkuliertes Risiko<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Hinweis für die Materialerstellung:<\/strong> Alle Zitate aus Fachliteratur und Quellen müssen vor dem Druck an Originalausgaben (Seitenangaben) überprüft werden. Wo keine geprüfte Fassung vorliegt, wird mit gekennzeichneten Paraphrasen gearbeitet.<\/p>\n<\/blockquote>\n<hr>\n<h2>4. Didaktische Analyse<\/h2>\n<h3>4.1 Gegenwarts- und Zukunftsbedeutung<\/h3>\n<ul>\n<li><strong>Krisenmechanik:<\/strong> Bündnisverpflichtungen, Abschreckung, Zeitdruck und Gesichtswahrung sind Muster heutiger Krisen (NATO-Bündnisfall, Taiwan, Nahost). Die Julikrise liefert ein Analysemodell, das auf Gegenwartskrisen übertragbar ist (Lebensweltbezug 11.0.4: „Kriege ziehen durch Eigendynamik … unkontrollierbare Folgen nach sich“).<\/li>\n<li><strong>Geschichtskultur:<\/strong> Die Clark-Rezeption in Deutschland (2013/14) und der Entlastungsdiskurs zeigen, dass Deutungen des Kriegsausbruchs politisch aufgeladen bleiben (Brücke zu LB 2).<\/li>\n<\/ul>\n<h3>4.2 Exemplarität<\/h3>\n<p>Die Julikrise ist <strong>das<\/strong> Lehrbeispiel für das Zusammenspiel von <strong>Struktur und Handlung<\/strong>. Sie steht im Längsschnitt des LB 1 als Kontrastfall zu Wiener Kongress (Interessenausgleich) und Kubakrise (gelungenes Krisenmanagement).<\/p>\n<h3>4.3 Didaktische Reduktion<\/h3>\n<ul>\n<li><strong>Fünf Großmächte<\/strong> als Spielakteure; Serbien und Belgien als optionale Rollen bzw. als Lageakteure der Spielleitung. Italien und das Osmanische Reich entfallen.<\/li>\n<li><strong>Vier Entscheidungsrunden<\/strong> statt fünf Wochen – jede Runde bündelt einen Wendepunkt.<\/li>\n<li><strong>Historische Schiene:<\/strong> Die Lage wird nach jeder Runde historisch fortgeschrieben, unabhängig von der Gruppenentscheidung. Abweichungen werden protokolliert und in Phase 3 ausgewertet. So bleibt das Spiel steuerbar und Kontrafaktik wird zum Analysegegenstand statt zum Chaos.<\/li>\n<\/ul>\n<h3>4.4 Warum Dilemma- und Entscheidungsspiel?<\/h3>\n<ol>\n<li><strong>Schutz vor dem Rückschaufehler:<\/strong> Wir wissen, dass 1914 in die Katastrophe führte; die Akteure wussten es nicht. Das Spiel stellt die <strong>Offenheit der Situation<\/strong> wieder her.<\/li>\n<li><strong>Wertekonflikte sichtbar machen:<\/strong> Jede Macht steht vor einem echten Dilemma (Bündnistreue vs. Friedenswahrung, Prestige vs. Risiko, Diplomatie vs. militärischer Zeitplan).<\/li>\n<li><strong>Kontroverse erfahrungsbasiert erschließen:<\/strong> Wer im Spiel erlebt hat, dass „alle irgendwie mitgemacht haben“, versteht Clarks These. Wer sieht, dass Berlin und Wien die Initiative hatten, versteht Fischer und Krumeich. Die Schüler prüfen die Forschung an eigener Erfahrung und umgekehrt.<\/li>\n<li><strong>Anknüpfung an die Kubakrise:<\/strong> Die Schüler kennen die Methode aus Kl. 10 (Kubakrise). Im LK wird sie komplexer (fünf Akteure, Telegrammsystem, Binnenkonflikte in Kabinetten) und durch die Kontroverse ergänzt.<\/li>\n<\/ol>\n<hr>\n<h2>5. Spieldesign: Das Entscheidungsspiel „Fünf Wochen im Sommer“<\/h2>\n<h3>5.1 Grundmechanik<\/h3>\n<pre><code>┌─────────────────────────────────────────────────────────────────────────────┐\n│  SPIELLEITUNG (Lehrkraft) = „Telegrafenamt“ &amp; Chronist der Lage             │\n│    • gibt Lagemeldungen aus (Beamer + Lagekarte)                            │\n│    • stellt Telegramme zwischen Kabinetten zu – MIT VERZÖGERUNG             │\n│      (Zustellung erst zu Beginn der nächsten Runde)                         │\n│    • führt das ESKALATIONSBAROMETER (0 = Frieden … 10 = Weltkrieg)          │\n├─────────────────────────────────────────────────────────────────────────────┤\n│  5 KABINETTE (je 3–4 SuS, Sitzgruppen)                                      │\n│    Deutsches Reich · Österreich-Ungarn · Russland · Frankreich · GB         │\n│    (optional: Serbien · Beobachter/Chronist)                                │\n├─────────────────────────────────────────────────────────────────────────────┤\n│  JE RUNDE:                                                                  │\n│   1. Lagemeldung (1 min)                                                    │\n│   2. Kabinettsberatung unter Timer (7 → 6 → 5 → 4 min)                      │\n│      → Entscheidung + max. 1 Telegramm an eine andere Macht                 │\n│   3. Protokolleintrag (Entscheidung, Begründung, Risiko, Informationslücke) │\n│   4. Aufdeckung: Alle Entscheidungen werden verlesen,                       │\n│      Barometer wird verschoben, historische Entscheidung wird enthüllt      │\n└─────────────────────────────────────────────────────────────────────────────┘\n<\/code><\/pre>\n<h3>5.2 Didaktische Kernmechaniken (bewusst eingebaute „Zwänge“)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Mechanik<\/th>\n<th style=\"text-align: left;\">Historisches Pendant<\/th>\n<th style=\"text-align: left;\">Erfahrung für SuS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Schrumpfender Timer<\/strong><\/td>\n<td style=\"text-align: left;\">Beschleunigung der Krise ab 23.7.<\/td>\n<td style=\"text-align: left;\">Zeitdruck verdrängt Abwägung<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Verzögerte Telegramme<\/strong><\/td>\n<td style=\"text-align: left;\">Langsame, missverständliche Kommunikation (Lichnowsky-Missverständnis am 1.8.)<\/td>\n<td style=\"text-align: left;\">Signale kommen zu spät oder werden falsch gelesen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Geheiminformationen<\/strong><\/td>\n<td style=\"text-align: left;\">Nur Berlin kennt den Schlieffen-Plan in voller Konsequenz; Russland: Teilmobilmachung militärisch kaum durchführbar<\/td>\n<td style=\"text-align: left;\">Informationsasymmetrie<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Binnenkonflikte in Kabinetten<\/strong><\/td>\n<td style=\"text-align: left;\">Bethmann vs. Moltke; Sasonow vs. Zar; Tisza vs. Conrad; Grey vs. Kabinettsmehrheit<\/td>\n<td style=\"text-align: left;\">Entscheidungen sind Kompromisse, nicht Masterpläne<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Rote Linien<\/strong><\/td>\n<td style=\"text-align: left;\">Prestige, Bündnisverpflichtung, Existenz der Monarchie<\/td>\n<td style=\"text-align: left;\">Rückzug erscheint unmöglich<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Historische Schiene<\/strong><\/td>\n<td style=\"text-align: left;\">–<\/td>\n<td style=\"text-align: left;\">Kontrafaktik wird sichtbar, aber nicht wirksam; Vergleich eigener Wahl mit realer Entscheidung<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>5.3 Rollen in den Kabinetten (Rollenkarten in M1)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Kabinett<\/th>\n<th style=\"text-align: left;\">Rolle 1<\/th>\n<th style=\"text-align: left;\">Rolle 2<\/th>\n<th style=\"text-align: left;\">Rolle 3<\/th>\n<th style=\"text-align: left;\">(Rolle 4)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Deutsches Reich<\/strong><\/td>\n<td style=\"text-align: left;\">Kaiser Wilhelm II. (sprunghaft, prestigeorientiert)<\/td>\n<td style=\"text-align: left;\">Reichskanzler Bethmann Hollweg (kalkuliertes Risiko, will Russland als Aggressor erscheinen lassen)<\/td>\n<td style=\"text-align: left;\">Generalstabschef Moltke (Präventivkrieg, Zeitplan des Schlieffen-Plans)<\/td>\n<td style=\"text-align: left;\">Staatssekretär Jagow (Lokalisierung)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Österreich-Ungarn<\/strong><\/td>\n<td style=\"text-align: left;\">Außenminister Berchtold<\/td>\n<td style=\"text-align: left;\">Generalstabschef Conrad (Kriegspartei seit Jahren)<\/td>\n<td style=\"text-align: left;\">Ungar. Ministerpräsident Tisza (Skeptiker)<\/td>\n<td style=\"text-align: left;\">–<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Russland<\/strong><\/td>\n<td style=\"text-align: left;\">Zar Nikolaus II. (zögernd, Willy-Nicky-Kanal)<\/td>\n<td style=\"text-align: left;\">Außenminister Sasonow (kein zweites 1908)<\/td>\n<td style=\"text-align: left;\">Generalstabschef Januschkewitsch (Mobilmachungslogik)<\/td>\n<td style=\"text-align: left;\">–<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Frankreich<\/strong><\/td>\n<td style=\"text-align: left;\">Präsident Poincaré (Bündnistreue, Revanchegedanke)<\/td>\n<td style=\"text-align: left;\">Ministerpräsident Viviani (Deeskalation)<\/td>\n<td style=\"text-align: left;\">Generalstabschef Joffre (Plan XVII)<\/td>\n<td style=\"text-align: left;\">–<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Großbritannien<\/strong><\/td>\n<td style=\"text-align: left;\">Außenminister Grey (Vermittler, aber moralisch an Frankreich gebunden)<\/td>\n<td style=\"text-align: left;\">Premier Asquith (gespaltenes Kabinett, Irlandkrise)<\/td>\n<td style=\"text-align: left;\">Marineminister Churchill (Flotte)<\/td>\n<td style=\"text-align: left;\">–<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Individuelle Dilemmata:<\/strong> Jede Rolle hat ein <em>eigenes Ziel<\/em>, eine <em>rote Linie<\/em> und ein <em>geheimes Wissen<\/em>. Dadurch entsteht Reibung innerhalb der Kabinette. Das ist historisch korrekt und didaktisch gewollt.<\/p>\n<h3>5.4 Rundenstruktur (Lagekarten M2)<\/h3>\n<h4>Runde 1 – „Die Antwort auf Sarajevo“ (5.–7. Juli 1914) · 7 min<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Kabinett<\/th>\n<th style=\"text-align: left;\">Dilemma / Entscheidungsoptionen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Dt. Reich<\/strong><\/td>\n<td style=\"text-align: left;\">Wien Unterstützung zusichern? <strong>A<\/strong> bedingungslos (Blankoscheck) · <strong>B<\/strong> nur für begrenzte Strafaktion · <strong>C<\/strong> zu Mäßigung und internationaler Untersuchung drängen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Ö-U<\/strong><\/td>\n<td style=\"text-align: left;\">Wie auf das Attentat reagieren? <strong>A<\/strong> sofortiger Militärschlag · <strong>B<\/strong> unannehmbares Ultimatum · <strong>C<\/strong> diplomatische Genugtuung / Untersuchung<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Russland<\/strong><\/td>\n<td style=\"text-align: left;\">Signal an Wien/Berlin? <strong>A<\/strong> klare Schutzzusage für Serbien · <strong>B<\/strong> Zurückhaltung, Serbien zur Mäßigung drängen · <strong>C<\/strong> abwarten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Frankreich<\/strong><\/td>\n<td style=\"text-align: left;\">Staatsbesuch in St. Petersburg (20.–23.7.): <strong>A<\/strong> Russland volle Rückendeckung zusichern · <strong>B<\/strong> Russland zur Vorsicht mahnen · <strong>C<\/strong> Besuch unpolitisch halten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>GB<\/strong><\/td>\n<td style=\"text-align: left;\">Priorität? <strong>A<\/strong> Irland-Krise (Home Rule) · <strong>B<\/strong> frühzeitige Warnung an Berlin · <strong>C<\/strong> Vermittlungsinitiative vorbereiten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Leitdilemma:<\/em> <strong>Bündnistreue vs. Eskalationsrisiko<\/strong> – die Frage, ob man seinem Partner einen „Blankoscheck“ ausstellt, stellt sich für Berlin <strong>und<\/strong> für Paris.<\/p>\n<h4>Runde 2 – „Das Ultimatum“ (23.–27. Juli 1914) · 6 min<\/h4>\n<p><em>Lage:<\/em> Ultimatum ist gestellt, Serbien antwortet weitgehend entgegenkommend, lehnt aber Punkt 6 ab und mobilisiert.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Kabinett<\/th>\n<th style=\"text-align: left;\">Dilemma / Entscheidungsoptionen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Dt. Reich<\/strong><\/td>\n<td style=\"text-align: left;\">Greys Konferenzvorschlag: <strong>A<\/strong> ablehnen (Lokalisierung) · <strong>B<\/strong> annehmen · <strong>C<\/strong> zum Schein annehmen, Wien intern ermutigen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Ö-U<\/strong><\/td>\n<td style=\"text-align: left;\">Serbische Antwort: <strong>A<\/strong> als ungenügend zurückweisen, Bruch · <strong>B<\/strong> als Verhandlungsbasis nehmen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Russland<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> „Periode der Kriegsvorbereitung“ einleiten · <strong>B<\/strong> nur diplomatischer Protest · <strong>C<\/strong> Teilmobilmachung ankündigen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Frankreich<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Russland Bündnisfall signalisieren · <strong>B<\/strong> Mäßigung in St. Petersburg · <strong>C<\/strong> Konferenzvorschlag unterstützen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>GB<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Botschafterkonferenz vorschlagen · <strong>B<\/strong> Flotte nicht demobilisieren (Churchill) · <strong>C<\/strong> Neutralität andeuten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Leitdilemma:<\/em> <strong>Gesichtswahrung vs. Kompromiss<\/strong> – kann man eine fast vollständige Annahme akzeptieren, ohne das Gesicht zu verlieren?<\/p>\n<h4>Runde 3 – „Mobilmachung“ (28.–30. Juli 1914) · 5 min<\/h4>\n<p><em>Lage:<\/em> Ö-U erklärt Serbien den Krieg, Belgrad wird beschossen. Wilhelm II. hält den Kriegsgrund für entfallen („Halt in Belgrad“).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Kabinett<\/th>\n<th style=\"text-align: left;\">Dilemma / Entscheidungsoptionen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Dt. Reich<\/strong><\/td>\n<td style=\"text-align: left;\"><em>Binnenkonflikt Kanzler vs. Generalstab:<\/em> <strong>A<\/strong> Wien ernsthaft zu „Halt in Belgrad“ zwingen · <strong>B<\/strong> Moltke folgen: Wien zur Generalmobilmachung drängen · <strong>C<\/strong> Neutralitätsangebot an GB<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Ö-U<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> „Halt in Belgrad“ annehmen · <strong>B<\/strong> Krieg gegen Serbien fortsetzen, Vermittlung ablehnen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Russland<\/strong><\/td>\n<td style=\"text-align: left;\"><em>Zar vs. Generalstab:<\/em> <strong>A<\/strong> Teilmobilmachung (gegen Ö-U) · <strong>B<\/strong> Generalmobilmachung (militärisch „einzig machbar“) · <strong>C<\/strong> Mobilmachung stoppen, Willy-Nicky-Kanal nutzen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Frankreich<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Truppen 10 km hinter die Grenze zurückziehen (GB beeindrucken) · <strong>B<\/strong> Mobilmachung vorbereiten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>GB<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Berlin deutlich warnen: keine Neutralität · <strong>B<\/strong> Frankreich Beistand zusagen · <strong>C<\/strong> weiter offenhalten<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Leitdilemma:<\/em> <strong>Diplomatische Zeit vs. militärischer Zeitplan<\/strong> – wer zuerst mobilisiert, gewinnt militärisch, verliert aber diplomatisch.<\/p>\n<h4>Runde 4 – „Der Automatismus“ (31. Juli – 4. August 1914) · 4 min<\/h4>\n<p><em>Lage:<\/em> Russland hat die Generalmobilmachung verkündet.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Kabinett<\/th>\n<th style=\"text-align: left;\">Dilemma / Entscheidungsoptionen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Dt. Reich<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Ultimatum an Russland → Kriegserklärung → Schlieffen-Plan (Belgien!) · <strong>B<\/strong> nur Ostaufmarsch (Moltke: „unmöglich“) · <strong>C<\/strong> abwarten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Ö-U<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Generalmobilmachung · <strong>B<\/strong> Schwerpunkt Serbien halten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Russland<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> deutsches Ultimatum ignorieren · <strong>B<\/strong> Mobilmachung einstellen<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Frankreich<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>A<\/strong> Mobilmachung · <strong>B<\/strong> Neutralität erklären (deutsche Forderung: Übergabe von Toul und Verdun als Pfand)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>GB<\/strong><\/td>\n<td style=\"text-align: left;\">Belgien überfallen? <strong>A<\/strong> Ultimatum an Berlin, Kriegseintritt · <strong>B<\/strong> Neutralität · <strong>C<\/strong> nur Seeschutz für Frankreich<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Leitdilemma:<\/em> <strong>Vertragstreue / Völkerrecht vs. militärische Notwendigkeit<\/strong> (belgische Neutralität, Bethmanns „Fetzen Papier“).<\/p>\n<h3>5.5 Eskalationsbarometer (Beamer / Tafel)<\/h3>\n<ul>\n<li>Skala <strong>0–10<\/strong>; jede Entscheidung erhält vorab festgelegte Punktwerte (in M2 hinterlegt), z. B. Blankoscheck +2, Generalmobilmachung +3, „Halt in Belgrad“ angenommen −2.<\/li>\n<li>Nach jeder Runde: <strong>Kurs der Klasse<\/strong> vs. <strong>historischer Kurs<\/strong> als zwei Linien auf dem Barometer → visueller Vergleich in Phase 3.<\/li>\n<\/ul>\n<hr>\n<h2>6. Phasenstruktur (90 min)<\/h2>\n<pre><code>┌─────────────────────────────────────────────────────────────────────────────┐\n│ 1. Einstieg &amp; Kabinettsbildung (12 min)                                     │\n│    • Bildimpuls: Festnahme nach dem Attentat, Sarajevo 28.6.1914            │\n│    • Zitatimpuls: Bismarck „… irgendeine verdammte Dummheit auf dem Balkan“ │\n│    • Reaktivierung HA „Pulverfass“ an der Bündniskarte (Putzger)            │\n│    • Leitfrage fixieren · Kabinette bilden · Rollenkarten still einlesen    │\n├─────────────────────────────────────────────────────────────────────────────┤\n│ 2. Erarbeitung: Entscheidungsspiel in 4 Runden (40 min)                     │\n│    • R1 5.–7. Juli (7 min) → Aufdeckung (3 min)                             │\n│    • R2 23.–27. Juli (6 min) → Aufdeckung (3 min)                           │\n│    • R3 28.–30. Juli (5 min) → Aufdeckung (3 min)                           │\n│    • R4 31. Juli – 4. Aug. (4 min) → Aufdeckung &amp; „Die Lichter gehen aus“   │\n│    • Puffer / Telegrammzustellung (6 min)                                   │\n├─────────────────────────────────────────────────────────────────────────────┤\n│ 3. Vertiefung: Dekonstruktion &amp; Kontroverse (25 min)                        │\n│    • Debriefing: Ausstieg aus der Rolle, Barometer-Vergleich (5 min)        │\n│    • Zehn Weggabelungen: War der Krieg vermeidbar? + Urteil (7 min)         │\n│    • Kontroversenanalyse: 4 Forschungspositionen, arbeitsteilig (8 min)     │\n│    • Positionslinie „hineingeschlittert ↔ entfesselt“ (5 min)               │\n├─────────────────────────────────────────────────────────────────────────────┤\n│ 4. Sicherung &amp; Diagnose (13 min)                                            │\n│    • Struktur-Tafelbild: Struktur – Auslöser – Entscheidungen – Deutung     │\n│    • Exit-Ticket · Hausaufgabe (Erörterung)                                 │\n└─────────────────────────────────────────────────────────────────────────────┘\n<\/code><\/pre>\n<hr>\n<h2>7. Tabellarischer Verlaufsplan (Entwurf)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Phase / Zeit<\/th>\n<th style=\"text-align: left;\">Unterrichtsschritte &amp; Handlungsmuster<\/th>\n<th style=\"text-align: left;\">Sozialform / Medien<\/th>\n<th style=\"text-align: left;\">Didaktisch-methodischer Kommentar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Einstieg<\/strong><br>(12 min)<\/td>\n<td style=\"text-align: left;\">• <strong>Stummer Bildimpuls:<\/strong> Foto der Festnahme in Sarajevo. SuS <strong>beschreiben<\/strong> und ordnen ein.<br>• <strong>Zitatimpuls<\/strong> Bismarck (Balkan) → Frage: „Wie kann ein Attentat einen Weltkrieg auslösen?“<br>• <strong>Reaktivierung:<\/strong> HA-Ergebnisse an der Bündniskarte (Putzger/Beamer), Blitzlicht zu den strukturellen Faktoren.<br>• <strong>Leitfrage<\/strong> wird fixiert.<br>• Kabinettsbildung, Rollenkarten (M1) 2 min still einlesen.<\/td>\n<td style=\"text-align: left;\">Plenum → Kabinette<br>Beamer, Putzger, M1<\/td>\n<td style=\"text-align: left;\">Problemorientierter Einstieg; Rückbindung an HA sichert, dass alle die Rahmenbedingungen kennen. Stilles Einlesen schafft Rollenidentifikation.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Erarbeitung: Runde 1<\/strong><br>(10 min)<\/td>\n<td style=\"text-align: left;\">• Lagemeldung 5.–7. Juli (M2.1).<br>• Kabinettsberatung <strong>7 min<\/strong> (Timer), Entscheidung + Telegramm, Protokoll (M3).<br>• Aufdeckung: Sprecher verlesen, Barometer, Enthüllung der historischen Entscheidung (Blankoscheck).<\/td>\n<td style=\"text-align: left;\">Kabinetts-GA<br>M2.1, M3, M4 (Telegramme), Beamer<\/td>\n<td style=\"text-align: left;\">Parallelität Berlin/Paris sichtbar machen: Beide Bündnisse stellen „Blankoschecks“ aus.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Runde 2<\/strong><br>(9 min)<\/td>\n<td style=\"text-align: left;\">• Lagemeldung Ultimatum &amp; serbische Antwort (M2.2), Zustellung der Telegramme aus R1.<br>• Beratung <strong>6 min<\/strong>, Aufdeckung.<\/td>\n<td style=\"text-align: left;\">Kabinetts-GA<\/td>\n<td style=\"text-align: left;\">Verzögerte Telegramme erzeugen Missverständnisse → Kommunikationsproblem erfahrbar.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Runde 3<\/strong><br>(8 min)<\/td>\n<td style=\"text-align: left;\">• Lagemeldung Kriegserklärung an Serbien / „Halt in Belgrad“ (M2.3).<br>• Beratung <strong>5 min<\/strong>; Binnenkonflikte (Kanzler vs. Generalstab; Zar vs. Generalstab) ausspielen.<br>• Aufdeckung.<\/td>\n<td style=\"text-align: left;\">Kabinetts-GA<\/td>\n<td style=\"text-align: left;\">Höhepunkt der Spielphase: Militärische Logik und Diplomatie kollidieren innerhalb der Kabinette.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Runde 4<\/strong><br>(13 min inkl. Puffer)<\/td>\n<td style=\"text-align: left;\">• Lagemeldung Generalmobilmachung Russlands (M2.4).<br>• Beratung <strong>4 min<\/strong>; Aufdeckung.<br>• Abschluss: Kriegserklärungen werden verlesen; Grey-Zitat „The lamps are going out all over Europe …“<\/td>\n<td style=\"text-align: left;\">Kabinetts-GA → Plenum<\/td>\n<td style=\"text-align: left;\">Emotionale Verdichtung; Erleben des Automatismus. Puffer für Überziehungen.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vertiefung: Debriefing<\/strong><br>(5 min)<\/td>\n<td style=\"text-align: left;\">• <strong>Ausstieg aus der Rolle<\/strong> (Namensschilder umdrehen).<br>• Barometer-Vergleich: Wo sind wir vom historischen Kurs abgewichen – und warum?<br>• Beobachter berichtet (falls besetzt).<\/td>\n<td style=\"text-align: left;\">Plenum<br>Beamer (Barometer)<\/td>\n<td style=\"text-align: left;\">Distanzierung ist Pflicht, bevor geurteilt wird. Abweichungen zeigen Handlungsspielräume.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Zehn Weggabelungen<\/strong><br>(7 min)<\/td>\n<td style=\"text-align: left;\">• Beamer-Phase „Weggabelungen“: zehn historische Auswege (Datum, Akteur, Ausweg, „Warum nicht?“), markiert, welche die Klasse im Spiel genutzt hat (1914: 0).<br>• Schüler-App/M8: jeden Ausweg bewerten („kaum möglich“ … „gut möglich“).<br>• <strong>Beurteilen Sie<\/strong>, an welcher Weggabelung der Krieg am ehesten hätte verhindert werden können – und warum sie nicht genutzt wurde.<br>• Fazit-Zitate: Hellfeld (S. 250), Münkler, Clark (S. 800).<\/td>\n<td style=\"text-align: left;\">Plenum / Kabinett am PC<br>Beamer, Schüler-App oder M8<\/td>\n<td style=\"text-align: left;\"><strong>Kernerkenntnis der Stunde:<\/strong> Der Krieg war vermeidbar. Die Spalte „Warum nicht?“ verhindert das naive „Die hätten doch einfach …“.<\/td>\n<\/tr>\n<tr>\n<td style=
