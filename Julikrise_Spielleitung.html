\"text-align: left;\"><strong>Kontroversenanalyse<\/strong><br>(8 min)<\/td>\n<td style=\"text-align: left;\">• Arbeitsteilig in gemischten Gruppen (Expertenprinzip): je eine Forschungsposition (M5).<br>• <strong>Arbeiten Sie<\/strong> die Kernthese und die zentralen Belege <strong>heraus<\/strong>.<br>• <strong>Überprüfen Sie<\/strong>, welche Spielerfahrungen diese These stützen oder widerlegen.<\/td>\n<td style=\"text-align: left;\">GA (neu gemischt)<br>M5, Tippkarten M7<\/td>\n<td style=\"text-align: left;\">LK-Kern: Kontroversität als Methode; die Simulation wird selbst zur prüfbaren „Quelle“.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Positionslinie &amp; Urteil<\/strong><br>(5 min)<\/td>\n<td style=\"text-align: left;\">• Raumlinie von „hineingeschlittert“ (Lloyd George / Clark) bis „bewusst entfesselt“ (Fischer).<br>• SuS positionieren sich und begründen mit Spiel <strong>und<\/strong> Forschung.<br>• Impuls Metakognition: „Welche Informationen hatten wir, die die Akteure nicht hatten?“<\/td>\n<td style=\"text-align: left;\">Plenum / Bewegung im Raum<\/td>\n<td style=\"text-align: left;\">Sachurteil wird öffentlich und begründungspflichtig; Schutz vor Rückschaufehler.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sicherung<\/strong><br>(8 min)<\/td>\n<td style=\"text-align: left;\">• Struktur-Tafelbild (Kap. 8) gemeinsam vervollständigen.<\/td>\n<td style=\"text-align: left;\">Plenum / Tafel<\/td>\n<td style=\"text-align: left;\">Kognitive Ordnung: Struktur – Auslöser – Entscheidung – Deutung.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Diagnose &amp; Ausblick<\/strong><br>(5 min)<\/td>\n<td style=\"text-align: left;\">• <strong>Exit-Ticket<\/strong> (M8).<br>• HA: Erörterung (Kap. 9). Ausblick: Kriegsziele / Septemberprogramm 1914.<\/td>\n<td style=\"text-align: left;\">EA<br>M8<\/td>\n<td style=\"text-align: left;\">Formative Rückmeldung; Anschluss an Folgestunde.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr>\n<h2>8. Struktur-Tafelbild (Entwurf)<\/h2>\n<pre><code>             HINEINGESCHLITTERT ODER BEWUSST ENTFESSELT? – DER WEG IN DEN ERSTEN WELTKRIEG\n             ═══════════════════════════════════════════════════════════════════════════════\n\n  LANGFRISTIGE STRUKTUREN            AUSLÖSER               ENTSCHEIDUNGSKASKADE (JULIKRISE)\n ┌───────────────────────────┐   ┌──────────────────┐   ┌─────────────────────────────────────────┐\n │ • Imperialismus/Weltpolitik│   │ Attentat von     │   │ 5./6.7. Blankoscheck (Berlin → Wien)    │\n │ • Bündnissysteme (Blöcke) │──►│ Sarajevo         │──►│ 23.7.   Ultimatum an Serbien            │\n │ • Wettrüsten/Militarismus │   │ 28.6.1914        │   │ 25.7.   Russ. Kriegsvorbereitung        │\n │ • Nationalismus/Panslaw.  │   └──────────────────┘   │ 28.7.   Kriegserklärung an Serbien      │\n │ • Balkankrisen 1908–1913  │                          │ 30.7.   Russ. Generalmobilmachung       │\n │ • Schlieffen-Plan         │                          │ 1.–4.8. Kriegserklärungen, Belgien, GB  │\n └───────────────────────────┘                          └──────────────────┬──────────────────────┘\n          VERENGEN den Handlungsspielraum ◄────────────────────────────────┤\n                                                                           ▼\n ════════════════════════════════════════════════════════════════════════════════════════════════\n                     DEUTUNGEN: WIE VERHALTEN SICH STRUKTUR UND ENTSCHEIDUNG?\n  „hineingeschlittert“          „Schlafwandler“          „kalkuliertes Risiko“        „Griff nach der\n   (Lloyd George)                (Clark 2012)             (Krumeich, Mombauer)         Weltmacht“ (Fischer 1961)\n  ◄──────── geteilte Verantwortung ─────────────────────────── Hauptverantwortung Berlin/Wien ────────►\n\n  URTEILSKRITERIEN: Initiative · Handlungsalternativen · Risikobereitschaft · Kenntnis der Folgen\n\n  DER KRIEG WAR NICHT ZWANGSLÄUFIG – 10 UNGENUTZTE AUSWEGE\n  Belgrad (Juli) · Berlin 5./6.7. · Wien 13.7. · London (Juli) · St. Petersburg 20.–23.7. · Wien 25.7.\n  Berlin 26./27.7. · Wien/Berlin 28./29.7. („Halt in Belgrad“) · St. Petersburg 29./30.7. · Berlin 1.8.\n  Warum ungenutzt? Bündnisangst · Prestige · militärische Zeitpläne · Präventivkriegsdenken · Misstrauen\n<\/code><\/pre>\n<hr>\n<h2>9. Aufgaben &amp; Urteilsbildung (Operatoren nach Cornelsen)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Nr.<\/th>\n<th style=\"text-align: left;\">Aufgabe<\/th>\n<th style=\"text-align: left;\">AFB<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\"><strong>Stellen Sie<\/strong> die Entscheidungskaskade der Julikrise vom 28. Juni bis 4. August 1914 <strong>dar<\/strong>.<\/td>\n<td style=\"text-align: left;\">I<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\"><strong>Analysieren Sie<\/strong> die Handlungsspielräume und Zwänge zweier Großmächte in der Julikrise.<\/td>\n<td style=\"text-align: left;\">II<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\"><strong>Vergleichen Sie<\/strong> die Positionen Fischers und Clarks hinsichtlich der Kriterien Initiative, Handlungsalternativen und Verantwortung.<\/td>\n<td style=\"text-align: left;\">II<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\"><strong>Beurteilen Sie<\/strong>, inwieweit der Kriegsausbruch 1914 eher auf strukturelle Zwänge oder auf bewusste Entscheidungen zurückzuführen ist.<\/td>\n<td style=\"text-align: left;\">III (Sachurteil)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">5<\/td>\n<td style=\"text-align: left;\"><strong>Nehmen Sie Stellung<\/strong> zu der Frage, ob „Kriegsschuld“ eine angemessene Kategorie historischer Urteilsbildung ist.<\/td>\n<td style=\"text-align: left;\">III (Werturteil)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Hausaufgabe (Abiturvorbereitung):<\/strong> <strong>Erörtern Sie<\/strong> die These, die europäischen Mächte seien 1914 „wie Schlafwandler“ in den Krieg gegangen (ca. 1,5 Seiten). → Anschluss an <a href=\"file:///Users/michelabicht/Library/Mobile%20Documents/com~apple~CloudDocs/Workspace_Claude/Geschichte/Leistungkurs%2012/Abituraufgaben_LK12_Weltkriege.md\">Abituraufgaben_LK12_Weltkriege.md<\/a><\/p>\n<hr>\n<h2>10. Binnendifferenzierung (3-Stufen-Modell)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Stufe<\/th>\n<th style=\"text-align: left;\">Maßnahme<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Basis (Scaffolding)<\/strong><\/td>\n<td style=\"text-align: left;\">Rollenkarten mit vorformulierten Optionen und markierter roter Linie; „Kabinettsvorsitz“ strukturiert die Beratung (Gesprächsleitfaden); Tippkarten zur Kontroversenanalyse (Tipp 1: Leitfrage an den Text, Tipp 2: Schlüsselbegriff markieren, Tipp 3: Tabellenraster); Satzstarter Sach-/Werturteil.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Standard<\/strong><\/td>\n<td style=\"text-align: left;\">Spiel und Kontroversenanalyse nach Standard-Operatoren.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Enrichment<\/strong><\/td>\n<td style=\"text-align: left;\">Rolle <strong>Historiker-Beobachter<\/strong> (dokumentiert Dynamik und Wendepunkte, berichtet im Debriefing); <strong>Challenge-Karte:<\/strong> Überprüfen Sie Clarks These an der serbischen Perspektive (Schwarze Hand, Pašić) und an der russischen Generalmobilmachung; Transfer: Parallelen zu Bündnisautomatismen heute (NATO Art. 5).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr>\n<h2>11. Formative Diagnose<\/h2>\n<p><strong>Exit-Ticket (M7, 4 min):<\/strong>\n* <strong>3<\/strong> Faktoren, die den Handlungsspielraum 1914 verengten\n* <strong>2<\/strong> Unterschiede zwischen Fischer und Clark\n* <strong>1<\/strong> Weggabelung, an der der Krieg am ehesten vermeidbar war – <strong>beurteilen Sie<\/strong> sie in zwei Sätzen (Operator-Check).<\/p>\n<p><strong>Kompetenzampel<\/strong> zum <code>koennen<\/code>-Raster vor der nächsten Klausur.<\/p>\n<hr>\n<h2>12. Risiken &amp; Gegenstrategien (Spielleitung)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Risiko<\/th>\n<th style=\"text-align: left;\">Gegenstrategie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>„Gewinnen-wollen“-Modus<\/strong> (Spiel als Strategiespiel)<\/td>\n<td style=\"text-align: left;\">Vorab klarstellen: Ziel ist nicht Sieg, sondern plausible Entscheidung <em>aus der Zeit heraus<\/em>. Protokoll verlangt Begründung aus Rollenlogik.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Präsentismus / Pazifismus-Reflex<\/strong> (alle wählen sofort Frieden)<\/td>\n<td style=\"text-align: left;\">Rote Linien und Binnenkonflikte in Rollenkarten bewusst hart formulieren; in Aufdeckung fragen: „Hätte Ihr Kaiser/Parlament/Ihre Presse das akzeptiert?“<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Entlastungsnarrativ<\/strong> („Alle waren schuld, also niemand“)<\/td>\n<td style=\"text-align: left;\">In Phase 3 Clark ausdrücklich mit Krumeich/Mombauer kontrastieren; Kriterium „Initiative“ einfordern.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Schuldnarrativ<\/strong> („Deutschland allein“)<\/td>\n<td style=\"text-align: left;\">Russische Generalmobilmachung, französische Rückendeckung, serbische Verflechtung sichtbar machen.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Dominanz Einzelner<\/strong><\/td>\n<td style=\"text-align: left;\">Rollen mit klar definiertem Rederecht; Sprecher wechselt jede Runde.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Zeitüberziehung<\/strong><\/td>\n<td style=\"text-align: left;\">Timer strikt; 6 min Puffer in Phase 2; bei Engpass entfällt Aufdeckungsdiskussion in R2 (nur Barometer).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Emotionale Überwältigung / Klamauk<\/strong><\/td>\n<td style=\"text-align: left;\">Ernsthaftigkeit durch Rahmung (Opferzahlen am Ende, Grey-Zitat); klarer Rollenausstieg im Debriefing.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Starke Abweichung vom historischen Verlauf<\/strong><\/td>\n<td style=\"text-align: left;\">Historische Schiene: Lage wird trotzdem historisch fortgeschrieben; Abweichung im Protokoll → Material für die Frage nach Handlungsalternativen.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr>\n<h2>13. Materialplan (zu erstellen nach Freigabe)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Nr.<\/th>\n<th style=\"text-align: left;\">Material<\/th>\n<th style=\"text-align: left;\">Format<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>M0<\/strong><\/td>\n<td style=\"text-align: left;\">HA-Dossier „Pulverfass Europa 1871–1914“ inkl. Bündniskarte<\/td>\n<td style=\"text-align: left;\">noch zu erstellen · Druck + LernSax<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M1<\/strong><\/td>\n<td style=\"text-align: left;\">Rollenkarten (6 Kabinette, 15 Rollen, Anzahl nach Kursgröße) mit Haltung, Ziel, roter Linie, Geheimwissen<\/td>\n<td style=\"text-align: left;\">Druck A4, geschnitten<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M2<\/strong><\/td>\n<td style=\"text-align: left;\">Lagekarten (4 Runden × 6 Kabinette) – Papiervariante zur Schüler-App<\/td>\n<td style=\"text-align: left;\">Druck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M3<\/strong><\/td>\n<td style=\"text-align: left;\">Kabinettsprotokoll – Papiervariante zur Schüler-App<\/td>\n<td style=\"text-align: left;\">Druck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M4<\/strong><\/td>\n<td style=\"text-align: left;\">Telegrammformulare<\/td>\n<td style=\"text-align: left;\">Druck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M5<\/strong><\/td>\n<td style=\"text-align: left;\">Vier Forschungspositionen mit Expertenaufgaben<\/td>\n<td style=\"text-align: left;\">Druck + Schüler-App<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M6<\/strong><\/td>\n<td style=\"text-align: left;\">Tippkarten, Satzstarter, Challenge (Faktencheck Hellfeld)<\/td>\n<td style=\"text-align: left;\">Druck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M7<\/strong><\/td>\n<td style=\"text-align: left;\">Exit-Ticket<\/td>\n<td style=\"text-align: left;\">Druck + Schüler-App<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>M8<\/strong><\/td>\n<td style=\"text-align: left;\">Arbeitsblatt „Zehn Weggabelungen“<\/td>\n<td style=\"text-align: left;\">Druck + Schüler-App<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>L<\/strong><\/td>\n<td style=\"text-align: left;\">Lehrerblatt: Faktencheck Hellfeld, Punktetabelle<\/td>\n<td style=\"text-align: left;\">Druck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>P<\/strong><\/td>\n<td style=\"text-align: left;\">Beamer-Spielleitung (Lagemeldungen mit Freischaltcode, Timer, Beschlusserfassung, Eskalationsbarometer, Aufdeckung mit Weggabelungen, Debriefing, Weggabelungen, Kontroverse, Tafelbild)<\/td>\n<td style=\"text-align: left;\">HTML (Beamer)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>S<\/strong><\/td>\n<td style=\"text-align: left;\">Schüler-App (ein PC pro Kabinett)<\/td>\n<td style=\"text-align: left;\">HTML<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr>\n<h2>14. Checkliste (Didaktischer Leitfaden &amp; Entwicklungsplan)<\/h2>\n<ul>\n<li>[x] <strong>Leitfrage:<\/strong> problemorientiert, kontrovers („Hineingeschlittert oder bewusst entfesselt?“)<\/li>\n<li>[x] <strong>Phasenstruktur:<\/strong> 12 / 40 / 25 / 13 min im 90-Minuten-Schema<\/li>\n<li>[x] <strong>Operatoren:<\/strong> Cornelsen, fett, AFB I–III<\/li>\n<li>[x] <strong>AFB III:<\/strong> Sachurteil (Struktur vs. Entscheidung) und Werturteil (Kategorie Kriegsschuld) getrennt<\/li>\n<li>[x] <strong>Quellenpassung:<\/strong> Aktenstücke der Julikrise + historiographische Darstellungen + Karte<\/li>\n<li>[x] <strong><code>darum<\/code> / <code>koennen<\/code> / <code>begriffe<\/code>:<\/strong> im <code>BASE_PLAN<\/code>-Datensatz hinterlegt<\/li>\n<li>[x] <strong>Didaktische Begründung:<\/strong> Kap. 4.4 und <code>begruendung<\/code><\/li>\n<li>[x] <strong>Binnendifferenzierung:<\/strong> Scaffolding, Standard, Enrichment (Kap. 10)<\/li>\n<li>[x] <strong>Formative Diagnose:<\/strong> Exit-Ticket mit Operator-Check<\/li>\n<li>[x] <strong>Dilemma &amp; Handlungsorientierung:<\/strong> Kabinettsspiel mit Wertekonflikten je Macht<\/li>\n<li>[x] <strong>Metakognition:<\/strong> Rückschaufehler, Simulation als Konstrukt, Rezeption der Kontroverse<\/li>\n<li>[ ] <strong>Offene Entscheidungen der Lehrkraft:<\/strong> siehe Kap. 15<\/li>\n<\/ul>\n<hr>\n<h2>15. Planungsentscheidungen (festgelegt am 27.09.2026)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Frage<\/th>\n<th style=\"text-align: left;\">Entscheidung<\/th>\n<th style=\"text-align: left;\">Umsetzung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Kursgröße<\/td>\n<td style=\"text-align: left;\">variabel, 10–15 SuS<\/td>\n<td style=\"text-align: left;\">Rollen nach Priorität besetzt (Leitrollen 1–6 immer). Unbesetzte Rollen stehen als „weitere Stimmen“ auf der Karte der Leitrolle. Regler in Beamer- und Druckdatei.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Serbien<\/td>\n<td style=\"text-align: left;\">eigene Gruppe<\/td>\n<td style=\"text-align: left;\">6 Kabinette: DR, Ö-U, RU, FR, GB, SRB (Pašić, Dimitrijević „Apis“)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Medium<\/td>\n<td style=\"text-align: left;\">HTML mit Timer<\/td>\n<td style=\"text-align: left;\"><code>Julikrise_Spielleitung_Beamer.html<\/code> (Timer 7/6/5/4 min, Erfassung der Beschlüsse, Eskalationsbarometer, Aufdeckung, Debriefing-Diagramm, Weggabelungen, Positionslinie, Tafelbild)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Bismarck'sche Bündnispolitik<\/td>\n<td style=\"text-align: left;\">bereits behandelt<\/td>\n<td style=\"text-align: left;\">M0 bleibt kurz (Hausaufgabe)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Forschungspositionen<\/td>\n<td style=\"text-align: left;\">4, als Abschluss<\/td>\n<td style=\"text-align: left;\">Lloyd George, Clark, Krumeich/Mombauer, Fischer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>15.1 Dateien<\/h3>\n<p><strong>Für den Unterricht gibt es genau zwei Dateien<\/strong> (im Spielordner):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Datei<\/th>\n<th style=\"text-align: left;\">Inhalt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><code>Julikrise_Spielleitung.html<\/code><\/td>\n<td style=\"text-align: left;\">Beamer-Spielleitung (Pfeiltasten = Phase, Leertaste = Timer, „Punkte“ = Eskalationswerte). Über den Knopf <strong>„Lehrermaterial“<\/strong> in der Kopfleiste: <strong>Planungsleitfaden<\/strong> und <strong>Druckmaterial<\/strong> (M1–M8, Lehrerblatt) mit eigener Druckfunktion. Der Lehrerbereich liegt außerhalb der Spielnavigation – nicht am Beamer öffnen, er enthält Codes und Lösungen.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>Julikrise_Schueler.html<\/code><\/td>\n<td style=\"text-align: left;\">Schüler-App, ein PC pro Kabinett, offline lauffähig, ohne Lösungen<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Beide Dateien sind eigenständig (Daten und Schullogo eingebettet).<\/p>\n<p><strong>Quelldateien für Änderungen<\/strong> (Ordner <code>_Quellen<\/code>):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Datei<\/th>\n<th style=\"text-align: left;\">Zweck<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><code>julikrise_daten.js<\/code><\/td>\n<td style=\"text-align: left;\">alle Inhalte: Rollen, Runden, Optionen, Auflösung, Weggabelungen, Positionen, Codes, Faktencheck<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>Julikrise_Spielleitung_Beamer.html<\/code><\/td>\n<td style=\"text-align: left;\">Gestaltung und Logik der Spielleitung<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>Julikrise_Druckmaterial.html<\/code><\/td>\n<td style=\"text-align: left;\">Gestaltung des Druckmaterials<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>schueler_vorlage.html<\/code><\/td>\n<td style=\"text-align: left;\">Gestaltung und Logik der Schüler-App<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>00_Planungsleitfaden_Julikrise_Entscheidungsspiel.md<\/code><\/td>\n<td style=\"text-align: left;\">dieser Leitfaden<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><code>export_html.py<\/code>, <code>build_schueler.py<\/code><\/td>\n<td style=\"text-align: left;\">erzeugen die beiden fertigen Dateien<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Nach jeder Änderung: im Ordner <code>_Quellen<\/code> <code>python3 export_html.py<\/code> ausführen (einmalig vorher: <code>pip3 install markdown<\/code>).<\/p>\n<h3>15.1a Schülerversion (digital, ohne Verbindung)<\/h3>\n<p><strong>Organisation:<\/strong> Rollenkarten werden gedruckt (M1, Anzahl im Druckmaterial einstellen). Jedes Kabinett sitzt gemeinsam vor <strong>einem PC<\/strong> mit der Schüler-App.<\/p>\n<p><strong>Ablauf für die Schüler:<\/strong>\n1. Kabinett wählen und ankreuzen, wer heute am Tisch sitzt. Die Leitrolle ist immer besetzt.\n2. Jede Runde mit dem Code vom Beamer freischalten.\n3. Posteingang ausfüllen, dann den Beschluss festhalten: Sprecher/in (wechselt jede Runde), Option, Begründung (Pflicht), Risiko, Informationslücke. Gegenstimmen tippt man aus den anwesenden Rollen an.\n4. „Beschluss verkünden“ zeigt die Option im Vollbild.\n5. Telegramm verfassen (max. 25 Wörter). Der Bote zeigt es zu Beginn der nächsten Runde beim Empfänger am Bildschirm oder auf M4.\n6. Nach der Aufdeckung die Option von 1914 antippen und die Abweichung erklären.\n7. Abschluss (Code): Expertengruppe, Positionslinie, Sachurteil, Exit-Ticket.\n8. Protokoll als Textdatei speichern (LernSax) oder kopieren.<\/p>\n<p><strong>Freischaltcodes<\/strong> (am Beamer eingeblendet): Runde 1 <code>POTSDAM<\/code> · Runde 2 <code>KRONRAT<\/code> · Runde 3 <code>NISCH<\/code> · Runde 4 <code>LÜTTICH<\/code> · Abschluss <code>RIEZLER<\/code>. Groß- und Kleinschreibung sowie ü/ue spielen keine Rolle.<\/p>\n<p><strong>Datenschutz:<\/strong> Alle Eingaben bleiben im Browser des Geräts (localStorage). Nichts wird übertragen. „Alle Eingaben löschen“ im Protokoll setzt das Gerät für die nächste Gruppe zurück. Die Schülerdatei enthält keine historische Auflösung, keine Eskalationspunkte und die Codes nur als Prüfsummen.<\/p>\n<p><strong>Hinweis iPad:<\/strong> Eine lokale HTML-Datei aus der Dateien-App führt oft kein JavaScript aus. Die Datei deshalb über einen Link im Browser öffnen (z. B. ein freigegebener Artifact-Link oder eine Webablage) oder Laptops nutzen.<\/p>\n<h3>15.2 Inhaltliche Grundlage und Faktencheck<\/h3>\n<p>Grundlage sind Hellfeld, Kap. 11 „Der Weg in den Krieg“ (S. 245–259), und Clark, <em>Die Schlafwandler<\/em>, Schluss (S. 791–801). Im Hellfeld-Text wurden 14 Sachfehler bzw. Ungenauigkeiten gefunden und im Spiel korrigiert, u. a.:\n- Serbien nahm das Ultimatum <strong>nicht<\/strong> „in allen Punkten“ an (S. 257): Die Antwort kam am 25.7. und lehnte Punkt 6 ab.\n- Das Ultimatum hatte zehn Punkte, nicht „sechs Forderungen“ (S. 254).\n- Das Pfand für die französische Neutralität sollten Toul und Verdun sein, nicht „Verdun und Belfort“ (S. 258).\n- Wilhelm <strong>II.<\/strong>, nicht „Wilhelm I.“ (S. 246); Staatsbesuch in St. Petersburg, nicht „Moskau“ (S. 254).<\/p>\n<p>Die vollständige Liste steht im Lehrerblatt der Druckdatei. Der Fehler zur serbischen Antwort wird als Challenge-Aufgabe (M6) genutzt.<\/p>\n<h3>15.3 Noch zu prüfen<\/h3>\n<ul>\n<li>Die Zitate von Lloyd George und die Paraphrase Krumeich/Mombauer sind in M5 rot als „ungeprüft“ markiert. Vor dem Druck mit den Originalen abgleichen.<\/li>\n<li>Die Clark-Zitate stammen wörtlich aus dem vorliegenden PDF (S. 798–801). Das Fischer-Referat stützt sich auf Clarks Zusammenfassung (S. 798).<\/li>\n<\/ul>\n<\/main><\/body><\/html>", "druck": "<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Julikrise Druckmaterial<\/title>\n<style>\n:root{--ink:#111;--ink-2:#444;--rule:#999;--soft:#EEF0EC;--seal:#8E2A22;--paper:#fff;--desk:#DADFD8;color-scheme:light}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--desk);color:var(--ink);font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif;font-size:11pt;line-height:1.3}\nh1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}\np{margin:0}\nb.op{font-weight:700}\n\n/* Bedienleiste (nur Bildschirm) */\n.controls{position:sticky;top:0;z-index:5;background:#1A2126;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;font-family:system-ui,sans-serif;font-size:14px}\n.controls label{display:flex;gap:8px;align-items:center}\n.controls input[type=number]{width:64px;font:inherit;padding:2px 6px}\n.controls .hint{opacity:.75}\n.toc{display:flex;flex-wrap:wrap;gap:6px}\n.toc label{background:#2C363D;padding:3px 8px;border-radius:3px;line-height:1.3}\n\n/* Seiten */\n.sheet{width:210mm;min-height:297mm;margin:16px auto;background:var(--paper);padding:25mm 25mm 20mm 25mm;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:6mm;max-width:100%}\n.sheet.half{gap:0}\n.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1.5pt solid var(--ink);padding-bottom:2mm}\n.mhead .m{font-weight:700;font-size:10pt;letter-spacing:.06em;text-transform:uppercase;color:var(--seal)}\n.mhead h2{font-size:15pt}\n.mhead .src{font-size:8.5pt;color:var(--ink-2);text-align:right}\n.namehead{font-size:10pt;line-height:1.6;display:flex;justify-content:space-between;gap:12px}\n.namehead img{height:16mm;width:auto}\n\n/* Karten auf halber Seite */\n.halfcard{height:calc((297mm - 45mm)/2 - 4mm);border:1pt solid var(--ink);padding:5mm 6mm;display:flex;flex-direction:column;gap:2.4mm;overflow:hidden;position:relative}\n.halfcard + .halfcard{margin-top:8mm}\n.halfcard::after{content:\"✂\";position:absolute;top:-6.2mm;left:-2mm;font-size:9pt;color:var(--rule)}\n.halfcard:first-child::after{display:none}\n.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:.75pt solid var(--ink);padding-bottom:1.5mm}\n.chead .kab{font-size:9pt;text-transform:uppercase;letter-spacing:.08em;font-weight:700}\n.chead h3{font-size:14pt}\n.chead .amt{font-size:9.5pt;color:var(--ink-2)}\n.f{font-size:10pt}\n.f .l{font-weight:700;font-size:8.5pt;text-transform:uppercase;letter-spacing:.06em;display:block;color:var(--ink-2)}\n.f.secret{background:var(--soft);padding:2mm 3mm;border-left:2pt solid var(--seal)}\n.voices{font-size:9pt;border-top:.5pt dashed var(--rule);padding-top:1.5mm}\n.voices li{margin-bottom:1mm}\n.voices ul{margin:1mm 0 0;padding-left:4mm}\n.opt{display:grid;grid-template-columns:6mm 7mm 1fr;gap:2mm;font-size:10pt;align-items:start}\n.opt .box{width:4.2mm;height:4.2mm;border:.8pt solid var(--ink);margin-top:.6mm}\n.opt b{font-size:11pt}\n.dil{font-style:italic;font-size:10.5pt}\n.lines{flex:1;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 7.4mm,var(--rule) 7.4mm,var(--rule) 7.6mm);min-height:10mm}\n\n/* Protokoll */\ntable.prot{width:100%;border-collapse:collapse;font-size:9.5pt;table-layout:fixed}\ntable.prot th,table.prot td{border:.75pt solid var(--ink);padding:1.5mm 2mm;vertical-align:top;text-align:left}\ntable.prot th{background:var(--soft);font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em}\ntable.prot td{height:44mm}\ntable.prot td.r{font-weight:700;font-size:10pt}\n\n/* Telegramm */\n.tg{border:1pt solid var(--ink);padding:4mm 5mm;height:calc((297mm - 45mm)/2 - 4mm);display:flex;flex-direction:column;gap:2.5mm;font-family:\"Courier New\",Courier,monospace;font-size:10pt}\n.tg + .tg{margin-top:8mm}\n.tg .t{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.12em;border-bottom:1pt dashed var(--ink);padding-bottom:2mm}\n.tg .fld{display:grid;grid-template-columns:28mm 1fr;gap:2mm;align-items:end}\n.tg .fld span:last-child{border-bottom:.6pt solid var(--ink);height:6mm}\n.tg .note{font-family:Calibri,Carlito,Arial,sans-serif;font-size:8.5pt;color:var(--ink-2)}\n\n/* Positionen */\n.pos .kurz{font-size:16pt;font-weight:700}\n.pos blockquote{margin:0;font-style:italic;border-left:2pt solid var(--ink);padding-left:3mm;font-size:10pt}\n.pos .beleg{font-size:8.5pt;color:var(--ink-2)}\n.pos .beleg.u{color:var(--seal)}\nol.tasks{margin:0;padding-left:5mm;display:flex;flex-direction:column;gap:1.5mm;font-size:10.5pt}\n.afb{font-size:8.5pt;color:var(--ink-2)}\n\n/* Tabellen Lehrer */\ntable.fc{width:100%;border-collapse:collapse;font-size:9pt}\ntable.fc th,table.fc td{border:.5pt solid var(--rule);padding:1.5mm 2mm;vertical-align:top;text-align:left}\ntable.fc th{background:var(--soft)}\n.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6mm;flex:1}\n.ticket{border:1pt dashed var(--ink);padding:4mm;display:flex;flex-direction:column;gap:2mm;font-size:9.5pt}\n.ticket .lines{min-height:8mm}\ntable.wgt td{font-size:8.8pt;height:22mm}\ntable.wgt th.rh{font-size:7pt;writing-mode:vertical-rl;transform:rotate(180deg);height:22mm;text-align:left;vertical-align:bottom;padding:1mm}\ntable.wgt td.rb{text-align:center;vertical-align:middle}\ntable.wgt td.rb span{display:inline-block;width:4mm;height:4mm;border:.8pt solid var(--ink)}\n\n@page{size:A4;margin:0}\n@media print{\n  body{background:#fff}\n  .controls{display:none}\n  .sheet{margin:0;box-shadow:none;break-after:page;width:210mm;height:297mm;min-height:0;overflow:hidden}\n  .sheet:last-child{break-after:auto}\n  [data-part].off{display:none}\n}\n@media screen{ [data-part].off{display:none} }\n@media (max-width:800px){ .sheet{padding:16px;min-height:0} .halfcard,.tg{height:auto} }\n<\/style>\n<\/head>\n<body>\n<div class=\"controls\">\n  <label for=\"nIn\">Anwesende SuS <input type=\"number\" id=\"nIn\" min=\"10\" max=\"15\" value=\"13\"><\/label>\n  <div class=\"toc\" id=\"toc\"><\/div>\n  <span class=\"hint\">Drucken über den Knopf „Druckmaterial drucken“ oberhalb · A4 · Ränder „Keine“ · Hintergrundgrafiken an<\/span>\n<\/div>\n<div id=\"out\"><\/div>\n\n<script>\n/* =====================================================================\n   JULIKRISE 1914 – Entscheidungsspiel (LK 12, LB 1)\n   Single Source of Truth für Beamer-Spielleitung UND Druckmaterial.\n   Inhaltliche Grundlage:\n     • Hellfeld, Kap. 11 „Der Weg in den Krieg“, S. 245–259 (Sachfehler korrigiert, s. KORREKTUREN)\n     • Clark, Die Schlafwandler, München: DVA 2013, Schluss, S. 791–801\n   Änderungen an Inhalten NUR hier vornehmen.\n   ===================================================================== */\n\nconst JK = {};\n\nJK.meta = {\n  titel: \"Fünf Wochen im Sommer\",\n  untertitel: \"Die Julikrise 1914 als Entscheidungsspiel\",\n  leitfrage: \"Hineingeschlittert oder bewusst entfesselt? – Warum wurde aus dem Attentat von Sarajevo ein Weltkrieg?\",\n  kurs: \"Leistungskurs Geschichte · Jahrgangsstufe 12 · LB 1 „Herausforderung Frieden“\",\n  minSuS: 10,\n  maxSuS: 15\n};\n\n/* ---------- Kabinette ---------- */\nJK.kabinette = [\n  { id: \"dr\",  name: \"Deutsches Reich\",      ort: \"Berlin\",          kurz: \"DR\",  block: \"Zweibund\" },\n  { id: \"oeu\", name: \"Österreich-Ungarn\",    ort: \"Wien\",            kurz: \"Ö-U\", block: \"Zweibund\" },\n  { id: \"ru\",  name: \"Russland\",             ort: \"St. Petersburg\",  kurz: \"RU\",  block: \"Entente\" },\n  { id: \"fr\",  name: \"Frankreich\",           ort: \"Paris\",           kurz: \"FR\",  block: \"Entente\" },\n  { id: \"gb\",  name: \"Großbritannien\",       ort: \"London\",          kurz: \"GB\",  block: \"Entente\" },\n  { id: \"srb\", name: \"Serbien\",              ort: \"Belgrad\",         kurz: \"SRB\", block: \"Schützling Russlands\" }\n];\n\n/* ---------- Rollen ----------\n   prio = Reihenfolge der Besetzung. Bei N Schülern werden die Rollen mit prio <= N besetzt.\n   Unbesetzte Rollen werden als „Stimme im Kabinett“ auf der Karte der Leitrolle (prio 1–6) vermerkt. */\nJK.rollen = [\n  { id: \"bethmann\", kab: \"dr\", prio: 1, leit: true,\n    name: \"Theobald von Bethmann Hollweg\", amt: \"Reichskanzler\",\n    haltung: \"Sie fürchten die Einkreisung des Reiches und ein Russland, das bis 1917 militärisch übermächtig wird. Ein lokaler Krieg Österreichs gegen Serbien könnte die Entente spalten – oder zum Weltkrieg werden. Sie wagen das Risiko, wollen aber, dass Russland vor der Welt als Angreifer dasteht.\",\n    ziel: \"Österreich als einzigen verlässlichen Verbündeten halten; den Konflikt lokalisieren; Großbritannien neutral halten.\",\n    roteLinie: \"Das Reich darf nicht als Aggressor erscheinen – sonst folgen weder die Sozialdemokraten noch London.\",\n    geheim: \"Ihr Vertrauter Kurt Riezler notiert Ihre Einschätzung: Eine Aktion gegen Serbien kann zum Weltkrieg führen – ein „Sprung ins Dunkle“ (vgl. Hellfeld, S. 252).\",\n    taktik: \"Wien öffentlich zur Mäßigung mahnen, intern aber zum raschen Handeln drängen („fait accompli“).\" },\n  { id: \"moltke\", kab: \"dr\", prio: 7,\n    name: \"Helmuth von Moltke d. J.\", amt: \"Chef des Generalstabs\",\n    haltung: \"Die Zeit arbeitet gegen das Reich: Russlands Rüstungsprogramm wird in wenigen Jahren abgeschlossen sein. Wenn Krieg, dann jetzt. Jeder Tag diplomatischer Verzögerung kostet militärische Chancen.\",\n    ziel: \"Den Zeitplan des Aufmarschs sichern; keinen Tag Vorsprung an Russland verlieren.\",\n    roteLinie: \"Kein reiner Ostaufmarsch – es gibt nur einen Kriegsplan, und der beginnt im Westen.\",\n    geheim: \"Der Aufmarschplan (sog. Schlieffen-Plan) sieht vor: Krieg gegen Russland bedeutet sofortigen Angriff auf Frankreich durch das neutrale Belgien; die Festung Lüttich muss in den ersten Tagen fallen. Eine Mobilmachung ist daher faktisch der Krieg.\",\n    taktik: \"Den Kanzler mit militärischen Sachzwängen unter Druck setzen; Wien direkt zur Generalmobilmachung ermutigen.\" },\n  { id: \"wilhelm\", kab: \"dr\", prio: 10,\n    name: \"Kaiser Wilhelm II.\", amt: \"Deutscher Kaiser und König von Preußen\",\n    haltung: \"Die Ermordung des befreundeten Thronfolgers trifft Sie persönlich. Sie schwanken zwischen Kraftworten und Angst vor dem großen Krieg. Mit dem Zaren, Ihrem Vetter „Nicky“, verbindet Sie eine persönliche Korrespondenz.\",\n    ziel: \"Monarchische Solidarität gegen „Königsmörder“; Prestige des Reiches wahren – aber keinen Krieg gegen Ihren Vetter.\",\n    roteLinie: \"Das Reich darf den Bündnispartner nicht im Stich lassen.\",\n    geheim: \"Sie haben den Bericht Ihres Botschafters in Wien am Rand kommentiert: „Jetzt oder nie! … Mit den Serben muss aufgeräumt werden, und zwar bald.“ (Hellfeld, S. 251)\",\n    taktik: \"Impulsiv urteilen – aber lassen Sie sich von neuen Nachrichten (z. B. einer entgegenkommenden serbischen Antwort) umstimmen.\" },\n\n  { id: \"berchtold\", kab: \"oeu\", prio: 2, leit: true,\n    name: \"Leopold Graf Berchtold\", amt: \"Außenminister\",\n    haltung: \"Seit den Balkankriegen 1912/13 sieht Wien, wie Serbien wächst und die Südslawen der Monarchie anzieht. Nach dem Mord muss die Großmacht Österreich-Ungarn handeln – sonst gilt sie als erledigt.\",\n    ziel: \"Serbien als Machtfaktor auf dem Balkan ausschalten; Rückendeckung aus Berlin sichern.\",\n    roteLinie: \"Keine Lösung, die als Nachgeben erscheint.\",\n    geheim: \"Kaiser Franz Joseph hat als Ziel die „Isolierung und Verkleinerung Serbiens“ vorgegeben (Hellfeld, S. 252).\",\n    taktik: \"Ein Ultimatum so formulieren, dass Belgrad es kaum annehmen kann – und Russland keine Zeit zur Absprache bleibt.\" },\n  { id: \"conrad\", kab: \"oeu\", prio: 8,\n    name: \"Franz Conrad von Hötzendorf\", amt: \"Chef des Generalstabs\",\n    haltung: \"Sie fordern seit Jahren einen Präventivkrieg gegen Serbien. Jetzt ist der Anlass da. Diplomatie hat die Monarchie 1908 und 1913 nur Zeit gekostet.\",\n    ziel: \"Sofortiger Krieg gegen Serbien.\",\n    roteLinie: \"Keine Verhandlungen, keine Konferenzen.\",\n    geheim: \"Die Armee braucht rund 16 Tage bis zur Einsatzbereitschaft gegen Serbien – ein sofortiger Schlag ist praktisch unmöglich.\",\n    taktik: \"Mit der Ehre der Armee und der Existenz der Monarchie argumentieren.\" },\n  { id: \"tisza\", kab: \"oeu\", prio: 11,\n    name: \"István Graf Tisza\", amt: \"Ungarischer Ministerpräsident\",\n    haltung: \"Sie warnen: Ein Krieg gegen Serbien kann den Weltkrieg auslösen, und die Annexion weiterer Slawen würde die ungarische Stellung in der Doppelmonarchie schwächen.\",\n    ziel: \"Kein überstürzter Krieg; keine Annexion serbischen Gebiets.\",\n    roteLinie: \"Kein Krieg ohne diplomatische Vorbereitung und ohne Verzicht auf Gebietserwerb.\",\n    geheim: \"Sektionsrat Wiesner meldet am 13. Juli: Eine Mitwisserschaft der serbischen Regierung sei „durch nichts erwiesen oder auch nur zu vermuten“ (Hellfeld, S. 253).\",\n    taktik: \"Bremsen – aber Sie können überstimmt werden. Stimmen Sie nur zu, wenn Ihre Bedingungen erfüllt sind.\" },\n\n  { id: \"sasonow\", kab: \"ru\", prio: 3, leit: true,\n    name: \"Sergei Sasonow\", amt: \"Außenminister\",\n    haltung: \"1908/09 musste Russland in der Bosnischen Annexionskrise vor Wien und Berlin zurückweichen. Ein zweites Mal darf das nicht geschehen – sonst verliert Russland jeden Einfluss auf dem Balkan und bei den slawischen Völkern.\",\n    ziel: \"Die „Zerstörung Serbiens und des Gleichgewichts auf dem Balkan“ verhindern (Hellfeld, S. 256).\",\n    roteLinie: \"Kein Nachgeben gegenüber einem Angriff auf Serbien.\",\n    geheim: \"Frankreich hat beim Staatsbesuch (20.–23. Juli) die Bündnistreue bekräftigt.\",\n    taktik: \"Mit militärischen Vorbereitungen Druck aufbauen, zugleich Vermittlung fordern (z. B. Fristverlängerung).\" },\n  { id: \"nikolaus\", kab: \"ru\", prio: 9,\n    name: \"Zar Nikolaus II.\", amt: \"Kaiser von Russland\",\n    haltung: \"Sie sind friedliebend und unsicher, aber als Schutzherr der Slawen gebunden. Über Telegramme stehen Sie mit Ihrem Vetter „Willy“ in Verbindung.\",\n    ziel: \"Krieg vermeiden, ohne Russlands Ehre zu verlieren.\",\n    roteLinie: \"Serbien darf nicht vernichtet werden.\",\n    geheim: \"Sie können jede Mobilmachung per Befehl anhalten oder begrenzen – noch.\",\n    taktik: \"Zögern Sie. Nutzen Sie den persönlichen Draht nach Berlin (Telegramm).\" },\n  { id: \"januschkewitsch\", kab: \"ru\", prio: 12,\n    name: \"Nikolai Januschkewitsch\", amt: \"Chef des Generalstabs\",\n    haltung: \"Russland ist riesig und hat wenig Eisenbahnen. Wer später mobilisiert, verliert. Eine halbe Mobilmachung stiftet Chaos.\",\n    ziel: \"Generalmobilmachung so früh wie möglich.\",\n    roteLinie: \"Keine Teilmobilmachung, die die Armee desorganisiert.\",\n    geheim: \"Eine Teilmobilmachung nur gegen Österreich ist technisch kaum durchführbar – es gibt dafür keinen ausgearbeiteten Plan.\",\n    taktik: \"Mit der Sicherheit des Reiches argumentieren; den Zaren zur Generalmobilmachung drängen.\" },\n\n  { id: \"poincare\", kab: \"fr\", prio: 4, leit: true,\n    name: \"Raymond Poincaré\", amt: \"Staatspräsident\",\n    haltung: \"Frankreichs Sicherheit hängt am Bündnis mit Russland. Ohne Russland steht Frankreich allein gegen das Deutsche Reich. Seit 1871 ist Elsass-Lothringen verloren.\",\n    ziel: \"Das Bündnis mit Russland festigen; Frankreich als Großmacht behaupten.\",\n    roteLinie: \"Russland darf nicht an Frankreichs Treue zweifeln.\",\n    geheim: \"Beim Staatsbesuch in St. Petersburg (20.–23. Juli) warnen Sie den österreichischen Botschafter, Serbien habe Freunde.\",\n    taktik: \"Russland Rückendeckung geben, zugleich Frankreich vor London als friedfertig darstellen.\" },\n  { id: \"viviani\", kab: \"fr\", prio: 13,\n    name: \"René Viviani\", amt: \"Ministerpräsident und Außenminister\",\n    haltung: \"Sie sind außenpolitisch unerfahren und stehen einer kriegsskeptischen Linken nahe. Frankreich muss so handeln, dass London es als Opfer, nicht als Angreifer sieht.\",\n    ziel: \"Großbritannien auf Frankreichs Seite ziehen.\",\n    roteLinie: \"Kein französischer Schritt, der wie eine Provokation aussieht.\",\n    geheim: \"Ohne britische Unterstützung ist ein Krieg für Frankreich hoch riskant.\",\n    taktik: \"Zurückhaltung demonstrieren (z. B. Truppen von der Grenze zurückziehen).\" },\n\n  { id: \"grey\", kab: \"gb\", prio: 5, leit: true,\n    name: \"Sir Edward Grey\", amt: \"Außenminister\",\n    haltung: \"Großbritannien ist durch keinen Bündnisvertrag gebunden, aber durch militärische Absprachen moralisch an Frankreich. Sie wollen vermitteln – und Berlin im Unklaren lassen, ob London eingreift.\",\n    ziel: \"Vermittlung durch die unbeteiligten Mächte; Gleichgewicht in Europa erhalten.\",\n    roteLinie: \"Frankreich darf nicht niedergeworfen werden; die Kanalküste nicht in deutsche Hand fallen.\",\n    geheim: \"Die Mehrheit im Kabinett ist gegen ein Eingreifen – es sei denn, Belgiens Neutralität (garantiert 1839) wird verletzt.\",\n    taktik: \"Vermittlungsvorschläge machen; Warnungen an Berlin nur vorsichtig dosieren.\" },\n  { id: \"asquith\", kab: \"gb\", prio: 14,\n    name: \"Herbert Henry Asquith\", amt: \"Premierminister\",\n    haltung: \"Ihre Regierung ist gespalten, und in Irland droht wegen der Home-Rule-Frage ein Bürgerkrieg. Ein Kontinentalkrieg kommt zur Unzeit.\",\n    ziel: \"Die Regierung zusammenhalten; nur mit breiter Mehrheit handeln.\",\n    roteLinie: \"Kein Kriegseintritt, der die Regierung zerbrechen lässt.\",\n    geheim: \"Mehrere Minister drohen mit Rücktritt, falls Großbritannien Frankreich ohne klaren Anlass beisteht.\",\n    taktik: \"Zeit gewinnen; auf einen Anlass warten, der das Land eint.\" },\n\n  { id: \"pasic\", kab: \"srb\", prio: 6, leit: true,\n    name: \"Nikola Pašić\", amt: \"Ministerpräsident\",\n    haltung: \"Serbien ist erschöpft von zwei Balkankriegen. Im August sind Wahlen. Das Offizierskorps um Oberst Dimitrijević ist mächtig und nationalistisch – Sie können es kaum kontrollieren.\",\n    ziel: \"Krieg vermeiden, ohne die Souveränität Serbiens preiszugeben; russischen Schutz sichern.\",\n    roteLinie: \"Keine österreichischen Beamten, die auf serbischem Boden ermitteln.\",\n    geheim: \"Sie hatten Anfang Juni vage Hinweise auf den Grenzübertritt bewaffneter junger Männer. Eine offene Untersuchung könnte das eigene Militär belasten.\",\n    taktik: \"Entgegenkommen zeigen, aber Kernpunkte ablehnen; Russland um Beistand bitten.\" },\n  { id: \"apis\", kab: \"srb\", prio: 15,\n    name: \"Oberst Dragutin Dimitrijević („Apis“)\", amt: \"Chef des militärischen Nachrichtendienstes\",\n    haltung: \"Sie führen den Geheimbund „Vereinigung oder Tod“ („Schwarze Hand“). Das Ziel ist die Vereinigung aller Serben – notfalls durch Gewalt.\",\n    ziel: \"Keine Unterwerfung unter Wien; kein Einblick Österreichs in die Netzwerke.\",\n    roteLinie: \"Keine Untersuchung gegen serbische Offiziere.\",\n    geheim: \"Aus Ihrem Umfeld stammten Waffen und Hilfe für die Attentäter. Wird das bekannt, ist die Regierung – und Serbien – in höchster Gefahr.\",\n    taktik: \"Jede Nachgiebigkeit der Regierung als Verrat brandmarken.\" }\n];\n\n/* ---------- Eskalationsbarometer ----------\n   Jede Option trägt Eskalationspunkte (esk). Summe der historischen Optionen = JK.baro.histSumme.\n   Anzeige 0–10: Wert = Summe × 10 / histSumme (gekappt). */\nJK.baro = {\n  stufen: [\n    { ab: 0,  label: \"Friedliche Regelung\" },\n    { ab: 2,  label: \"Diplomatische Krise\" },\n    { ab: 4,  label: \"Lokaler Krieg\" },\n    { ab: 6,  label: \"Kontinentale Krise\" },\n    { ab: 8,  label: \"Großmachtkrieg\" },\n    { ab: 10, label: \"Weltkrieg\" }\n  ]\n};\n\n/* ---------- Runden ---------- */\nJK.runden = [\n  {\n    nr: 1, titel: \"Die Antwort auf Sarajevo\", datum: \"5.–22. Juli 1914\", minuten: 7,\n    telegramm: [\n      \"SARAJEVO 28. JUNI STOP THRONFOLGER FRANZ FERDINAND UND HERZOGIN SOPHIE ERSCHOSSEN STOP\",\n      \"TÄTER BOSNISCHE SERBEN – UNTERTANEN DER DOPPELMONARCHIE STOP\",\n      \"BELGRAD VERSICHERT AM 3. JULI: KEINE BETEILIGUNG STOP AUFKLÄRUNG ZUGESAGT STOP\",\n      \"WIEN SENDET GRAF HOYOS NACH BERLIN STOP ZIEL: ISOLIERUNG UND VERKLEINERUNG SERBIENS STOP\"\n    ],\n    lage: \"Seit dem Attentat vom 28. Juni ist eine Woche vergangen. Die Attentäter haben gestanden; Waffen und Hilfe kamen offenbar aus Serbien. In Wien wird über eine „Abrechnung“ mit Serbien gesprochen. Graf Hoyos bringt ein Handschreiben Kaiser Franz Josephs nach Berlin. Paris bereitet einen Staatsbesuch in St. Petersburg vor (20.–23. Juli). In London beherrscht die Irlandkrise die Politik.\",\n    leitdilemma: \"Bündnistreue oder Eskalationsrisiko? – Stellen Sie Ihrem Partner einen „Blankoscheck“ aus?\",\n    zitat: { text: \"„Jetzt oder nie! Nachher heißt es dann, wenn's schief geht, Deutschland hat nicht gewollt. Mit den Serben muss aufgeräumt werden, und zwar bald.“\", quelle: \"Wilhelm II., Randbemerkung zum Bericht Tschirschkys vom 30. Juni 1914; zit. n. Hellfeld, S. 251\" },\n    optionen: {\n      dr: [\n        { k: \"A\", t: \"Wien bedingungslose Unterstützung zusagen – was immer es gegen Serbien unternimmt („Blankoscheck“).\", esk: 3 },\n        { k: \"B\", t: \"Unterstützung nur für eine begrenzte Strafaktion zusagen; Wien muss Berlin vorab konsultieren.\", esk: 1 },\n        { k: \"C\", t: \"Wien zu Mäßigung und einer internationalen Untersuchung des Attentats drängen.\", esk: -1 }\n      ],\n      oeu: [\n        { k: \"A\", t: \"Sofortiger Militärschlag gegen Serbien, solange die Empörung in Europa groß ist.\", esk: 2 },\n        { k: \"B\", t: \"Ein befristetes, schwer annehmbares Ultimatum ausarbeiten – Übergabe erst nach dem französischen Staatsbesuch in Russland.\", esk: 2 },\n        { k: \"C\", t: \"Diplomatische Genugtuung und eine gemeinsame Untersuchung fordern; Ergebnis der eigenen Ermittlungen (Wiesner) abwarten.\", esk: -1 }\n      ],\n      ru: [\n        { k: \"A\", t: \"Deutlich signalisieren, dass Russland einen Angriff auf Serbien nicht hinnehmen wird.\", esk: 1 },\n        { k: \"B\", t: \"Belgrad zu weitgehendem Entgegenkommen gegenüber Wien drängen.\", esk: -1 },\n        { k: \"C\", t: \"Abwarten und keine Signale senden.\", esk: 0 }\n      ],\n      fr: [\n        { k: \"A\", t: \"Beim Staatsbesuch das Bündnis bekräftigen und Russland Rückendeckung geben; Wien warnen.\", esk: 1 },\n        { k: \"B\", t: \"Russland beim Staatsbesuch zur Vorsicht in der Balkanfrage mahnen.\", esk: -1 },\n        { k: \"C\", t: \"Den Staatsbesuch unpolitisch halten.\", esk: 0 }\n      ],\n      gb: [\n        { k: \"A\", t: \"Die Irlandkrise hat Vorrang; der Balkan ist eine Angelegenheit Wiens.\", esk: 0 },\n        { k: \"B\", t: \"Berlin frühzeitig und vertraulich vor einer Eskalation warnen.\", esk: -1 },\n        { k: \"C\", t: \"Eine Vermittlungsinitiative der unbeteiligten Mächte vorbereiten.\", esk: -1 }\n      ],\n      srb: [\n        { k: \"A\", t: \"Eine Untersuchung gegen verdächtige Offiziere einleiten – auch gegen den Widerstand des Militärs.\", esk: -1 },\n        { k: \"B\", t: \"Jede Beteiligung bestreiten, Aufklärung zusagen, aber keine Ermittlungen gegen das Militär.\", esk: 0 },\n        { k: \"C\", t: \"Sofort Russland um eine öffentliche Schutzgarantie bitten.\", esk: 1 }\n      ]\n    },\n    historisch: {\n      dr: { k: \"A\", t: \"Am 5./6. Juli sagen Wilhelm II. und Reichskanzler Bethmann Hollweg Wien bedingungslose Unterstützung zu: Deutschland werde „treu an der Seite Österreich-Ungarns stehen“ (Hellfeld, S. 252). Berlin drängt in der Folge auf rasches Handeln.\" },\n      oeu: { k: \"B\", t: \"Der Gemeinsame Ministerrat beschließt ein Ultimatum; Tisza stimmt nach anfänglichem Widerstand zu. Der Wiesner-Bericht (13. Juli) entlastet die serbische Regierung, wird aber nicht veröffentlicht. Die Übergabe wird bewusst auf den 23. Juli gelegt – nach der Abreise Poincarés aus St. Petersburg (Hellfeld, S. 253 f.).\" },\n      ru: { k: \"A\", t: \"Beim Staatsbesuch Poincarés bekräftigen Russland und Frankreich ihr Bündnis. St. Petersburg signalisiert, dass es Serbien nicht preisgeben wird.\" },\n      fr: { k: \"A\", t: \"Poincaré erneuert in St. Petersburg (20.–23. Juli) die Bündnisverpflichtungen und ermutigt den Zaren zu einer festen Haltung. Hellfeld nennt dies einen „zweiten Blankoscheck“ (S. 255) – eine Deutung, die in der Forschung umstritten ist.\" },\n      gb: { k: \"A\", t: \"London schenkt der Lage kaum Beachtung. Ein hoher Diplomat des Foreign Office bezweifelt am 9. Juli, dass Österreich „eine ernste Aktion unternehmen wird“ (Hellfeld, S. 252 f.).\" },\n      srb: { k: \"B\", t: \"Die serbische Regierung versichert am 3. Juli, mit dem Anschlag nichts zu tun zu haben, und sagt Aufklärung zu (Hellfeld, S. 252). Gegen die Netzwerke im eigenen Offizierskorps geht sie nicht vor.\" }\n    }\n  },\n  {\n    nr: 2, titel: \"Das Ultimatum\", datum: \"23.–27. Juli 1914\", minuten: 6,\n    telegramm: [\n      \"WIEN 23. JULI 18 UHR STOP ULTIMATUM AN SERBIEN ÜBERGEBEN STOP FRIST 48 STUNDEN STOP\",\n      \"10 PUNKTE STOP PUNKT 5 UND 6: K.U.K. ORGANE SOLLEN IN SERBIEN MITWIRKEN UND ERMITTELN STOP\",\n      \"PARIS: PRÄSIDENT POINCARÉ AUF SEE – RÜCKREISE AUS ST. PETERSBURG STOP\",\n      \"LONDON: GREY NENNT ULTIMATUM DAS FURCHTBARSTE DOKUMENT GEGEN EINEN UNABHÄNGIGEN STAAT STOP\"\n    ],\n    lage: \"Das Ultimatum verlangt u. a. die Unterdrückung jeder antiösterreichischen Propaganda und die Mitwirkung österreichischer Organe an Untersuchungen auf serbischem Boden. Es ist bewusst so formuliert, dass Belgrad kaum zustimmen kann, ohne seine Souveränität aufzugeben. Die Frist läuft am 25. Juli um 18 Uhr ab. In allen Hauptstädten wartet man auf Belgrads Antwort – und auf die Reaktion der anderen.\",\n    leitdilemma: \"Gesichtswahrung oder Kompromiss? – Kann man nachgeben, ohne als Verlierer dazustehen?\",\n    zitat: { text: \"Es werde ihm „sehr unsympathisch“ sein, wenn Serbien alle Forderungen erfülle.\", quelle: \"Berchtold gegenüber dem deutschen Botschafter, Juli 1914; zit. n. Hellfeld, S. 253\" },\n    optionen: {\n      dr: [\n        { k: \"A\", t: \"Den britischen Vorschlag einer Botschafterkonferenz ablehnen: Der Konflikt ist eine Sache zwischen Wien und Belgrad („Lokalisierung“).\", esk: 2 },\n        { k: \"B\", t: \"Den Konferenzvorschlag annehmen und Wien zur Teilnahme drängen.\", esk: -2 },\n        { k: \"C\", t: \"Zum Schein Gesprächsbereitschaft zeigen, Wien intern aber zu raschem Handeln ermutigen.\", esk: 1 }\n      ],\n      oeu: [\n        { k: \"A\", t: \"Jede Antwort, die nicht alle Punkte vorbehaltlos annimmt, gilt als Ablehnung: Abbruch der Beziehungen und Mobilmachung gegen Serbien.\", esk: 2 },\n        { k: \"B\", t: \"Eine weitgehende Annahme wird als Verhandlungsbasis akzeptiert.\", esk: -2 }\n      ],\n      ru: [\n        { k: \"A\", t: \"Die „Periode der Kriegsvorbereitung“ einleiten und eine Teilmobilmachung gegen Österreich-Ungarn grundsätzlich beschließen.\", esk: 2 },\n        { k: \"B\", t: \"Nur diplomatisch protestieren und Belgrad zur Annahme raten.\", esk: -1 },\n        { k: \"C\", t: \"Eine Fristverlängerung für Serbien fordern und sonst abwarten.\", esk: 0 }\n      ],\n      fr: [\n        { k: \"A\", t: \"Russland volle Solidarität zusichern.\", esk: 1 },\n        { k: \"B\", t: \"Russland zur Mäßigung drängen.\", esk: -1 },\n        { k: \"C\", t: \"Sich ganz hinter den britischen Konferenzvorschlag stellen.\", esk: -1 }\n      ],\n      gb: [\n        { k: \"A\", t: \"Eine Botschafterkonferenz der unbeteiligten Mächte (GB, FR, DR, Italien) vorschlagen.\", esk: -1 },\n        { k: \"B\", t: \"Offen erklären, dass Großbritannien an der Seite Frankreichs und Russlands steht.\", esk: 0 },\n        { k: \"C\", t: \"Andeuten, dass Großbritannien neutral bleiben wird.\", esk: 1 }\n      ],\n      srb: [\n        { k: \"A\", t: \"Das Ultimatum vollständig annehmen, einschließlich der Punkte 5 und 6.\", esk: -2 },\n        { k: \"B\", t: \"Weitgehend entgegenkommend antworten, aber die Mitwirkung österreichischer Organe an Ermittlungen (Punkt 6) ablehnen – und vorsorglich mobilisieren.\", esk: 1 },\n        { k: \"C\", t: \"Das Ultimatum als unvereinbar mit der Souveränität zurückweisen.\", esk: 2 }\n      ]\n    },\n    historisch: {\n      dr: { k: \"A\", t: \"Berlin lehnt Greys Vorschlag einer Botschafterkonferenz am 27. Juli ab (Hellfeld, S. 256) und besteht auf der „Lokalisierung“ des Konflikts.\" },\n      oeu: { k: \"A\", t: \"Die serbische Antwort (25. Juli, kurz vor Fristablauf) wird in Wien binnen Minuten für ungenügend erklärt. Der Gesandte reist ab, die Teilmobilmachung gegen Serbien wird angeordnet.\" },\n      ru: { k: \"A\", t: \"Ministerrat (24.7.) und Kronrat (25.7.) beschließen: Serbien könne das Ultimatum ohne Gesichtsverlust nicht erfüllen. Russland fordert eine Fristverlängerung, beginnt am 26. Juli die „Periode der Kriegsvorbereitung“ und beschließt im Grundsatz eine Teilmobilmachung für die Militärbezirke Odessa, Kiew, Moskau und Kasan (Hellfeld, S. 256).\" },\n      fr: { k: \"A\", t: \"Der französische Botschafter in St. Petersburg sichert Russland die Solidarität Frankreichs zu. Paris stimmt zugleich Greys Konferenzidee formal zu.\" },\n      gb: { k: \"A\", t: \"Grey schlägt eine Konferenz der vier nicht unmittelbar beteiligten Mächte vor (Hellfeld, S. 256). Die Flotte wird nach einem Manöver nicht demobilisiert.\" },\n      srb: { k: \"B\", t: \"Serbien antwortet am 25. Juli sehr entgegenkommend, lehnt aber die Beteiligung österreichischer Organe an der Untersuchung ab und hatte bereits zuvor die Mobilmachung angeordnet. Achtung: Hellfeld schreibt (S. 257), Serbien habe am 27. Juli „in allen Punkten“ angenommen – das ist sachlich falsch.\" }\n    }\n  },\n  {\n    nr: 3, titel: \"Mobilmachung\", datum: \"28.–30. Juli 1914\", minuten: 5,\n    telegramm: [\n      \"BERLIN 28. JULI STOP KAISER LIEST SERBISCHE ANTWORT STOP JEDER KRIEGSGRUND ENTFALLEN STOP\",\n      \"VORSCHLAG BERLIN: BELGRAD ALS PFAND BESETZEN UND DANN HALT STOP\",\n      \"WIEN 28. JULI STOP KRIEGSERKLÄRUNG AN SERBIEN STOP 29. JULI BESCHIESSUNG BELGRADS STOP\",\n      \"ST. PETERSBURG 29. JULI STOP TEILMOBILMACHUNG GEGEN ÖSTERREICH-UNGARN VERKÜNDET STOP\"\n    ],\n    lage: \"Wilhelm II. hält den Kriegsgrund nach der serbischen Antwort für entfallen und schlägt vor, Österreich solle Belgrad nur als Pfand besetzen („Halt in Belgrad“). Wien erklärt Serbien trotzdem am 28. Juli den Krieg – Kaiser Franz Joseph wurde zuvor über ein angebliches serbisches Gefecht falsch informiert. Belgrad wird beschossen. Russland hat die Teilmobilmachung verkündet. In Berlin ringen Reichskanzler und Generalstab um den Kurs. Ob London eingreifen wird, weiß noch niemand.\",\n    leitdilemma: \"Diplomatische Zeit oder militärischer Zeitplan? – Wer zuerst mobilisiert, gewinnt militärisch und verliert diplomatisch.\",\n    zitat: { text: \"Alle Erklärungen des Desinteressements gälten „nur für den Fall, dass der Krieg zwischen uns und Serbien lokalisiert bleibt“.\", quelle: \"Berchtold an die britische Regierung, Ende Juli 1914; zit. n. Hellfeld, S. 257\" },\n    optionen: {\n      dr: [\n        { k: \"A\", t: \"Wien unter Androhung des Bündnisentzugs zwingen, bei Belgrad anzuhalten und zu verhandeln.\", esk: -3 },\n        { k: \"B\", t: \"Dem Generalstab folgen: Wien zur Generalmobilmachung drängen, eigene Mobilmachung vorbereiten.\", esk: 2 },\n        { k: \"C\", t: \"Zweigleisig: Der Kanzler mahnt Wien zu Verhandlungen, der Generalstab drängt zur Mobilmachung; Großbritannien wird für seine Neutralität ein Angebot gemacht.\", esk: 1 }\n      ],\n      oeu: [\n        { k: \"A\", t: \"„Halt in Belgrad“ annehmen und Verhandlungen über die Großmächte zulassen.\", esk: -3 },\n        { k: \"B\", t: \"Den Krieg gegen Serbien fortsetzen und jede Vermittlung ablehnen.\", esk: 2 }\n      ],\n      ru: [\n        { k: \"A\", t: \"Bei der Teilmobilmachung gegen Österreich-Ungarn bleiben.\", esk: 1 },\n        { k: \"B\", t: \"Die Generalmobilmachung aller Streitkräfte anordnen.\", esk: 3 },\n        { k: \"C\", t: \"Alle Mobilmachungen anhalten und über den Zaren direkt mit Berlin verhandeln.\", esk: -2 }\n      ],\n      fr: [\n        { k: \"A\", t: \"Die Truppen 10 km hinter die Grenze zurückziehen, um vor London nicht als Angreifer dazustehen – Russland aber die Treue bestätigen.\", esk: 0 },\n        { k: \"B\", t: \"Die eigene Mobilmachung vorbereiten.\", esk: 1 },\n        { k: \"C\", t: \"Russland ausdrücklich von einer Generalmobilmachung abraten.\", esk: -1 }\n      ],\n      gb: [\n        { k: \"A\", t: \"Berlin vertraulich warnen, dass Großbritannien nicht abseits stehen werde – Frankreich aber keine feste Zusage geben.\", esk: -1 },\n        { k: \"B\", t: \"Frankreich und Russland öffentlich Beistand zusagen.\", esk: 0 },\n        { k: \"C\", t: \"Das deutsche Neutralitätsangebot annehmen.\", esk: 1 }\n      ],\n      srb: [\n        { k: \"A\", t: \"Die Großmächte (Zar, London) um Vermittlung anrufen.\", esk: 0 },\n        { k: \"B\", t: \"Militärischen Widerstand organisieren und auf Russland vertrauen.\", esk: 1 },\n        { k: \"C\", t: \"Belgrad als Pfand räumen, um einen großen Krieg zu verhindern.\", esk: -1 }\n      ]\n    },\n    historisch: {\n      dr: { k: \"C\", t: \"Berlin fährt zweigleisig: Bethmann Hollweg drängt Wien am 29./30. Juli spät und halbherzig zu Gesprächen und macht London ein Neutralitätsangebot; Moltke ermutigt Conrad gleichzeitig zur Generalmobilmachung und rät von Vermittlung ab (Hellfeld, S. 257 f.). In Wien fragt man: Wer regiert in Berlin?\" },\n      oeu: { k: \"B\", t: \"Wien lehnt „Halt in Belgrad“ ab, erklärt am 28. Juli den Krieg, beschießt ab 29. Juli Belgrad und zieht frühere Zusagen des Desinteressements an serbischem Gebiet zurück (Hellfeld, S. 257).\" },\n      ru: { k: \"B\", t: \"Nach der Teilmobilmachung (29. Juli) und einem kurzen Schwanken des Zaren ordnet Nikolaus II. am 30. Juli die Generalmobilmachung an – gedrängt von Sasonow und dem Generalstab (Hellfeld, S. 257).\" },\n      fr: { k: \"A\", t: \"Am 30. Juli zieht Frankreich seine Truppen 10 km hinter die Grenze zurück – ein Signal an London – und bestätigt zugleich die Bündnistreue gegenüber Russland.\" },\n      gb: { k: \"A\", t: \"Grey warnt Botschafter Lichnowsky am 29. Juli, Großbritannien werde im Kriegsfall nicht neutral bleiben, lehnt das deutsche Neutralitätsangebot ab, gibt Frankreich aber keine feste Zusage.\" },\n      srb: { k: \"B\", t: \"Serbien verlegt die Regierung nach Niš, verteidigt sich und setzt auf russische Unterstützung.\" }\n    }\n  },\n  {\n    nr: 4, titel: \"Der Automatismus\", datum: \"31. Juli – 4. August 1914\", minuten: 4,\n    telegramm: [\n      \"ST. PETERSBURG 31. JULI STOP GENERALMOBILMACHUNG ÖFFENTLICH BEKANNT STOP\",\n      \"BERLIN: ZUSTAND DROHENDER KRIEGSGEFAHR ERKLÄRT STOP\",\n      \"WIEN: GENERALMOBILMACHUNG ANGEORDNET STOP\",\n      \"GENERALSTAB BERLIN: AUFMARSCH WEST VERLANGT DURCHMARSCH DURCH BELGIEN STOP\"\n    ],\n    lage: \"Russland mobilisiert alle Streitkräfte. Nach deutscher Planung ist das der Ernstfall: Der Aufmarsch verlangt einen sofortigen Angriff auf Frankreich durch Luxemburg und das neutrale Belgien. Belgiens Neutralität wird seit 1839 von den Großmächten garantiert – auch von Großbritannien. Italien, Partner des Dreibunds, wird sich für neutral erklären.\",\n    leitdilemma: \"Vertragstreue oder „militärische Notwendigkeit“? – Und: Gibt es noch einen Weg zurück?\",\n    zitat: { text: \"Wegen eines „Fetzens Papier“ werde England doch wohl den Frieden nicht brechen.\", quelle: \"Bethmann Hollweg zum britischen Botschafter, 4. August 1914; zit. n. Hellfeld, S. 259\" },\n    optionen: {\n      dr: [\n        { k: \"A\", t: \"Ultimaten an Russland (12 Std.) und Frankreich (18 Std.); danach Kriegserklärung an Russland, Einmarsch in Luxemburg und Belgien nach Aufmarschplan.\", esk: 3 },\n        { k: \"B\", t: \"Nur im Osten aufmarschieren und Frankreich nicht angreifen – gegen den Rat des Generalstabs („undurchführbar“).\", esk: 1 },\n        { k: \"C\", t: \"Abwarten und dem Zaren über den persönlichen Draht eine letzte Frist anbieten.\", esk: -1 }\n      ],\n      oeu: [\n        { k: \"A\", t: \"Generalmobilmachung, Krieg auch gegen Russland.\", esk: 1 },\n        { k: \"B\", t: \"Den Schwerpunkt auf Serbien legen und Russland direkte Gespräche anbieten.\", esk: -1 }\n      ],\n      ru: [\n        { k: \"A\", t: \"Das deutsche Ultimatum verstreichen lassen – die Mobilmachung ist nicht umkehrbar.\", esk: 2 },\n        { k: \"B\", t: \"Die Mobilmachung einstellen, um den Krieg mit Deutschland zu vermeiden.\", esk: -3 }\n      ],\n      fr: [\n        { k: \"A\", t: \"Mobilmachung (1. August) und Beistand für Russland.\", esk: 1 },\n        { k: \"B\", t: \"Neutralität erklären – und dafür die geforderten Festungen Toul und Verdun als Pfand übergeben.\", esk: -1 }\n      ],\n      gb: [\n        { k: \"A\", t: \"Falls Deutschland Belgien angreift: Ultimatum an Berlin und Kriegseintritt.\", esk: 2 },\n        { k: \"B\", t: \"Neutral bleiben, auch wenn Belgien überfallen wird.\", esk: -1 },\n        { k: \"C\", t: \"Nur die französische Nordküste mit der Flotte schützen.\", esk: 1 }\n      ],\n      srb: [\n        { k: \"A\", t: \"Den Kampf an der Seite Russlands fortsetzen.\", esk: 0 },\n        { k: \"B\", t: \"Wien einen Separatfrieden anbieten.\", esk: -1 }\n      ]\n    },\n    historisch: {\n      dr: { k: \"A\", t: \"Ultimatum an Russland (31.7.), Kriegserklärung an Russland (1.8.), Besetzung Luxemburgs, Ultimatum an Belgien (2.8.), Kriegserklärung an Frankreich (3.8.), Einmarsch in Belgien (4.8.). Wilhelm II. zögert kurz, unterschreibt dann aber (Hellfeld, S. 258 f.).\" },\n      oeu: { k: \"A\", t: \"Österreich-Ungarn ordnet am 31. Juli die Generalmobilmachung an; die Kriegserklärung an Russland folgt am 6. August.\" },\n      ru: { k: \"A\", t: \"Russland lässt das deutsche Ultimatum am 1. August verstreichen (Hellfeld, S. 258).\" },\n      fr: { k: \"A\", t: \"Frankreich mobilisiert am 1. August. Die deutsche Forderung, als Pfand für eine Neutralität die Festungen Toul und Verdun zu übergeben, wird gar nicht erst übermittelt – das Ultimatum wird abgelehnt.\" },\n      gb: { k: \"A\", t: \"Am 2. August sagt London Frankreich den Schutz der Nordküste zu; nach dem Einmarsch in Belgien folgt das Ultimatum und am 4. August der Kriegseintritt (Hellfeld, S. 259).\" },\n      srb: { k: \"A\", t: \"Serbien kämpft weiter; im Herbst 1914 schlägt es die ersten österreichischen Offensiven zurück.\" }\n    }\n  }\n];\n\n/* Summe der historischen Eskalationspunkte (wird berechnet) */\nJK.baro.histSumme = JK.runden.reduce((s, r) =>\n  s + Object.entries(r.historisch).reduce((s2, [kab, h]) =>\n    s2 + r.optionen[kab].find(o => o.k === h.k).esk, 0), 0);\n\n/* ---------- Forschungspositionen (Abschluss) ---------- */\nJK.positionen = [\n  {\n    id: \"lloyd\", pos: 1, kurz: \"Hineingeschlittert\",\n    autor: \"David Lloyd George\", werk: \"War Memoirs, 1933–36\",\n    these: \"Keine Regierung habe den Krieg gewollt. Die Nationen seien in einer kollektiven Überforderung „über den Rand“ in den Krieg geglitten. Diese Deutung prägte die Zwischenkriegszeit und entlastete alle Beteiligten gleichermaßen.\",\n    zitat: \"„The nations slithered over the brink into the boiling cauldron of war.“ – „Die Nationen schlitterten über den Rand in den brodelnden Kessel des Krieges.“\",\n    beleg: \"Zitat vor dem Druck an der Originalausgabe prüfen (War Memoirs, Bd. 1).\",\n    geprueft: false,\n    pruefFrage: \"Wo hatten die Kabinette im Spiel keine echte Wahl mehr – und wo doch?\"\n  },\n  {\n    id: \"fischer\", pos: 4, kurz: \"Griff nach der Weltmacht\",\n    autor: \"Fritz Fischer\", werk: \"Griff nach der Weltmacht, 1961\",\n    these: \"Das Deutsche Reich trägt einen entscheidenden Teil der Verantwortung. Berlin habe den Krieg Österreichs gegen Serbien gewollt und gedeckt und bewusst den großen Konflikt riskiert, um aus der Isolation auszubrechen und Weltmacht zu werden. Die Kriegsziele zeigen eine Kontinuität deutscher Machtpolitik.\",\n    zitat: \"Nach dieser Sichtweise „stolperten oder schlitterten die Deutschen nicht in den Krieg. Sie entschieden sich für ihn – schlimmer noch, sie planten ihn im Voraus, in der Hoffnung, aus ihrer europäischen Isolation auszubrechen und den berüchtigten ‚Griff nach der Weltmacht‘ zu wagen.“\",\n    beleg: \"Zusammenfassung der Fischer-Schule bei Clark, Die Schlafwandler, S. 798.\",\n    geprueft: true,\n    pruefFrage: \"Welche Entscheidungen Berlins im Spiel (Runde 1–4) stützen diese These?\"\n  },\n  {\n    id: \"clark\", pos: 2, kurz: \"Schlafwandler\",\n    autor: \"Christopher Clark\", werk: \"Die Schlafwandler, 2012 (dt. 2013)\",\n    these: \"Die Krise war multipolar und interaktiv; alle Hauptakteure trugen Verantwortung. Die Frage nach dem einen Schuldigen verengt den Blick. Wichtiger sei, wie die Akteure unter Misstrauen, Zeitdruck und eigenen Deutungsmustern handelten.\",\n    zitat: \"„Der Kriegsausbruch von 1914 ist kein Agatha-Christie-Thriller […]. In dieser Geschichte gibt es keine Tatwaffe als unwiderlegbaren Beweis, oder genauer: Es gibt sie in der Hand jedes einzelnen wichtigen Akteurs. So gesehen war der Kriegsausbruch eine Tragödie, kein Verbrechen.“ (S. 799) – „So gesehen waren die Protagonisten von 1914 Schlafwandler – wachsam, aber blind, von Albträumen geplagt, aber unfähig, die Realität der Gräuel zu erkennen, die sie in Kürze in die Welt setzen sollten.“ (S. 801)\",\n    beleg: \"Clark, Die Schlafwandler, München: DVA 2013, S. 799 und 801.\",\n    geprueft: true,\n    pruefFrage: \"Wo hat im Spiel jede Macht (auch Russland, Frankreich, Serbien) zur Eskalation beigetragen?\"\n  },\n  {\n    id: \"krumeich\", pos: 3, kurz: \"Kalkuliertes Risiko\",\n    autor: \"Gerd Krumeich / Annika Mombauer\", werk: \"Juli 1914. Eine Bilanz, 2014 / Die Julikrise, 2014\",\n    these: \"Berlin und Wien hatten in der Julikrise die Initiative und trugen die Hauptverantwortung. Berlin betrieb eine Politik des kalkulierten Risikos: Es wollte einen lokalen Krieg und nahm den großen Krieg bewusst in Kauf, weil es glaubte, ihn jetzt noch gewinnen zu können. Andere Mächte trugen Mitverantwortung, reagierten aber vor allem auf die Initiative der Mittelmächte.\",\n    zitat: \"Beleg aus der Quelle: Bethmann Hollweg selbst hielt schon Anfang Juli fest, dass eine „Aktion gegen Serbien zum Weltkrieg werden“ könne – ein „Sprung ins Dunkle“ (Riezler-Tagebuch, zit. n. Hellfeld, S. 252).\",\n    beleg: \"Kernthese als Paraphrase – vor dem Druck mit Krumeich 2014 bzw. Mombauer 2014 abgleichen.\",\n    geprueft: false,\n    pruefFrage: \"Wer hat im Spiel die Initiative ergriffen – und wer hat nur reagiert?\"\n  }\n];\n\n/* Positionslinie (Raumlinie) */\nJK.linie = [\n  { id: \"l1\", label: \"Hineingeschlittert\", sub: \"Lloyd George\" },\n  { id: \"l2\", label: \"Geteilte Verantwortung\", sub: \"Clark\" },\n  { id: \"l3\", label: \"Hauptverantwortung mit Mitverantwortung\", sub: \"\" },\n  { id: \"l4\", label: \"Kalkuliertes Risiko\", sub: \"Krumeich / Mombauer\" },\n  { id: \"l5\", label: \"Bewusst entfesselt\", sub: \"Fischer\" }\n];\n\n/* ---------- Aufgaben (Operatoren nach Cornelsen) ---------- */\nJK.aufgaben = {\n  experten: [\n    { op: \"Arbeiten Sie\", rest: \" die Kernthese Ihrer Forschungsposition und deren zentrales Argument heraus.\", afb: \"II\" },\n    { op: \"Überprüfen Sie\", rest: \" die These an mindestens zwei konkreten Entscheidungen aus dem Spiel.\", afb: \"III\" }\n  ],\n  weggabelung: [\n    { op: \"Beurteilen Sie\", rest: \", an welcher Weggabelung der Krieg 1914 am ehesten hätte verhindert werden können – und warum sie nicht genutzt wurde.\", afb: \"III · Sachurteil\" }\n  ],\n  plenum: [\n    { op: \"Beurteilen Sie\", rest: \", inwieweit der Kriegsausbruch 1914 eher auf strukturelle Zwänge oder auf bewusste Entscheidungen zurückzuführen ist.\", afb: \"III · Sachurteil\" }\n  ],\n  hausaufgabe: [\n    { op: \"Erörtern Sie\", rest: \" Clarks These, die Protagonisten von 1914 seien „Schlafwandler“ gewesen (ca. 1,5 Seiten).\", afb: \"III\" },\n    { op: \"Nehmen Sie Stellung\", rest: \" zu der Frage, ob „Kriegsschuld“ eine angemessene Kategorie historischen Urteilens ist.\", afb: \"III · Werturteil\" }\n  ]\n};\n\nJK.debriefing = [\n  \"Wo hatte euer Kabinett einen Ausweg – und habt ihr ihn genommen?\",\n  \"An welcher Stelle sind wir vom historischen Verlauf abgewichen – und warum war das für uns leichter als für die Akteure von 1914?\",\n  \"Wo hat ein Konflikt innerhalb eines Kabinetts (Kanzler gegen Generalstab, Zar gegen Generalstab) die Entscheidung bestimmt?\",\n  \"Welche Information hatten wir, die 1914 niemand hatte? (Rückschaufehler)\"\n];\n\nJK.exitTicket = [\n  \"3 Faktoren, die den Handlungsspielraum 1914 verengten\",\n  \"2 Unterschiede zwischen Fischer und Clark\",\n  \"1 Weggabelung, an der der Krieg am ehesten vermeidbar war – beurteilen Sie sie in zwei Sätzen\"\n];\n\nJK.regeln = [\n  \"Jede Rolle spricht aus der Sicht des Jahres 1914 – nicht mit dem Wissen von heute.\",\n  \"Jedes Kabinett entscheidet sich pro Runde für genau eine Option (A, B oder C).\",\n  \"Pro Runde darf jedes Kabinett ein Telegramm an eine andere Macht schicken. Die Spielleitung stellt es erst zu Beginn der nächsten Runde zu.\",\n  \"Nach Ablauf des Timers verkündet der Sprecher die Entscheidung. Der Sprecher wechselt jede Runde.\",\n  \"Die Lage wird nach jeder Runde so fortgeschrieben, wie sie 1914 verlief – unabhängig vom Beschluss des Kabinetts. Abweichungen werden am Ende ausgewertet.\",\n  \"Ziel ist nicht zu gewinnen, sondern Entscheidungen zu treffen, die die Rollen 1914 hätten begründen können.\"\n];\n\n/* ---------- Weggabelungen: Wo der Krieg hätte verhindert werden können ----------\n   wahl: Optionen im Spiel, die diesem Ausstieg entsprechen (Kabinett → Optionen in Runde r).\n   Wählt die Klasse eine davon, gilt der Ausstieg als „im Spiel genutzt“. */\nJK.weggabelungen = [\n  { nr: 1, datum: \"Anfang Juli\", ort: \"Belgrad\", akteur: \"Serbische Regierung\", r: 1, wahl: { srb: [\"A\"] },\n    ausstieg: \"Offen gegen das Offiziersnetzwerk („Schwarze Hand“) ermitteln, aus dem die Attentäter Hilfe erhielten.\",\n    warumNicht: \"Das Militär war mächtig, im August standen Wahlen an – eine Untersuchung hätte die Regierung selbst gefährdet.\" },\n  { nr: 2, datum: \"5./6. Juli\", ort: \"Berlin\", akteur: \"Wilhelm II. und Bethmann Hollweg\", r: 1, wahl: { dr: [\"B\", \"C\"] },\n    ausstieg: \"Die Unterstützung Wiens an Bedingungen knüpfen statt einen „Blankoscheck“ auszustellen.\",\n    warumNicht: \"Angst, den einzigen verlässlichen Verbündeten zu verlieren; Präventivkriegsdenken; Hoffnung, der Krieg bleibe lokal.\" },\n  { nr: 3, datum: \"13. Juli\", ort: \"Wien\", akteur: \"Berchtold und der Ministerrat\", r: 1, wahl: { oeu: [\"C\"] },\n    ausstieg: \"Den Wiesner-Bericht ernst nehmen: Eine Mitschuld der serbischen Regierung war nicht erwiesen.\",\n    warumNicht: \"Die Entscheidung zur „Abrechnung“ war bereits gefallen; ein Rückzieher hätte als Schwäche gegolten.\" },\n  { nr: 4, datum: \"Juli\", ort: \"London\", akteur: \"Grey und das Kabinett\", r: 1, wahl: { gb: [\"B\", \"C\"] },\n    ausstieg: \"Frühzeitig warnen oder vermitteln, solange noch nichts entschieden war.\",\n    warumNicht: \"Die Irlandkrise band alle Kräfte; die Gefahr auf dem Balkan wurde unterschätzt. Ob eine frühe Warnung Berlin gebremst hätte, ist umstritten.\" },\n  { nr: 5, datum: \"20.–23. Juli\", ort: \"St. Petersburg\", akteur: \"Poincaré und Sasonow\", r: 1, wahl: { fr: [\"B\"], ru: [\"B\"] },\n    ausstieg: \"Einander zur Mäßigung drängen statt sich gegenseitig den Rücken zu stärken.\",\n    warumNicht: \"Beide fürchteten um den Bestand des Bündnisses; Russland wollte keine zweite Demütigung wie 1908/09.\" },\n  { nr: 6, datum: \"25. Juli\", ort: \"Wien\", akteur: \"Berchtold\", r: 2, wahl: { oeu: [\"B\"], srb: [\"A\"] },\n    ausstieg: \"Die sehr entgegenkommende serbische Antwort als Verhandlungsbasis annehmen.\",\n    warumNicht: \"Das Ultimatum war auf Ablehnung angelegt; Wien wollte Serbien als Machtfaktor ausschalten.\" },\n  { nr: 7, datum: \"26./27. Juli\", ort: \"Berlin\", akteur: \"Reichsleitung\", r: 2, wahl: { dr: [\"B\"] },\n    ausstieg: \"Greys Vorschlag einer Botschafterkonferenz der unbeteiligten Mächte annehmen.\",\n    warumNicht: \"Berlin setzte auf „Lokalisierung“ und fürchtete, in einer Konferenz überstimmt zu werden.\" },\n  { nr: 8, datum: \"28./29. Juli\", ort: \"Wien und Berlin\", akteur: \"Berchtold, Wilhelm II., Bethmann Hollweg\", r: 3, wahl: { oeu: [\"A\"], dr: [\"A\"] },\n    ausstieg: \"„Halt in Belgrad“: Belgrad nur als Pfand besetzen und verhandeln – selbst Wilhelm II. hielt den Kriegsgrund für entfallen.\",\n    warumNicht: \"Wien lehnte ab; Berlin drängte spät und halbherzig, während der Generalstab gleichzeitig zur Mobilmachung riet.\" },\n  { nr: 9, datum: \"29./30. Juli\", ort: \"St. Petersburg\", akteur: \"Zar Nikolaus II.\", r: 3, wahl: { ru: [\"A\", \"C\"] },\n    ausstieg: \"Bei der Teilmobilmachung bleiben oder sie anhalten – der Zar zögerte tatsächlich einen Abend lang.\",\n    warumNicht: \"Der Generalstab hielt eine Teilmobilmachung für undurchführbar und fürchtete den deutschen Vorsprung.\" },\n  { nr: 10, datum: \"1. August\", ort: \"Berlin\", akteur: \"Wilhelm II. und Moltke\", r: 4, wahl: { dr: [\"B\", \"C\"] },\n    ausstieg: \"Nicht im Westen angreifen und Belgiens Neutralität achten – damit wäre Großbritannien wohl neutral geblieben.\",\n    warumNicht: \"Es gab nur einen Aufmarschplan; Moltke erklärte einen reinen Ostaufmarsch für „undurchführbar“.\" }\n];\n\nJK.fazit = [\n  { text: \"„Und dennoch war der Erste Weltkrieg nicht unvermeidlich, er hätte bis kurz vor dem ersten Schuss gestoppt werden können. Aber keiner der europäischen Staatsmänner wagte eine solche wahrlich heldenhafte Aktion.“\", quelle: \"Hellfeld, Kap. 11, S. 250\" },\n  { text: \"Der Krieg hätte „bei mehr politischer Weitsicht und Urteilskraft vermieden werden können“.\", quelle: \"Herfried Münkler, Der Große Krieg, 2013; zit. n. Hellfeld, S. 250\" },\n  { text: \"„Kein einziges der Anliegen, für die die Politiker von 1914 stritten, war die darauffolgende Katastrophe wert.“\", quelle: \"Clark, Die Schlafwandler, S. 800\" }\n];\n\nJK.realismus = [\"kaum möglich\", \"eher schwer\", \"eher möglich\", \"gut möglich\"];\n\n/* ---------- Freischaltcodes für die Schülerversion ----------\n   Werden am Beamer angezeigt. In der Schülerdatei stehen nur Prüfsummen. */\nJK.codes = { r1: \"POTSDAM\", r2: \"KRONRAT\", r3: \"NISCH\", r4: \"LÜTTICH\", abschluss: \"RIEZLER\" };\n\n/* ---------- Faktencheck Hellfeld (Lehrerinformation) ---------- */\nJK.korrekturen = [\n  { s: \"246\", falsch: \"„Kaiser Wilhelm I.“ – Thronbesteigung im Juni 1888\", richtig: \"Wilhelm II. (Thronbesteigung 15. Juni 1888).\" },\n  { s: \"252\", falsch: \"Blankoscheck durch Bethmann Hollweg an Hoyos „in Leipzig“\", richtig: \"Wilhelm II. empfing am 5. Juli in Potsdam Botschafter Szögyény; Bethmann Hollweg bestätigte die Zusage am 6. Juli in Berlin.\" },\n  { s: \"252\", falsch: \"Bethmann am 10. Juli: „Sprung ins Dunkle“\", richtig: \"Beide Äußerungen sind im Tagebuch Kurt Riezlers überliefert (7. und 14. Juli 1914); Datierung im Text ungenau.\" },\n  { s: \"254\", falsch: \"Das Ultimatum enthielt „sechs Forderungen“\", richtig: \"Das Ultimatum umfasste zehn Punkte; brisant waren Punkt 5 und 6.\" },\n  { s: \"254\", falsch: \"Staatsbesuch „in Moskau“\", richtig: \"Der Besuch fand in St. Petersburg statt (so auch Hellfeld, S. 255).\" },\n  { s: \"255\", falsch: \"Poincaré „spekulierte darauf“, Elsass-Lothringen zurückzugewinnen\", richtig: \"Das ist eine Deutung, keine gesicherte Tatsache. Mit Schülern als Beispiel für Wertung in einer Darstellung nutzen.\" },\n  { s: \"256\", falsch: \"24. Juli: Russland gibt Beginn der Mobilmachung bekannt; 25. Juli: „Generalmobilmachung“ für die Bezirke Odessa, Kiew, Kasan, Moskau\", richtig: \"Beschlossen wurden die „Periode der Kriegsvorbereitung“ (ab 26.7.) und grundsätzlich eine Teilmobilmachung dieser vier Bezirke; verkündet wurde sie am 29. Juli.\" },\n  { s: \"256\", falsch: \"Österreich-Ungarn mobilisiert am 26. Juli an der Grenze zu Russland\", richtig: \"Am 25. Juli wurde die Teilmobilmachung gegen Serbien angeordnet; die Generalmobilmachung (auch gegen Russland) folgte am 31. Juli.\" },\n  { s: \"257\", falsch: \"Frankreich lehnte ein Vermittlungsangebot Asquiths ab\", richtig: \"Nicht belegt; im Spiel nicht verwendet.\" },\n  { s: \"257\", falsch: \"Serbien akzeptierte am 27. Juli das Ultimatum „in allen Punkten“\", richtig: \"Die Antwort erfolgte am 25. Juli. Sie war sehr entgegenkommend, lehnte aber die Beteiligung k. u. k. Organe an der Untersuchung (Punkt 6) ab. Serbien hatte schon vorher mobilisiert.\" },\n  { s: \"257\", falsch: \"Russland erklärte „die Teilmobilmachung der gesamten russischen Streitkräfte“\", richtig: \"Widersprüchlich: Die Teilmobilmachung (29.7.) betraf nur die vier Militärbezirke gegen Österreich-Ungarn.\" },\n  { s: \"258\", falsch: \"London teilte am 30. Juli mit, es werde nicht neutral bleiben\", richtig: \"Greys Warnung an Lichnowsky erfolgte am 29. Juli.\" },\n  { s: \"258\", falsch: \"Pfand für die französische Neu
