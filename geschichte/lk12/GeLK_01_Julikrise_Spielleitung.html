<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fünf Wochen im Sommer</title>
<style>
  :root { --bg: #f6f7f9; --flaeche: #fff; --ink: #12161c; --ink2: #4a5360; --linie: #12161c; --akzent: #0e2841; --fehler: #a3141e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1318; --flaeche: #161b22; --ink: #eef1f5; --ink2: #a9b2bf; --linie: #c9d0da; --akzent: #9dbbe6; --fehler: #ff8a8a; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 Calibri, "Segoe UI", Arial, sans-serif; }
  main { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
  form { background: var(--flaeche); border: 1.5px solid var(--linie); padding: 22px 22px 18px; }
  h1 { font-size: 24px; margin: 0 0 4px; } p { margin: 0 0 14px; color: var(--ink2); }
  label { display: block; font-weight: bold; margin-bottom: 4px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; min-height: 44px; border: 1.5px solid var(--linie); background: var(--flaeche); color: var(--ink); }
  .merken { font-weight: normal; display: flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 44px; }
  button { margin-top: 8px; font: inherit; font-weight: bold; min-height: 44px; padding: 8px 18px; border: 2px solid var(--akzent); background: var(--akzent); color: var(--bg); cursor: pointer; }
  #meldung { min-height: 1.5em; margin: 10px 0 0; color: var(--fehler); }
  #lade { display: none; color: var(--ink2); }
  .auto #f { display: none; } .auto #lade { display: block; }
</style>
<script>
// Ist ein Passwort gemerkt, erscheint statt der Maske nur „Wird geöffnet …“ (sonst blitzt die Maske bei jedem Seitenwechsel auf).
try { if (sessionStorage.getItem("unterricht_pw") || localStorage.getItem("unterricht_pw")) document.documentElement.classList.add("auto"); } catch (e) {}
</script>
</head>
<body>
<main>
  <p id="lade">Wird geöffnet …</p>
  <form id="f">
    <h1>Fünf Wochen im Sommer</h1>
    <p>Bitte das Passwort eingeben.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <label class="merken"><input id="merken" type="checkbox" checked> Auf diesem Gerät 30 Tage merken</label>
    <button type="submit">Öffnen</button>
    <p id="meldung" role="alert"></p>
  </form>
</main>

function lies(k) {
  try { const s = sessionStorage.getItem(k); if (s) return s; } catch (e) {}
  try { const d = JSON.parse(localStorage.getItem(k) || "null");
        if (d && d.bis > Date.now()) return d.pw; localStorage.removeItem(k); } catch (e) {}
  return null;
}
function lokal() { try { const d = JSON.parse(localStorage.getItem(SCHLUESSEL) || "null"); return !!(d && d.bis > Date.now()); } catch (e) { return false; } }
function merke(k, wert, dauerhaft) {
  try { sessionStorage.setItem(k, wert); } catch (e) {}
  if (dauerhaft) try { localStorage.setItem(k, JSON.stringify({ pw: wert, bis: Date.now() + TAGE * 864e5 })); } catch (e) {}
}
function vergiss() { [SCHLUESSEL, SCHL].forEach(k => { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {} }); }
const b64 = u => btoa(String.fromCharCode(...u));
const aus64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function entschluessele(pw, gemerkterSchluessel) {
  const roh = new Uint8Array(await (await fetch("data:application/octet-stream;base64," + DATEN)).arrayBuffer());
  const salz = roh.slice(0, 16), sb = b64(salz);
  let bits = null;
  if (gemerkterSchluessel) try { const o = JSON.parse(lies(SCHL) || "null"); if (o && o.s === sb) bits = aus64(o.k); } catch (e) {}
  if (!bits) {
    const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: salz, iterations: ITER, hash: "SHA-256" }, basis, 256));

  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const seite = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: roh.slice(16, 28) }, key, roh.slice(28)));
  return [seite, JSON.stringify({ s: sb, k: b64(bits) })];

// auto: Passwort kam aus dem Speicher (Seitenwechsel); dann zählt der gemerkte Schlüssel, und die 30 Tage verlängern sich nicht.
async function oeffne(pw, dauerhaft, auto) {
  const [seite, schl] = await entschluessele(pw, auto);
  merke(SCHLUESSEL, pw, dauerhaft && !auto);
  merke(SCHL, schl, auto ? lokal() : dauerhaft);
