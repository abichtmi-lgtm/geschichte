<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fünf Wochen im Sommer</title>
<style>
  :root { --bg: #f6f7f9; --flaeche: #fff; --ink: #12161c; --ink2: #4a5360; --linie: #12161c; --akzent: #0e2841; --fehler: #a3141e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1318; --flaeche: #161b22; --ink: #eef1f5; --ink2: #a9b2bf; --linie: #c9d0da; --akzent: #9dbbe6; --fehler: #ff8a8a; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 Calibri, "Segoe UI", Arial, sans-serif; }
  main { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
  form { background: var(--flaeche); border: 1.5px solid var(--linie); padding: 22px 22px 18px; }
  h1 { font-size: 24px; margin: 0 0 4px; } p { margin: 0 0 14px; color: var(--ink2); }
  label { display: block; font-weight: bold; margin-bottom: 4px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; min-height: 44px; border: 1.5px solid var(--linie); background: var(--flaeche); color: var(--ink); }
  .merken { font-weight: normal; display: flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 44px; }
  button { margin-top: 8px; font: inherit; font-weight: bold; min-height: 44px; padding: 8px 18px; border: 2px solid var(--akzent); background: var(--akzent); color: var(--bg); cursor: pointer; }
  #meldung { min-height: 1.5em; margin: 10px 0 0; color: var(--fehler); }
</style>
</head>
<body>
<main>
  <form id="f">
    <h1>Fünf Wochen im Sommer</h1>
    <p>Bitte das Passwort eingeben.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <label class="merken"><input id="merken" type="checkbox" checked> Auf diesem Gerät 30 Tage merken</label>
    <button type="submit">Öffnen</button>
    <p id="meldung" role="alert"></p>
  </form>
</main>

ER = 600000, SCHLUESSEL = "unterricht_pw", TAGE = 30;
function gemerkt() {
  try { const s = sessionStorage.getItem(SCHLUESSEL); if (s) return s; } catch (e) {}
  try { const d = JSON.parse(localStorage.getItem(SCHLUESSEL) || "null");
        if (d && d.bis > Date.now()) return d.pw; localStorage.removeItem(SCHLUESSEL); } catch (e) {}

function merke(pw, dauerhaft) {
